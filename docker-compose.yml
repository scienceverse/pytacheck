# pytacheck REST API + a self-hosted bibr extraction server.
#
#   export PYTACHECK_API_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(32))')
#   docker compose up
#   curl -H "Authorization: Bearer $PYTACHECK_API_KEY" -F file=@paper.pdf \
#        http://localhost:8000/paper/info               (routes: /docs, with the same header)
#
# The API needs a key (32 or more characters) on every route except /health, so
# compose refuses to start without PYTACHECK_API_KEY.
#
# pytacheck talks to bibr in-process when built with WITH_BIBR=1; the separate
# bibr service is for convert_bibr(backend = "selfhosted", api_url = "http://bibr:8000")
# and for sharing one warm extraction server between several clients.
services:
  pytacheck:
    build:
      context: .
      args:
        WITH_BIBR: "1"
    image: ghcr.io/scienceverse/pytacheck:bibr
    command: ["serve", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      PYTACHECK_API_KEY: ${PYTACHECK_API_KEY:?set PYTACHECK_API_KEY to a random string of 32 or more characters}
      PYTACHECK_EMAIL: ${PYTACHECK_EMAIL:-}
      PYTACHECK_BIBR_URL: http://bibr:8000
    volumes:
      - pytacheck-cache:/cache
    depends_on:
      - bibr

  bibr:
    image: ghcr.io/scienceverse/bibr:latest
    ports:
      - "8001:8000"
    volumes:
      - bibr-cache:/root/.cache

volumes:
  pytacheck-cache:
  bibr-cache:
