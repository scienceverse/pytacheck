name: Docker

# Builds, smoke-tests, scans and pushes two images to GHCR:
#   ghcr.io/<owner>/pytacheck:<tag>        core + data readers + REST API
#   ghcr.io/<owner>/pytacheck:<tag>-bibr   + bibr (reads PDF/DOCX/HTML directly)
# Tags: edge (main), X.Y.Z and latest (release tags).

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/pytacheck

jobs:
  image:
    name: Image (${{ matrix.variant }})
    runs-on: >-
      ${{ github.event.repository.private &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
      && vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: core
            with_bibr: "0"
            suffix: ""
          - variant: bibr
            with_bibr: "1"
            suffix: "-bibr"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.0.0
      - name: Tags
        id: tags
        run: |
          image="${IMAGE,,}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"
            echo "tags=$image:$v${{ matrix.suffix }},$image:latest${{ matrix.suffix }}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$image:edge${{ matrix.suffix }}" >> "$GITHUB_OUTPUT"
          fi
          echo "local=pytacheck-ci:${{ matrix.variant }}" >> "$GITHUB_OUTPUT"
      - name: Build (load for testing)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.0.0
        with:
          context: .
          load: true
          tags: ${{ steps.tags.outputs.local }}
          build-args: WITH_BIBR=${{ matrix.with_bibr }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
      - name: Smoke test
        run: |
          docker run --rm "${{ steps.tags.outputs.local }}" version
          docker run --rm "${{ steps.tags.outputs.local }}" modules
          docker run --rm --entrypoint python "${{ steps.tags.outputs.local }}" -c \
            "import pytacheck as pc; print(pc.module_run(pc.demopaper(), 'marginal'))"
      - name: Vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.tags.outputs.local }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.0.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          build-args: WITH_BIBR=${{ matrix.with_bibr }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
