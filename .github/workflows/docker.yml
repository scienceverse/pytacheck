name: Docker

# Builds, smoke-tests, scans and pushes two images to GHCR:
#   ghcr.io/<owner>/pytacheck:<tag>        core + data readers + REST API
#   ghcr.io/<owner>/pytacheck:<tag>-bibr   + bibr (reads PDF/DOCX/HTML directly)
# Tags: edge (main), X.Y.Z and latest (release tags).
#
# Runs on the self-hosted fridge runner (label pytacheck-fridge-ci), a shared
# service host: BuildKit is capped at 6 CPUs and 32 GB, and QEMU (for the
# arm64 half of the pushed image; its binfmt handler is registered host-wide
# until reboot) is only set up when an image is pushed. Fork PRs are refused by
# the job `if`. The runner's Docker daemon persists between jobs, so the image
# loaded for testing gets a per-run tag and is removed at the end, and the GHCR
# login goes to a per-job Docker client config, not the shared ~/.docker.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/pytacheck

jobs:
  image:
    name: Image (${{ matrix.variant }})
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, pytacheck-fridge-ci]
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: core
            with_bibr: "0"
            suffix: ""
          - variant: bibr
            with_bibr: "1"
            suffix: "-bibr"
    steps:
      # The fleet's runners share one OS user: a GHCR login in ~/.docker would
      # overwrite, and its logout delete, the login of another repository's
      # concurrent image job (bibr-private also pushes to ghcr.io from fridge).
      - name: Per-job Docker client config
        run: |
          install -d -m 0700 "$RUNNER_TEMP/docker-config"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker-config" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          persist-credentials: false
      # arm64 emulation for the multi-platform push only (the PR build is native)
      - if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.0.0
        with:
          # the fleet cap for image builds on the shared host (as bibr-private's)
          driver-opts: memory=32g,cpu-quota=600000,cpu-period=100000
      - name: Tags
        id: tags
        run: |
          image="${IMAGE,,}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"
            echo "tags=$image:$v${{ matrix.suffix }},$image:latest${{ matrix.suffix }}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$image:edge${{ matrix.suffix }}" >> "$GITHUB_OUTPUT"
          fi
          # unique per run: the host's Docker daemon is shared and persistent
          echo "local=pytacheck-ci:${{ matrix.variant }}-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - name: Build (load for testing)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.0.0
        with:
          context: .
          load: true
          tags: ${{ steps.tags.outputs.local }}
          build-args: WITH_BIBR=${{ matrix.with_bibr }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
      - name: Smoke test
        run: |
          docker run --rm "${{ steps.tags.outputs.local }}" version
          docker run --rm "${{ steps.tags.outputs.local }}" modules
          docker run --rm --entrypoint python "${{ steps.tags.outputs.local }}" -c \
            "import pytacheck as pc; print(pc.module_run(pc.demopaper(), 'marginal'))"
      - name: Vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.tags.outputs.local }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.0.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          build-args: WITH_BIBR=${{ matrix.with_bibr }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Remove the local test image
        if: always() && steps.tags.outputs.local != ''
        run: docker image rm "${{ steps.tags.outputs.local }}" || true
