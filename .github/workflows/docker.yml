name: Docker

# Builds, smoke-tests, scans and pushes two images to GHCR:
#   ghcr.io/<owner>/pytacheck:<tag>        core + data readers + REST API
#   ghcr.io/<owner>/pytacheck:<tag>-bibr   + bibr (reads PDF/DOCX/HTML directly)
# Tags: edge (main), X.Y.Z and latest (release tags).
#
# Runs on the runner the CI_RUNNER variable names, by the rule in ci.yml, else
# on GitHub's runners. The self-hosted fridge runner (pytacheck-fridge-ci) is a
# shared service host: the runner has its own OS user and its own rootless
# Docker daemon; everything that user runs, containers and BuildKit included,
# is capped at 4 CPUs and 16 GB, and BuildKit asks for 4 CPUs and 12 GB of that.
# There the arm64 half of the pushed image runs under the host's QEMU binfmt
# handler (a rootless daemon cannot register one). The Docker daemon persists
# between jobs, so the image loaded for testing gets a per-run tag and is
# removed at the end, and the GHCR login goes to a per-job Docker client config
# instead of the runner user's ~/.docker.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/pytacheck

jobs:
  image:
    name: Image (${{ matrix.variant }})
    runs-on: >-
      ${{ github.event.repository.private &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
      && vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: core
            with_bibr: "0"
            suffix: ""
          - variant: bibr
            with_bibr: "1"
            suffix: "-bibr"
    steps:
      # ~/.docker persists between jobs: a GHCR login there would outlive this
      # job and be visible to every later job on the runner.
      - name: Per-job Docker client config
        run: |
          install -d -m 0700 "$RUNNER_TEMP/docker-config"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker-config" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          persist-credentials: false
      # arm64 emulation for the multi-platform push. On a GitHub-hosted VM
      # setup-qemu-action registers it; it cannot from a rootless daemon, so a
      # self-hosted runner's host provides the handler (qemu-user-static), checked
      # before a push (the PR build is native). Flag F keeps the interpreter
      # usable inside the build's containers and user namespace.
      - if: runner.environment == 'github-hosted'
        uses: docker/setup-qemu-action@v4
      - name: Check arm64 emulation
        if: runner.environment == 'self-hosted' && github.event_name != 'pull_request'
        run: |
          f=/proc/sys/fs/binfmt_misc/qemu-aarch64
          if ! grep -qx enabled "$f" 2>/dev/null || ! grep -q '^flags:.*F' "$f"; then
            echo "::error::no enabled qemu-aarch64 binfmt handler with flag F on this host (install qemu-user-static)"
            exit 1
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.0.0
        with:
          # inside the fridge runner user's slice cap (4 CPUs, 16 GB); on a
          # smaller hosted VM only an upper bound
          driver-opts: memory=12g,cpu-quota=400000,cpu-period=100000
      - name: Tags
        id: tags
        run: |
          image="${IMAGE,,}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"
            if [[ "$v" =~ [0-9](a|b|rc)[0-9]+$ ]]; then latest=""; else latest=",$image:latest${{ matrix.suffix }}"; fi
            echo "tags=$image:$v${{ matrix.suffix }}$latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$image:edge${{ matrix.suffix }}" >> "$GITHUB_OUTPUT"
          fi
          # unique per run: the runner's Docker daemon persists between jobs
          echo "local=pytacheck-ci:${{ matrix.variant }}-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - name: Build (load for testing)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.0.0
        with:
          context: .
          load: true
          tags: ${{ steps.tags.outputs.local }}
          build-args: WITH_BIBR=${{ matrix.with_bibr }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
      - name: Smoke test
        run: |
          docker run --rm "${{ steps.tags.outputs.local }}" version
          docker run --rm "${{ steps.tags.outputs.local }}" modules
          docker run --rm --entrypoint python "${{ steps.tags.outputs.local }}" -c \
            "import pytacheck as pc; print(pc.module_run(pc.demopaper(), 'marginal'))"
      - name: Vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.tags.outputs.local }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.0.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          build-args: WITH_BIBR=${{ matrix.with_bibr }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Remove the local test image
        if: always() && steps.tags.outputs.local != ''
        run: docker image rm "${{ steps.tags.outputs.local }}" || true
