name: Release

# Publishes to PyPI with trusted publishing (no API tokens) when a v* tag is
# pushed. Configure the "pypi" environment and a trusted publisher for this
# workflow on pypi.org first (Project > Publishing).
#
# Building and the GitHub release run on the runner the CI_RUNNER variable
# names, by the rule in ci.yml, else on GitHub's runners. The PyPI upload stays
# on a GitHub-hosted runner: PyPA supports gh-action-pypi-publish there, and its
# recommended split is to build on a self-hosted runner and publish the artifact
# from a GitHub-hosted one. Only tag pushes and manual runs trigger this
# workflow, never fork PRs.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify
    runs-on: >-
      ${{ github.event.repository.private &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
      && vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      UV_PYTHON_PREFERENCE: only-managed # not the runner's Python (see ci.yml)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          persist-credentials: false
          submodules: true
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.9.8"
          python-version: "3.12"
      - name: Tag matches project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # uv's Python: Debian (the runner) ships no `python` command
          version=$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - run: uv sync --locked --all-extras
      - uses: ./.github/actions/xdist-workers
      - run: uv run pytest -n auto -m "not network and not r"
      - run: uv build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    # GitHub-hosted on purpose (see the header)
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    name: GitHub release
    needs: publish
    runs-on: >-
      ${{ github.event.repository.private &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
      && vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Into $RUNNER_TEMP, not the workspace: this job has no checkout to clean
      # it, and the runner's persistent workspace can still hold a dist/ from
      # another job's `uv build`, which `dist/*` would attach to the release.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: dist
          path: ${{ runner.temp }}/dist
      # The installers and the pinned dependency list, attached next to the
      # built files (the checkout is sparse: only these three files).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: |
            install.sh
            install.ps1
            install/constraints-app.txt
            parity/UPSTREAM.toml
          sparse-checkout-cone-mode: false
          path: extras
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # a version with a, b or rc (PEP 440 pre-release) is marked as one
          flags=()
          if [[ "$GITHUB_REF_NAME" =~ [0-9](a|b|rc)[0-9]+$ ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/dist/* \
            extras/install.sh extras/install.ps1 extras/install/constraints-app.txt \
            --repo "$GITHUB_REPOSITORY" --generate-notes \
            --notes "Compared against metacheck (R) $(grep -m1 '^commit' extras/parity/UPSTREAM.toml | cut -d'"' -f2); see CHANGELOG.md." "${flags[@]}"
