name: Parity (R reference)

# Regenerates every golden by running metacheck in R at the pinned commit and
# fails if any golden differs from the committed one, so the goldens that
# `pytest` compares against can never drift from R. The same for the accuracy
# report's R outputs (parity/accuracy/golden). Then runs the Python side and
# the accuracy gate.
#
# Runs on the self-hosted fridge runner (label pytacheck-fridge-ci; Debian, not
# Ubuntu). R still comes from the exact conda-forge lock, which does not depend
# on the host distribution. The runner persists between jobs, so micromamba and
# the R environment live under $RUNNER_TEMP and are gone after the job (the next
# run restores the pristine environment from the cache), and the runner user's
# shell profile is left alone. Fork PRs are refused by the job `if`.

on:
  pull_request:
    paths:
      - "parity/**"
      - "upstream/**"
      - ".github/workflows/parity.yml"
  push:
    branches: [main]
    paths:
      - "parity/**"
      - "upstream/**"
  schedule:
    - cron: "17 4 * * 1" # weekly
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    name: Regenerate goldens with R and compare
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, pytacheck-fridge-ci]
    # `parity generate` runs every case in R one after another: about half an
    # hour on a GitHub-hosted VM, closer to an hour on the fridge runner, whose
    # jobs run niced under the host's own work.
    timeout-minutes: 120
    env:
      UV_PYTHON_PREFERENCE: only-managed # not the runner's Python (see ci.yml)
    defaults:
      run:
        # Every step in the activated R environment. Not a login shell
        # (`bash -el`): Debian's /etc/profile resets PATH, dropping the tools
        # setup-uv and setup-micromamba put on it.
        shell: micromamba run -n r-reference bash -e {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          persist-credentials: false
          submodules: true

      - name: R reference environment (exact conda-forge builds)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: parity/r/conda-linux-64.lock
          environment-name: r-reference
          cache-environment: true
          # Binary and root under $RUNNER_TEMP, which the runner empties per job:
          # the default ~/micromamba-bin/micromamba survives the job, and the
          # next run's download refuses an existing destination and fails.
          micromamba-binary-path: ${{ runner.temp }}/micromamba-bin/micromamba
          micromamba-root-path: ${{ runner.temp }}/micromamba
          init-shell: none
          post-cleanup: environment

      - name: Install httptest2 and metacheck at the pinned commits, and careless
        env:
          # non-ASCII names in metacheck's code only survive a UTF-8 install locale
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: |
          git clone --quiet https://github.com/nealrichardson/httptest2.git "$RUNNER_TEMP/httptest2"
          git -C "$RUNNER_TEMP/httptest2" checkout --quiet 37efe13ff4c51504570c5e6ac2d93fff71a416a2
          R CMD INSTALL "$RUNNER_TEMP/httptest2"
          R CMD INSTALL --no-test-load upstream/metacheck
          # metacheck's suggested careless, in the library only the accuracy report loads
          Rscript parity/r/install-suggests.R
          echo "PYTACHECK_RSCRIPT=$(command -v Rscript)" >> "$GITHUB_ENV"

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.9.8"
          python-version: "3.12"
      - run: uv sync --locked --all-extras

      - name: Regenerate all goldens
        run: uv run python -m parity generate

      - name: Regenerate the accuracy report's R outputs, and score them
        run: >-
          uv run python -m parity accuracy --generate --gate
          --report parity/_out/accuracy.json --md "$GITHUB_STEP_SUMMARY"

      - name: Goldens must match the committed ones
        if: always()
        run: |
          if ! git diff --quiet -- parity/golden parity/accuracy/golden; then
            git diff --stat -- parity/golden parity/accuracy/golden
            echo "::error::Goldens regenerated from R differ from the committed goldens."
            exit 1
          fi
          untracked=$(git ls-files --others --exclude-standard -- parity/golden parity/accuracy/golden)
          if [ -n "$untracked" ]; then
            echo "$untracked"
            echo "::error::Cases or accuracy modules without committed goldens."
            exit 1
          fi

      - name: Python matches R
        if: always()
        run: >-
          uv run python -m parity check --jobs 0
          --report parity/_out/report.json --md "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: parity-report
          path: |
            parity/_out/report.json
            parity/_out/accuracy.json
