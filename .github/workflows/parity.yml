name: Parity (R reference)

# Regenerates every golden by running metacheck in R at the pinned commit and
# fails if any golden differs from the committed one, so the goldens that
# `pytest` compares against can never drift from R. Then runs the Python side.

on:
  pull_request:
    paths:
      - "parity/**"
      - "upstream/**"
      - ".github/workflows/parity.yml"
  push:
    branches: [main]
    paths:
      - "parity/**"
      - "upstream/**"
  schedule:
    - cron: "17 4 * * 1" # weekly
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    name: Regenerate goldens with R and compare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          persist-credentials: false
          submodules: true

      - name: R reference environment (exact conda-forge builds)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: parity/r/conda-linux-64.lock
          environment-name: r-reference
          cache-environment: true

      - name: Install metacheck at the pinned commit
        run: |
          R CMD INSTALL --no-test-load upstream/metacheck
          echo "PYTACHECK_RSCRIPT=$(command -v Rscript)" >> "$GITHUB_ENV"

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.9.8"
          python-version: "3.12"
      - run: uv sync --locked --all-extras

      - name: Regenerate all goldens
        run: uv run python -m parity generate

      - name: Goldens must match the committed ones
        run: |
          if ! git diff --quiet -- parity/golden; then
            git diff --stat -- parity/golden
            echo "::error::Goldens regenerated from R differ from the committed goldens."
            exit 1
          fi
          untracked=$(git ls-files --others --exclude-standard -- parity/golden)
          if [ -n "$untracked" ]; then
            echo "$untracked"
            echo "::error::Cases without committed goldens."
            exit 1
          fi

      - name: Python matches R
        run: uv run python -m parity check

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: parity-report
          path: parity/_out/report.json
