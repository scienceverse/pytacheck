name: CI

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.8"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify lockfile
        run: uv lock --check
      - name: Install locked dependencies
        run: uv sync --frozen --all-groups
      - name: Ruff
        run: uv run ruff check .
      - name: Ruff formatting
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy pytacheck
      - name: Tests
        run: uv run pytest -q
      - name: Build distributions
        run: uv run python -m build
      - name: Wheel import and CLI smoke
        run: |
          uv venv .wheel-venv --python "${{ matrix.python-version }}"
          uv pip install --python .wheel-venv/bin/python dist/*.whl
          .wheel-venv/bin/python -c "import pytacheck, pytacheck.api; print(pytacheck.__version__)"
          .wheel-venv/bin/pytacheck --help
      - name: Benchmark smoke
        run: uv run python -m benchmarks.benchmark_default_modules --iterations 2

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        run: docker build --tag pytacheck:ci .
