# helpers standing in for R/package functions and for the code the R files duplicate
[helpers]
"*_links() text_search(return = 'match') part, prefiltered on literals" = "pytacheck.archives.dataone:_scan_links"
".<archive>_id() single-value body (trimws, simple id, regexec patterns)" = "pytacheck.archives.reshare:_id_one"
"length 0 / length > 1 vapply dispatch of the .<archive>_id() functions" = "pytacheck.archives.dataone:_map"
"psycharchives_info() / rbox_info() / fsd_info() body" = "pytacheck.archives.psycharchives:_info_loop"
"reshare_info() / mendeley_info() body" = "pytacheck.archives.reshare:_info_by_id"
".repo_info_cache_get/put around a lookup" = "pytacheck.archives.psycharchives:_cached"
"df$ext <- strsplit(name, '\\.') ...; left_join(df, metacheck::file_types, by = 'ext')" = "pytacheck.archives.psycharchives:_add_ext_type"
"tryCatch(httr2 GET, Accept json; 200 ? resp_body_json : NULL)" = "pytacheck.archives.psycharchives:_rest_json"
"obj$x <- list(value) (a list/table cell)" = "pytacheck.archives.psycharchives:_obj_cell"
"x[[name]] on parsed JSON" = "pytacheck.archives.dspace7:_bracket"
"xml2::read_xml() (NOBLANKS)" = "pytacheck.archives.dataone:_read_xml"
"xml2::xml_find_first()" = "pytacheck.archives.dataone:_find_first"
"xml2::xml_text()" = "pytacheck.archives.dataone:_xml_text"
"xml2::xml_name()" = "pytacheck.archives.dataone:_local_name"
"xml2::xml_ns_strip()" = "pytacheck.archives.fsd:_strip_default_ns"
"suppressWarnings(as.integer(x))" = "pytacheck.archives.fsd:_as_integer"
"httr2::resp_body_string()" = "pytacheck.archives.researchbox:_body_string"
"list.files(recursive = TRUE)" = "pytacheck.archives.researchbox:_list_files"
"utils::unzip()" = "pytacheck.archives.researchbox:_unzip"
"POST download_files.php (req_body_json, req_perform(path))" = "pytacheck.archives.researchbox:_download_zip"
".repo_cache_subdir() (fallback until R/repo-download.R is ported)" = "pytacheck.archives.researchbox:_cache_subdir"
