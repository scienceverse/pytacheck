# R source -> Python location for the reproducibility-check core (see docs/PORTING.md).
# R/module.R's module-table capture (capture_module_tables(), collect_module_tables(),
# .load_module_tables()) lives in metacheck.repro.tables; the rest of R/module.R is
# mapped in foundation.toml.
[files]
"R/reproducibility_check.R" = [
    "src/metacheck/repro/core.py",
    "src/metacheck/repro/layout.py",
    "src/metacheck/repro/outcomes.py",
    "src/metacheck/repro/recorded.py",
    "src/metacheck/repro/runsupport.py",
]
"R/reproducibility_check_docker.R" = ["src/metacheck/repro/docker.py"]
# metacheck d3b8594 (after the f1062b4 pin): Python support
"R/reproducibility_check_python.R" = ["src/metacheck/repro/python.py"]
"R/reproducibility_check_python_docker.R" = ["src/metacheck/repro/docker.py"]
"R/module.R" = ["src/metacheck/repro/tables.py"]
# metacheck 0.4.3.7 (4a61888): the checklist section and the not_analysis decision
"R/reproducibility_check_section.R" = ["src/metacheck/repro/section.py"]
"R/reproducibility_check_software.R" = ["src/metacheck/repro/software.py"]

