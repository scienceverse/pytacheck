"%empty_or%" = "metacheck.archives.github:_empty_or"
"metacheck::file_types" = "metacheck.fileinfo.types:file_types"
"gitcreds::gitcreds_get" = "metacheck.archives.github:_github_token"
"tools::md5sum" = "metacheck.archives.zenodo:_md5sum"
".is_zip (fallback until metacheck.archives.zip_peek exists)" = "metacheck.archives.zenodo:_is_zip"
"list.files(recursive = TRUE)" = "metacheck.archives.zenodo_upload:_list_rel"
"utils::zip" = "metacheck.archives.zenodo_upload:_make_zip"
"utils::menu" = "metacheck.archives.zenodo_upload:_menu"
"httr2::req_body_json (jsonlite, auto_unbox)" = "metacheck.archives.zenodo_upload:_json_body"
"attr(md, 'license_was_default')" = "metacheck.archives.zenodo_upload:ZenodoMetadata"
