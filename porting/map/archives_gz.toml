# helpers standing in for R/package functions used by this area
[helpers]
"httr2::req_perform (req_error(is_error = FALSE), no retry)" = "metacheck.archives.github:_perform"
"httr2::resp_body_json" = "metacheck.archives.github:_body_json"
"tools::file_ext" = "metacheck.archives.github:_file_ext"
