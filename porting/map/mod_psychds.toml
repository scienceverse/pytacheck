# R source -> Python location for the Psych-DS check module (see docs/PORTING.md).
# Parity: fake data_check chains (tests/mod_psychds/fixtures/chains.json, built by
# tests/mod_psychds/fake_chain.R and parity_support.py); cases are generated by
# tests/mod_psychds/gen_parity_cases.py. Review cases (area mod_psychds_review) come from
# tests/mod_psychds/gen_review_cases.py and fixtures/review_chains.json.
[files]
"inst/modules/psychds_check.R" = ["src/metacheck/modules/psychds_check.py"]
# the file plan psychds_check reports and reproducibility_check uses (metacheck 029bf63)
"R/psychds-file-plan.R" = ["src/metacheck/datacheck/psychds.py"]

[functions]
"module:psychds_check" = "metacheck.modules.psychds_check:psychds_check"
# module-local helpers defined in inst/modules/psychds_check.R
"psychds_tree_html" = "metacheck.modules.psychds_check:psychds_tree_html"
psychds_file_plan = "metacheck.datacheck.psychds:psychds_file_plan"
# (closures inside psychds_check() are ported alongside it: .pid -> _pid, scaffold
#  inline; psychds_file_plan()'s keyword_slug -> _keyword_slug and
#  target_of/same_dir_real_name are in metacheck.datacheck.psychds)
# metacheck 0.4.3.7 (4a61888); the sub-folder logic of psychds_file_plan() is _plan_sub_dirs
".plan_strip_archive" = "metacheck.datacheck.psychds:_plan_strip_archive"
".plan_relative_paths" = "metacheck.datacheck.psychds:_plan_relative_paths"
".plan_readme_folder" = "metacheck.datacheck.psychds:_plan_readme_folder"
