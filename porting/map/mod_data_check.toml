# R source -> Python location for the data_check module (see docs/PORTING.md).
# Parity: parity/cases/mod_data_check.yaml (written by tests/mod_data_check/make_cases.py),
# goldens parity/golden/mod_data_check/. The module cases chain data_check onto a
# repo_check output listing fixture repositories (tests/mod_data_check/fixtures/
# make_fixtures.R -> fixtures/repos/, scenarios.json; built by
# tests/mod_data_check/dc_helpers.R and helpers.py), a few run the real pipeline
# (local_path -> repo_check). Downloads are parity-tested with file:// URLs; the
# LLM passes with a deterministic llm() mock (fixtures/llm_mock.json); the
# careless-responding path with the vendored longstring()/irv() of the careless
# package (fixtures/careless, loaded with pkgload in R).
[files]
"inst/modules/data_check.R" = ["src/pytacheck/modules/data_check.py", "src/pytacheck/modules/_data_check.py"]

[functions]
"module:data_check" = "pytacheck.modules.data_check:data_check"
# closures inside data_check() (the generic ones -- .pid, pad, getf, empty,
# label_of, utf8_repaired_of -- are private helpers of data_check.py:
# _pid, _pad, _file_columns, _validate, _label_lookup, _utf8_lookup)
".tree_type_icon" = "pytacheck.modules._data_check:_tree_type_icon"
".tree_type_label" = "pytacheck.modules._data_check:_tree_type_label"
"repo_tree_rows" = "pytacheck.modules._data_check:repo_tree_rows"
