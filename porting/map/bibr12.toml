# R source -> Python location for bibr export schema 12.x (metacheck PR #423;
# see docs/PORTING.md). bibr export schema 12.0 is the schema pytacheck targets.
[files]
"R/import-bibr12.R" = ["src/metacheck/io/bibr12.py", "src/metacheck/papers/schema.py"]
"inst/schema/paper-bibr12.json" = ["src/metacheck/resources/schema/paper-bibr12.json"]
# the 12.x parts of shared files
"R/import-read.R" = ["src/metacheck/papers/io.py", "src/metacheck/io/read.py"]
"R/paper.R" = ["src/metacheck/papers/io.py", "src/metacheck/papers/validate.py", "src/metacheck/papers/schema.py"]
"R/match-table.R" = ["src/metacheck/statout/match_table.py"]
"inst/modules/ref_accuracy.R" = ["src/metacheck/modules/ref_accuracy.py"]
"inst/modules/ref_consistency.R" = ["src/metacheck/modules/ref_consistency.py"]
"inst/modules/ref_miscitation.R" = ["src/metacheck/modules/ref_miscitation.py"]
"tests/testthat/test-import-bibr12.R" = ["tests/bibr12/test_import_bibr12.py"]
"tests/testthat/helper-bibr12.R" = ["tests/bibr12/test_import_bibr12.py"]

[functions]
# R/import-bibr12.R
".paper_schema_bibr12" = "metacheck.papers.schema:load_schema_bibr12"
".is_bibr12" = "metacheck.io.bibr12:is_bibr12"
".bibr12_paper_ids" = "metacheck.io.bibr12:_bibr12_paper_ids"
".bibr12_df" = "metacheck.io.bibr12:_bibr12_df"
".bibr12_rows" = "metacheck.io.bibr12:_bibr12_rows"
".bibr12_info" = "metacheck.io.bibr12:_bibr12_info"
".bibr12_paper" = "metacheck.io.bibr12:_bibr12_paper"
".read_bibr12" = "metacheck.io.bibr12:read_bibr12"
".paper_to_bibr12" = "metacheck.io.bibr12:paper_to_bibr12"
".bibr12_doi" = "metacheck.io.bibr12:_bibr12_doi"
".bibr12_bib_type" = "metacheck.io.bibr12:_bibr12_bib_type"
".bibr12_sha256" = "metacheck.io.bibr12:_bibr12_sha256"
