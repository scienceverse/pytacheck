# R source -> Python location for the codebook_check module (see docs/PORTING.md).
# Parity: parity/cases/mod_codebook.yaml (written by tests/mod_codebook/make_cases.py),
# goldens parity/golden/mod_codebook/. The module cases chain codebook_check onto
# metacheck's own data_check output for small fixture repositories
# (tests/mod_codebook/fixtures/make_fixtures.R -> fixtures/repos/, fixtures/dc/;
# rebuilt by tests/mod_codebook/cbc_helpers.R and helpers.py); LLM tiers are
# parity-tested with a deterministic llm() mock (fixtures/llm_mock.json).
# Review cases: parity/cases/mod_codebook_review.yaml (written by
# tests/mod_codebook/make_review_cases.py; fixtures from
# tests/mod_codebook/fixtures/make_review_fixtures.R -> fixtures/dc_review/,
# adversarial LLM answers in fixtures/llm_review.json), goldens
# parity/golden/mod_codebook_review/.
[files]
"inst/modules/codebook_check.R" = ["src/metacheck/modules/codebook_check.py", "src/metacheck/modules/_codebook.py"]

[functions]
"module:codebook_check" = "metacheck.modules.codebook_check:codebook_check"
# closures inside codebook_check()
".pid" = "metacheck.modules.codebook_check:_pid"
"empty_summary" = "metacheck.modules.codebook_check:_empty_summary"
"apply_scale" = "metacheck.modules.codebook_check:_codebook_check"
# module-local helpers defined in inst/modules/codebook_check.R
