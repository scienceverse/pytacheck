# R source -> Python location for data_check helpers part 3: data-quality checks, PII
# detection, demographics, column concepts/facets, Qualtrics / offset-header repair,
# trial-level format detection and scale/task block detection (see docs/PORTING.md).
# R/data_check_helpers.R is split across areas: lines 4623-end (data_check_scale_values
# onwards) are ported here; earlier lines live in metacheck.datacheck.files / .columns.
# Every function is importable from metacheck.datacheck.checks (split by theme into
# the private _checks_*.py modules). Block/header detectors return 0-based positions.
# Data: data/scales.rda and data/tasks.rda -> src/metacheck/resources/data/{scales,tasks}.json.gz
# via scripts/convert_datacheck_data.R. Cases: tests/datacheck_checks/gen_parity_cases.py
# (fixtures: tests/datacheck_checks/data/make_fixtures.py); goldens: parity/golden/datacheck_checks/.
# Review cases (area datacheck_checks_review: fixed divergences, error paths, seeded
# batteries for strptime() and the value classifiers): tests/datacheck_checks/gen_review_cases.py.
[files]
"R/data_check_helpers.R" = ["src/metacheck/datacheck/checks.py", "src/metacheck/datacheck/_checks_quality.py", "src/metacheck/datacheck/_checks_pii.py", "src/metacheck/datacheck/_checks_facets.py", "src/metacheck/datacheck/_checks_format.py", "src/metacheck/datacheck/_checks_blocks.py", "src/metacheck/datacheck/_checks_rvec.py"]
"R/scales.R" = ["src/metacheck/datacheck/scales.py"]
"R/tasks.R" = ["src/metacheck/datacheck/tasks.py"]
"data/scales.rda" = ["src/metacheck/resources/data/scales.json.gz", "scripts/convert_datacheck_data.R"]
"data/tasks.rda" = ["src/metacheck/resources/data/tasks.json.gz", "scripts/convert_datacheck_data.R"]

