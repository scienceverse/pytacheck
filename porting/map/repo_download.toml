# R source -> Python location for repo_download (repository file downloads, zip
# peeking, file categories/types/naming; see docs/PORTING.md).
#
# data/file_types.rda is converted by scripts/convert_data.R into
# src/pytacheck/resources/data/file_types.json.gz (loaded by
# pytacheck.resources.data.load_data and pytacheck.fileinfo.types). The storage
# retry policy of httr2's req_retry() as metacheck configures it is
# download.py's _storage_request(); the per-host rate-limit record
# (.host_rate_limit_cache) is pytacheck.http's host reset memory; R's
# format(<object_size>, units = "auto") in repo_cache_clear() is
# download.py's _format_object_size().
[files]
"R/repo-download.R" = ["src/pytacheck/archives/download.py"]
"R/zip-peek.R" = ["src/pytacheck/archives/zip_peek.py"]
"R/file_category.R" = ["src/pytacheck/fileinfo/category.py"]
"R/file_types.R" = ["src/pytacheck/fileinfo/types.py"]
"R/file-naming.R" = ["src/pytacheck/fileinfo/naming.py"]
"data/file_types.rda" = ["src/pytacheck/resources/data/file_types.json.gz", "src/pytacheck/fileinfo/types.py", "scripts/convert_data.R"]
"data-raw/file_types.R" = ["scripts/convert_data.R"]

[functions]
# R/repo-download.R
".repo_cache_dir" = "pytacheck.archives.download:_repo_cache_dir"
