".repo_cache_path" = "pytacheck.archives.download:_repo_cache_path"
".repo_session_dir" = "pytacheck.archives.download:_repo_session_dir"
repo_cache_dir = "pytacheck.archives.download:repo_cache_dir"
repo_cache_size = "pytacheck.archives.download:repo_cache_size"
repo_cache_clear = "pytacheck.archives.download:repo_cache_clear"
".remote_size" = "pytacheck.archives.download:_remote_size"
".remote_content_length" = "pytacheck.archives.download:_remote_content_length"
".auth_for_url" = "pytacheck.archives.download:_auth_for_url"
".is_login_page" = "pytacheck.archives.download:_is_login_page"
".storage_is_transient" = "pytacheck.archives.download:_storage_is_transient"
".storage_backoff" = "pytacheck.archives.download:_storage_backoff"
".rate_limit_wait" = "pytacheck.archives.download:_rate_limit_wait"
".host_rate_limit_record" = "pytacheck.archives.download:_host_rate_limit_record"
".host_rate_limit_remaining" = "pytacheck.archives.download:_host_rate_limit_remaining"
".format_wait_duration" = "pytacheck.archives.download:_format_wait_duration"
".announce_rate_limit_wait" = "pytacheck.archives.download:_announce_rate_limit_wait"
