# R source -> Python location for repo_download (repository file downloads, zip
# peeking, file categories/types/naming; see docs/PORTING.md).
#
# data/file_types.rda is converted by scripts/convert_data.R into
# src/metacheck/resources/data/file_types.json.gz (loaded by
# metacheck.resources.data.load_data and metacheck.fileinfo.types). The storage
# retry policy of httr2's req_retry() as metacheck configures it is
# metacheck.http.request() (the one retry, redirect and rate-limit stack) with
# download.py's _storage_request() on top; the per-host rate-limit record
# (.host_rate_limit_cache) is metacheck.http's host reset memory; R's
# format(<object_size>, units = "auto") in repo_cache_clear() is
# download.py's _format_object_size(). Base R / package internals metacheck
# relies on are emulated where their behaviour shows in the results: R's
# internal unzip (zip_peek.py's _unzip_all(): "../" components dropped, names
# used byte for byte, minizip's header checks), GNU tar as utils::untar() runs
# it (_untar_all()), httr2's HTTP error messages (download.py's _HttpError:
# resp_status_desc() wording, resp_auth_message() bullets), and R's handling
# of strings that are not valid UTF-8 (fileinfo/_strings.py; CP437 zip names).
[files]
"R/repo-download.R" = ["src/metacheck/archives/download.py", "src/metacheck/fileinfo/_strings.py"]
"R/zip-peek.R" = ["src/metacheck/archives/zip_peek.py", "src/metacheck/fileinfo/_strings.py"]
"R/zip-peek-cache.R" = ["src/metacheck/archives/zip_peek_cache.py"]
"R/file_category.R" = ["src/metacheck/fileinfo/category.py", "src/metacheck/fileinfo/_strings.py"]
"R/file_types.R" = ["src/metacheck/fileinfo/types.py"]
"R/file-naming.R" = ["src/metacheck/fileinfo/naming.py", "src/metacheck/fileinfo/_strings.py"]
"data/file_types.rda" = ["src/metacheck/resources/data/file_types.json.gz", "src/metacheck/fileinfo/types.py", "scripts/convert_data.R"]
"data-raw/file_types.R" = ["scripts/convert_data.R"]

