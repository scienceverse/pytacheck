".wait_out_known_rate_limit" = "pytacheck.archives.download:_wait_out_known_rate_limit"
".download_one" = "pytacheck.archives.download:_download_one"
".download_many_parallel" = "pytacheck.archives.download:_download_many_parallel"
".zip_timeout_for_size" = "pytacheck.archives.download:_zip_timeout_for_size"
".download_zip_to_cache" = "pytacheck.archives.download:_download_zip_to_cache"
