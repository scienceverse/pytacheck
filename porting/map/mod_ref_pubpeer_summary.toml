# R source -> Python location for the ref_pubpeer and ref_summary modules (see docs/PORTING.md).
[files]
"inst/modules/ref_pubpeer.R" = ["src/metacheck/modules/ref_pubpeer.py"]
"inst/modules/ref_summary.R" = ["src/metacheck/modules/ref_summary.py"]

[functions]
"module:ref_pubpeer" = "metacheck.modules.ref_pubpeer:ref_pubpeer"
"module:ref_summary" = "metacheck.modules.ref_summary:ref_summary"
# (dplyr::inner_join()/left_join() as used by both modules -- rows in x order, NA keys
