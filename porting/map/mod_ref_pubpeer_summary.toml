# R source -> Python location for the ref_pubpeer and ref_summary modules (see docs/PORTING.md).
[files]
"inst/modules/ref_pubpeer.R" = ["src/pytacheck/modules/ref_pubpeer.py"]
"inst/modules/ref_summary.R" = ["src/pytacheck/modules/ref_summary.py"]

[functions]
"module:ref_pubpeer" = "pytacheck.modules.ref_pubpeer:ref_pubpeer"
"module:ref_summary" = "pytacheck.modules.ref_summary:ref_summary"
# (dplyr::inner_join()/left_join() as used by both modules -- rows in x order, NA keys
#  matching, int/double keys by value, .x/.y suffixes, no many-to-many warning inside a
#  module -- is ported as pytacheck.modules.ref_summary:_join; ref_summary's
#  pivot_longer()/summarise() of ref_accuracy's *_mismatch columns as
#  pytacheck.modules.ref_summary:_accuracy_mismatches)
