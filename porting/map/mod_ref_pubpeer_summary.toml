#  dplyr:::add_suffixes(), no many-to-many warning inside a module -- is ported as
#  metacheck.modules.ref_summary:_join; ref_summary's pivot_longer()/summarise() of
#  ref_accuracy's *_mismatch columns, including pivot_longer()'s "Can't combine" type
#  check, as metacheck.modules.ref_summary:_accuracy_mismatches)
