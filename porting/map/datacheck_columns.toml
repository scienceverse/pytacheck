# R source -> Python location for data_check helpers part 2: column typing and
# statistics, codebook detection / parsing (structured tables, JSON, markdown,
# spreadsheets, haven / JASP / jamovi labels, rich text, PDF gate), Qualtrics
# .qsf parsing and column-label matching (see docs/PORTING.md).
# R/data_check_helpers.R is split across areas: lines 2473-4622 (data_col_type
# through .scale_typo_of, before data_check_scale_values) are ported here; lines
# 1-2472 live in metacheck.datacheck.files, the rest in metacheck.datacheck.checks.
# Every name is importable from metacheck.datacheck.columns (the private
# submodules _columns_*.py are implementation detail).
# Fixtures: tests/datacheck_columns/fixtures/make_fixtures.{R,py}; cases are
# generated by tests/datacheck_columns/gen_parity_cases.py; goldens:
# parity/golden/datacheck_columns/. Adversarial-review cases (area
# datacheck_columns_review): tests/datacheck_columns/gen_review_cases.py with
# fixtures from tests/datacheck_columns/fixtures/review/make_review_fixtures.{R,py};
# goldens: parity/golden/datacheck_columns_review/.
[files]
"R/data_check_helpers.R" = ["src/metacheck/datacheck/columns.py", "src/metacheck/datacheck/_columns_labels.py", "src/metacheck/datacheck/_columns_codebook.py", "src/metacheck/datacheck/_columns_qsf.py"]

