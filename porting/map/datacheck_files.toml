# R source -> Python location for data_check helpers part 1: file classification,
# formats, manifests, study grouping, text sniffing and data_read_head() (see docs/PORTING.md).
# R/data_check_helpers.R is split across areas: lines 1-2472 (everything before
# data_col_type) are ported here; the rest lives in metacheck.datacheck.columns / .checks.
# Fixtures: tests/datacheck_files/data/make_fixtures.{R,py} and
# make_review_fixtures.{R,py} (data/review/); cases generated by
# tests/datacheck_files/gen_parity_cases.py and gen_review_cases.py
# (area datacheck_files_review); goldens: parity/golden/datacheck_files*/.
[files]
"R/data_check_helpers.R" = ["src/metacheck/datacheck/files.py", "src/metacheck/datacheck/_files_delim.py", "src/metacheck/datacheck/_files_readers.py", "src/metacheck/datacheck/_files_rdata.py", "src/metacheck/datacheck/_files_registry.py", "src/metacheck/datacheck/_files_strtod.py", "src/metacheck/datacheck/_files_time.py", "src/metacheck/datacheck/__init__.py"]

