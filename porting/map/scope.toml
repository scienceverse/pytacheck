# Symbols the scope audit found ported under a different name or module than
# porting/symbols.json assumed (see docs/PORTING.md). Symbols that are not
# ported by design are in porting/skip.toml.
[files]
"R/module.R" = ["src/metacheck/packs/scaffold.py"]
"inst/templates/_module.R" = [
    "src/metacheck/resources/templates/module.py.tmpl",
    "src/metacheck/packs/scaffold.py",
]

[functions]
module_template = "metacheck.packs.scaffold:module_template"
".paper_schema" = "metacheck.papers.schema:load_schema"
