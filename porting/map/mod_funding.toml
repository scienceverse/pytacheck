# R source -> Python location for the funding_check modules (see docs/PORTING.md).
# The module files define their helpers locally; R names below are those of
# inst/modules/funding_check.R unless prefixed with the file name. The rtransparent
# helpers funding_check() never calls are not ported: .title_strict, .first_capital,
# obliterate_fullstop_1, .obliterate_{semicolon,comma,apostrophe,hash,punct,line_break,refs}_1,
# obliterate_conflict_1, obliterate_disclosure_1, .where_methods_txt, get_support_2,
# get_fund_acknow_new, negate_disclosure_1, negate_disclosure_2, negate_conflict_1.
[files]
"inst/modules/funding_check.R" = ["src/pytacheck/modules/funding_check.py", "src/pytacheck/modules/_funding.py"]
"inst/modules/funding_check_oi.R" = ["src/pytacheck/modules/funding_check_oi.py", "src/pytacheck/modules/funding_check.py"]

[functions]
