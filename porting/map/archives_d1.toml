".figshare_verify_downloads" = "pytacheck.archives.figshare:_figshare_verify_downloads"
# R/archive-dataverse.R
".dataverse_hosts" = "pytacheck.archives.dataverse:_dataverse_hosts"
".dataverse_host_regex" = "pytacheck.archives.dataverse:_dataverse_host_regex"
