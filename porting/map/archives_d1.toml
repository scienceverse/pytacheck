# R source -> Python location for archives_d1 (Dryad, Figshare, Dataverse; see docs/PORTING.md).
#
# The three R files each carry a copy of the same file-by-file download,
# size-cap and verification code; the Python port keeps that logic once, in
# dataverse.py (_download_file_table, _verify_file_table, _zip_members,
# _info_table, ...), so a change to that shared shape in any of the three R
# files lands there.
[files]
"R/archive-dryad.R" = ["src/pytacheck/archives/dryad.py", "src/pytacheck/archives/dataverse.py"]
"R/archive-figshare.R" = ["src/pytacheck/archives/figshare.py", "src/pytacheck/archives/dataverse.py"]
"R/archive-dataverse.R" = ["src/pytacheck/archives/dataverse.py"]

[functions]
# R/archive-dryad.R
".dryad_doi_prefixes" = "pytacheck.archives.dryad:_dryad_doi_prefixes"
"dryad_links" = "pytacheck.archives.dryad:dryad_links"
".dryad_doi" = "pytacheck.archives.dryad:_dryad_doi"
"dryad_info" = "pytacheck.archives.dryad:dryad_info"
".dryad_info" = "pytacheck.archives.dryad:_dryad_info"
