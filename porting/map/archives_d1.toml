# data: the allowlists as module-level constants (R returns them from functions)
[data]
".dryad_doi_prefixes()" = "pytacheck.archives.dryad:DRYAD_DOI_PREFIXES"
".figshare_vanity_hosts()" = "pytacheck.archives.figshare:FIGSHARE_VANITY_HOSTS"
".figshare_doi_prefix_hosts()" = "pytacheck.archives.figshare:FIGSHARE_DOI_PREFIX_HOSTS"
".dataverse_hosts()" = "pytacheck.archives.dataverse:DATAVERSE_HOSTS"
".dataverse_doi_prefix_hosts()" = "pytacheck.archives.dataverse:DATAVERSE_DOI_PREFIX_HOSTS"

# helpers standing in for R/package functions and for the code the three R
# files duplicate
[helpers]
"base::$ on parsed JSON (partial matching; error on atomic)" = "pytacheck.archives.dataverse:_dollar"
"%empty_or%" = "pytacheck.archives.dataverse:_empty_or"
"utils::URLdecode" = "pytacheck.archives.dataverse:_url_decode"
"utils::URLencode(reserved = TRUE)" = "pytacheck.archives.dataverse:_url_encode_reserved"
"as.character() of a jsonlite scalar" = "pytacheck.archives.dataverse:_json_chr"
"vapply(..., character(1)) element check" = "pytacheck.archives.dataverse:_chr_elt"
"tryCatch(httr2::resp_body_json(resp), error = NULL)" = "pytacheck.archives.dataverse:_resp_json"
".batch_query(url, msg = NULL, req_func)[[1]]" = "pytacheck.archives.dataverse:_query"
"data.frame(url, id = <named vapply>) row-name error" = "pytacheck.archives.dataverse:_check_named_ids"
"*_info() table/vector input handling" = "pytacheck.archives.dataverse:_info_table"
"*_links() url-table filter" = "pytacheck.archives.dataverse:_url_rows"
"*_links() text_search(return = 'match') part" = "pytacheck.archives.dataverse:_link_matches"
"*_links() bind_rows + sub('/+$') + unique" = "pytacheck.archives.dataverse:_collect_links"
"*_file_download() size caps, folder, download loop, copy, verify, warning" = "pytacheck.archives.dataverse:_download_file_table"
"*_file_download() multi-id branch" = "pytacheck.archives.dataverse:_download_many"
"*_file_download() return columns" = "pytacheck.archives.dataverse:_finish_file_table"
"*_zip_members() body" = "pytacheck.archives.dataverse:_zip_members"
"*_verify_downloads() body" = "pytacheck.archives.dataverse:_verify_file_table"
"req_perform() of a file download (streamed to disk)" = "pytacheck.archives.dataverse:_fetch_file"
"httr2::oauth_client() / req_oauth_client_credentials()" = "pytacheck.archives.dryad:DryadOAuthClient"
# added by the adversarial review
"httr2 req_perform_sequential(): errors that are not httr2_error abort the caller" = "pytacheck.archives.dataverse:RequestAbort"
"vapply() names on *_links() id columns (URL-named vectors in R)" = "pytacheck.archives.dataverse:_mark_named_ids"
"httr2 oauth_flow_parse() + oauth_token() (client-credentials token response)" = "pytacheck.archives.dryad:_token_from_body"
"httr2 httr2_oauth* errors" = "pytacheck.archives.dryad:OAuthError"
"httr2 req_perform() re-authentication after an OAuth invalid_token 401" = "pytacheck.archives.dryad:_dryad_reauth"
