"dryad_pat" = "pytacheck.archives.dryad:dryad_pat"
".dryad_pat" = "pytacheck.archives.dryad:_dryad_pat"
"dryad_auth" = "pytacheck.archives.dryad:dryad_auth"
".dryad_auth" = "pytacheck.archives.dryad:_dryad_auth"
".dryad_oauth_client" = "pytacheck.archives.dryad:_dryad_oauth_client"
"dryad_file_download" = "pytacheck.archives.dryad:dryad_file_download"
".dryad_zip_members" = "pytacheck.archives.dryad:_dryad_zip_members"
".dryad_verify_downloads" = "pytacheck.archives.dryad:_dryad_verify_downloads"
# R/archive-figshare.R
