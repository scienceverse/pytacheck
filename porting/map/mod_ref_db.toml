"inst/modules/ref_retraction.R" = ["src/pytacheck/modules/ref_retraction.py"]
"inst/modules/ref_replication.R" = ["src/pytacheck/modules/ref_replication.py"]
"inst/modules/ref_miscitation.R" = ["src/pytacheck/modules/ref_miscitation.py"]

