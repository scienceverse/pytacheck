# R source -> Python location for the Reproducibility Check module (see docs/PORTING.md).
# The static/execution helpers it builds on (R/reproducibility_check.R,
# R/reproducibility_check_docker.R) are mapped in repro_core.toml.
# Parity: fake code_check/data_check/psychds_check chains
# (tests/mod_repro/fixtures/scenarios.json, built by tests/mod_repro/rc_helpers.R and
# tests/mod_repro/helpers.py; execute cases run real R subprocesses on
# tests/mod_repro/fixtures/scripts + metacheck's fixtures/repro; installs and Docker are
# mocked on both sides); cases are generated by tests/mod_repro/make_cases.py.
# Review cases (parity area mod_repro_review, generated by
# tests/mod_repro/make_review_cases.py): the report's table chunks (skipped by the prose
# comparison; tests/mod_repro/rv_helpers.R/.py), extra scenarios in
# tests/mod_repro/fixtures/review_scenarios.json, a real piped chain, and a committed
# metacheck capture_module_tables() .rds read through tables_dir.
[files]
"inst/modules/reproducibility_check.R" = [
    "src/metacheck/modules/reproducibility_check.py",
    "src/metacheck/modules/_reproducibility.py",
]

[functions]
"module:reproducibility_check" = "metacheck.modules.reproducibility_check:reproducibility_check"
# module-local helpers defined in inst/modules/reproducibility_check.R
".reproducibility_check_batch" = "metacheck.modules._reproducibility:_reproducibility_check_batch"
".repro_docker_resource_limits" = "metacheck.modules._reproducibility:_repro_docker_resource_limits"
".repro_docker_host_memory_bytes" = "metacheck.modules._reproducibility:_repro_docker_host_memory_bytes"
# closures inside reproducibility_check(), ported alongside it:
#   .pid -> _reproducibility._pid; get_saved_output -> _reproducibility.SavedTables;
#   run_missing -> _reproducibility.run_missing; .empty_match / the main-path match ->
#   _reproducibility.match_output; empty -> reproducibility_check._check.empty;
#   resolve_row_path -> reproducibility_check._resolver; hash_source (dedup),
#   the execute phase (7b) -> reproducibility_check._execute; the "Execution" report
#   (tail_cap, output blocks, install report) -> _execution_report/_install_report;
#   the `modifications` build -> reproducibility_check._modifications.
