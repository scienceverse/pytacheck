# R source -> Python location for the LLM client (see docs/PORTING.md).
#
# metacheck reaches LLMs through ellmer; pytacheck reaches them through the
# official provider SDKs (openai, anthropic, google-genai: the `metacheck[llm]`
# extra), as the maintainer decided on 2026-10-04 (D65). What is ported is
# behaviour -- prompts, schemas, parameters, result columns -- never ellmer's
# internals:
#   the provider table, requests, retries and error text
#                                       -> src/metacheck/llm/_backend.py
#   ellmer::type_*(), as_json(<type>), convert_from_type()
#                                       -> src/metacheck/llm/types.py
#   the LLM response cache (a folder of JSON files; R's .rds files are not read)
#                                       -> src/metacheck/llm/cache.py
[files]
"R/llm.R" = ["src/metacheck/llm/core.py", "src/metacheck/llm/_backend.py", "src/metacheck/llm/types.py"]
"R/llm-cache.R" = ["src/metacheck/llm/cache.py"]
"R/cap-prompt.R" = ["src/metacheck/llm/cap_prompt.py"]
"R/zzz.R" = ["src/metacheck/llm/core.py"]

[functions]
llm = "metacheck.llm.core:llm"
llm_use = "metacheck.llm.core:llm_use"
llm_model = "metacheck.llm.core:llm_model"
llm_max_calls = "metacheck.llm.core:llm_max_calls"
llm_max_tokens = "metacheck.llm.core:llm_max_tokens"
llm_timeout = "metacheck.llm.core:llm_timeout"
llm_reasoning = "metacheck.llm.core:llm_reasoning"
".llm_apply_reasoning" = "metacheck.llm.core:_llm_apply_reasoning"
".llm_sanitise_text" = "metacheck.llm.core:_llm_sanitise_text"
".llm_error_message" = "metacheck.llm.core:_llm_error_message"
".llm_json_retryable" = "metacheck.llm.core:_llm_json_retryable"
".llm_is_systemic_error" = "metacheck.llm.core:_llm_is_systemic_error"
".llm_systemic_notice" = "metacheck.llm.core:_llm_systemic_notice"
".unnest_result" = "metacheck.llm.core:_unnest_result"
llm_cache = "metacheck.llm.cache:llm_cache"
llm_cache_clear = "metacheck.llm.cache:llm_cache_clear"
".llm_cache_dir" = "metacheck.llm.cache:_llm_cache_dir"
".llm_cache_key" = "metacheck.llm.cache:_llm_cache_key"
".llm_cache_path" = "metacheck.llm.cache:_llm_cache_path"
".llm_cache_get" = "metacheck.llm.cache:_llm_cache_get"
".llm_cache_put" = "metacheck.llm.cache:_llm_cache_put"
".cap_report" = "metacheck.llm.cap_prompt:cap_report"
".cap_size_str" = "metacheck.llm.cap_prompt:_cap_size_str"

# R/zzz.R .onLoad(): its LLM defaults (metacheck.llm_max_calls = 30L,
# metacheck.llm.model = the first provider whose API key is set,
# metacheck.llm.use = FALSE) are applied lazily by this function.
[onload]
".onLoad (LLM options)" = "metacheck.llm.core:_init_options"

# ellmer (a dependency of R/llm.R): the type builders and the conversion of a
# reply to columns are ported by behaviour; the rest is in porting/skip.toml.
[ellmer]
"ellmer::type_object" = "metacheck.llm.types:type_object"
"ellmer::type_array" = "metacheck.llm.types:type_array"
"ellmer::type_string" = "metacheck.llm.types:type_string"
"ellmer::type_integer" = "metacheck.llm.types:type_integer"
"ellmer::type_number" = "metacheck.llm.types:type_number"
"ellmer::type_boolean" = "metacheck.llm.types:type_boolean"
"ellmer::type_enum" = "metacheck.llm.types:type_enum"
"ellmer::type_from_schema" = "metacheck.llm.types:type_from_schema"
"ellmer:::convert_from_type" = "metacheck.llm.types:convert_from_type"
