# metacheck functionality that pytacheck does not port, by design.
#
# pytacheck ports metacheck faithfully (docs/PORTING.md), but not the parts that
# only make sense inside an R session, or that pytacheck replaces with its own
# design: bibr export schema v12.0 as the paper schema (older v10.x files still
# read exactly as metacheck reads them), bibr in-process, the Grobid TEI
# adapter, module system v2 (packs, presets, store), the `pytacheck` CLI and the
# FastAPI server (pytacheck.api, the port of inst/plumber).
#
# [skip]        R symbol -> why it is never ported. `scripts/port_status.py`
#               leaves these out of the coverage it measures; the upstream-sync
#               agent does not port changes to them.
# [skip_files]  whole upstream files/directories with nothing to port.
# [drop.<id>]   code that WAS ported but is superseded: remove it (R names in
#               `r`, Python in `python`, everything to delete or edit in
#               `files`). Remove the matching porting/map [functions] entries
#               too, then run scripts/porting_symbols.py.
#
# Names use porting/symbols.json's spelling; symbols from metacheck's
# dependencies carry a "pkg::" prefix (as in porting/map/stats.toml).

[skip]
# R/app.R -- Shiny apps
"osf_app" = "Shiny app (inst/app/osf_app.R). Its steps are ported functions: osf_user_projects(), osf_file_download(), zenodo_upload()."
"report_app" = "Shiny app (inst/app/report_app.R). Replaced by `pytacheck report`/`run` (--preset metacheck::validated, --offline) and the API's /paper/check (report_html)."

# R/zzz.R -- package hooks
".onLoad" = "R package load hook. Its option defaults are in pytacheck.config and pytacheck.llm.core (_default_model_from_env), applied lazily; .osf_pat_validate() runs when OSF is used."
".onAttach" = "library() startup banner, including a network version check against GitHub. pytacheck does no network I/O at import; `pytacheck version` shows versions."

# R/svutils-utils.R -- infix operators
"%||%" = "R infix idiom, written inline: `x if x is not None else y`."
"%empty_or%" = "R infix idiom, written inline: `x if len(x) else y`."

# R/paper.R, R/module.R -- R-session display
"fig_image_view" = "Plots a figure on an R graphics device (jpeg + grDevices). Python shows paper.figure.image (a base64 data URI, read with include_images=True) directly in Jupyter or any image library."
"print.scivrs_paper" = "S3 print method. Covered by Paper.__repr__ (same text)."
"print.scivrs_paperlist" = "S3 print method. Covered by PaperList.__repr__; paper_table(papers, 'info', ['title', 'doi']) is the table R prints."
"print.metacheck_module_list" = "S3 print method. Covered by pytacheck.module.format_module_list() (same text)."
"print.metacheck_module_output" = "S3 print method. Covered by ModuleOutput.__repr__ ('<title>: <summary_text>')."
"print.metacheck_module_help" = "S3 print method. Covered by module_help(), which returns the printed text."

# R/zip-peek.R -- base-R fallbacks for what Python's standard library does
".crc32" = "Pure-R CRC-32, used when the digest package is missing. Use zlib.crc32 (fast, so .zip_crc_ok() needs no size limit, as when R has digest)."
".le_int" = "Little-endian integer from raw bytes. Use int.from_bytes(b, 'little') or struct."

# ellmer providers metacheck can reach through ellmer::chat("provider/model")
"ellmer::chat_aws_bedrock" = "Needs AWS SigV4 credentials (an SDK). pytacheck.llm.providers raises a clear error (_UNSUPPORTED)."
"ellmer::chat_google_vertex" = "Needs Google Cloud ADC/project auth. pytacheck raises a clear error; google_gemini works with AI Studio keys (the API default)."
"ellmer::chat_databricks" = "Needs Databricks workspace OAuth. pytacheck raises a clear error."
"ellmer::chat_snowflake" = "Needs Snowflake key-pair/OAuth auth. pytacheck raises a clear error."
"ellmer::chat_posit" = "Posit AI (subscription service) needs its own OAuth. pytacheck raises a clear error."

# statcheck parts metacheck never uses (see also [drop.statcheck_files])
