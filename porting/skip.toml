    "tests/stats/test_review.py: the statcheck_files import, test_get_html, test_check_html_and_dir, the fake_pdftotext fixture, test_get_pdf_and_check_pdf, test_get_pdf_failure",
    "tests/stats/fixtures/statcheck_html/",
    "parity/cases/stats_review.yaml: getHTML.review.*, checkHTML.review.*, checkHTMLdir.review.*, checkdir.review.* (14 cases)",
