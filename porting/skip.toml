"codecov.yml" = "R CI coverage configuration."

[drop.statcheck_files]
reason = """statcheck's own PDF/HTML front ends. metacheck never calls them: it gives \
statcheck::statcheck() the sentences of a paper. They read articles with the external \
pdftotext binary or a regex HTML stripper. pytacheck papers come from bibr or Grobid, and \
stat_check / stats() check them."""
r = [
    "statcheck::checkHTML",
    "statcheck::checkHTMLdir",
    "statcheck::checkPDF",
    "statcheck::checkPDFdir",
    "statcheck::checkdir",
    "statcheck:::getHTML",
    "statcheck:::getPDF",
]
python = ["pytacheck.stats.statcheck_files"]
files = [
