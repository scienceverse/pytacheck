[drop.delimited_reader]
reason = """The hand-written ports of data.table::fread and of the read.table/scan/type.convert \
tokenizer (1,937 lines in datacheck/_files_fread.py and datacheck/_files_readtable.py). The \
maintainer decided on 2026-10-04 to stop maintaining reproductions of R libraries where Python \
libraries do the job: pandas' C parser reads the fields, and datacheck/_files_delim.py finds \
the table and types the columns. Only the strtod helpers of the old read.table port survive, in \
datacheck/_files_strtod.py. Removed together with their fuzz and pin tests; the behaviour is \
kept by tests/datacheck_files/test_delim.py (recorded fread output) and test_delim_reader.py."""
r = [
    "data.table::fread",
    "utils::read.delim",
    "utils::read.table",
    "utils::scan",
    "utils::type.convert",
]
python = [
    "metacheck.datacheck._files_fread:fread",
    "metacheck.datacheck._files_readtable:read_table",
    "metacheck.datacheck._files_readtable:type_convert",
]
files = [
    "src/metacheck/datacheck/_files_fread.py",
    "src/metacheck/datacheck/_files_readtable.py",
]
