# empty paper lists (U79) ---------------------------------------------------------
# An empty paper list gives the module's empty result (a summary table without
# rows); metacheck stops, because paper_id() of an empty list is NULL and
# data.frame(paper_id = NULL) has no rows or no column.
"mod_ethics/ethics_check.empty_paperlist": &u79_empty_list
