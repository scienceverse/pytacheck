# Cases in generated case files of the text-module lane (causal_claims, ethics_check,
# funding_check, power, prereg_check, ref_accuracy, ref_pubpeer, ref_summary, ...) that
# differ from R on purpose. Format (see parity/cases.py): "<area>/<id>": {kind, ref,
# reason}; kind is one of parity.cases.DIVERGENCE_KINDS, ref the docs/UPSTREAM_ISSUES.md
# entry.

# causal_claims -------------------------------------------------------------------
"mod_causal/causal_claims.random_several":
  kind: r_bug_fixed
  ref: U85
  reason: '"Trials were presented in random order after participants were randomized." counts; the "random order" exclusion no longer drops the whole sentence'
"mod_causal/causal_claims.title_na":
  kind: r_bug_fixed
  ref: U84
  reason: a missing (NA) title is skipped; metacheck stops with "missing value where TRUE/FALSE needed"
"mod_causal/causal_claims.paperlist_no_abstract": &u84_list_network
  kind: r_bug_fixed
  ref: U84
  reason: the titles of a paper list are classified (metacheck never reads them), which needs the classifier; fake.paperlist_random covers the list offline
"mod_causal/causal_claims.paperlist_none": *u84_list_network
"mod_causal/causal_claims.fake.paperlist_duplicate":
  kind: r_bug_fixed
  ref: U84
  reason: the paper list's causal title is found, and a sentence shared by two papers counts once for each (metacheck 2, 2)
"mod_causal/causal_claims.fake.paperlist_info_id":
  kind: r_bug_fixed
  ref: U84
  reason: the causal title of a paper in a list is found (metacheck never classifies list titles)
"mod_causal_review/causal_claims.review.pattern_quirks":
  kind: r_bug_fixed
  ref: U85
  reason: British "Randomisation" and "randomly assigned ... random intercepts/effects" count, "not randomized" does not (10 sentences, metacheck 8)
"mod_causal_review/causal_claims.review.paperlist_empty_member": *u84_list_network
"mod_causal_review/causal_claims.review.fake.dup_same_paper":
  kind: r_bug_fixed
  ref: U84
  reason: a sentence repeated twice in the abstract counts its relation twice, not four times (join by text)
"mod_causal_review/causal_claims.review.fake.paperlist_single":
  kind: r_bug_fixed
  ref: U84
  reason: the causal title of the only paper in a list is found (yellow; metacheck never classifies list titles)
"mod_causal_review/causal_claims.review.error.title_na":
  kind: r_bug_fixed
  ref: U84
  reason: a missing (NA) title is skipped; metacheck stops with "missing value where TRUE/FALSE needed"
"mod_causal_review/causal_claims.review.fake.report.full":
  kind: r_bug_fixed
  ref: U85
  reason: '"... in random order after participants were randomized." counts as describing randomization (7 sentences, metacheck 6)'

# ethics_check --------------------------------------------------------------------
"mod_ethics/ethics_check.duplicates":
  kind: r_bug_fixed
  ref: U102
  reason: the report quotes "The IRB approved the protocol." once, not once per row
"mod_ethics/ethics_check.paperlist_empty_member":
  kind: r_bug_fixed
  ref: U102
  reason: the paper with an empty info table is summarised under its own ID, so the two-paper list gets the paper-list summary ("1 of 2 papers ...") and no single-paper report
"mod_ethics/ethics_check.duplicate_ids":
  kind: r_bug_fixed
  ref: U101
  reason: papers with duplicated IDs are summarised together; metacheck stops ("factor level [2] is duplicated")
"mod_ethics/ethics_check.empty_paper":
  kind: r_bug_fixed
  ref: U102
  reason: paper() (an empty info table) is summarised under its own ID ("na"); metacheck stops ("invalid subscript type 'list'", also U79)
"mod_ethics_review/ethics_check.no_text_column_ethics_match": &u102_no_text
  kind: r_bug_fixed
  ref: U102
  reason: a text table without a `text` column has no sentences ("na"); metacheck searches its first column and stops with an opaque error
"mod_ethics_review/ethics_check.no_text_column_live_match": *u102_no_text
"mod_ethics_review/ethics_check.no_info_member_with_text": &u102_no_info
  kind: r_bug_fixed
  ref: U102
  reason: the paper without an info row keeps its ID (p1) instead of an NA paper_id, and is summarised; the list gets the paper-list summary
"mod_ethics_review/ethics_check.direct_no_info_member_with_text": *u102_no_info
"mod_ethics_review/ethics_check.no_info_single_with_text":
  kind: r_bug_fixed
  ref: U102
  reason: a paper without an info row is summarised under its own ID; metacheck stops ("invalid subscript type 'list'")
"mod_ethics_review/ethics_check.duplicated_sections": &u102_quote
  kind: r_bug_fixed
  ref: U102
  reason: the report quotes each ethics statement once (metacheck repeats a sentence found at several rows)
"mod_ethics_review/ethics_check.direct_duplicated_sections": *u102_quote
"mod_ethics_review/ethics_check.approved_no_need_repeated": *u102_quote

