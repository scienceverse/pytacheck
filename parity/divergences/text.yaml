# here also differ for another reason (a case whose only difference is prose is
# in prose.yaml). Cases of the io lane's generated files (bibr12, grobid12) that
# run these modules are listed here because the module change, not the
# conversion, makes them differ.
"mod_ref_accuracy_review/ref_consistency.xml_fixtures": &u83_likley_tei
  kind: r_bug_fixed
  ref: U83
  reason: "the caveat says 'likely' (metacheck: 'likley'); the reference and citation text read from the TEI also differs (io fix U16: 'Henry, 2019', '24 July 2025')"
"mod_power/power.psychsci": &u16_power
  kind: r_bug_fixed
  ref: U16
  reason: "only the sentence text read from the TEI differs ('G*Power 3.1', metacheck 'G*Power3.1'; io fix of the number-before-tag clean-up)"
"mod_power/power.psychsci.tables": *u16_power

# reg_check: a light for a check that could not run (U30) --------------------------
# When every RegCheck comparison fails, reg_check's light is "fail" (what report()
# gives a module that fails); metacheck returns "error", which is not a traffic light.
# r_text turns R's light into "fail" (no other value of these goldens is "error"),
# so the rest of each result stays compared with R.

