# Cases in generated case files of the text-module lane (causal_claims, ethics_check,
# funding_check, power, prereg_check, ref_accuracy, ref_pubpeer, ref_summary, ...) that
# differ from R on purpose. Format (see parity/cases.py): "<area>/<id>": {kind, ref,
# reason}; kind is one of parity.cases.DIVERGENCE_KINDS, ref the docs/UPSTREAM_ISSUES.md
# entry.

# causal_claims -------------------------------------------------------------------
"mod_causal/causal_claims.fake.paperlist_duplicate":
  kind: r_bug_fixed
  ref: U84
  reason: the paper list's causal title is found, and a sentence shared by two papers counts once for each (metacheck 2, 2)
"mod_causal_review/causal_claims.review.fake.dup_same_paper":
  kind: r_bug_fixed
  ref: U84
  reason: a sentence repeated twice in the abstract counts its relation twice, not four times (join by text)
"mod_causal_review/causal_claims.review.fake.report.full":
  kind: r_bug_fixed
  ref: U85
  reason: '"... in random order after participants were randomized." counts as describing randomization (7 sentences, metacheck 6); the tables are raw HTML blocks, not R chunks (D75)'

# ethics_check --------------------------------------------------------------------
"mod_ethics_review/ethics_check.no_text_column_ethics_match": &u102_no_text
  kind: r_bug_fixed
  ref: U102
  reason: a text table without a `text` column has no sentences ("na"); metacheck searches its first column and stops with an opaque error
"mod_ethics_review/ethics_check.no_text_column_live_match": *u102_no_text

# funding_check -------------------------------------------------------------------
"mod_funding_review/rtransparent_funding.boundaries": &u299_na_next
  kind: r_bug_fixed
  ref: U299
  reason: "a title line followed by a missing (NA) line has no follow-up line (R's .title_lines_with_next() stops with \"missing value where TRUE/FALSE needed\", because nchar(NA) is NA in its if())"
"mod_funding_review/locate.boundary.funding_title_na_next": *u299_na_next
"mod_funding_review/negate_absence_1.match_limit":
  kind: c_quirk
  ref: D17
  reason: "PCRE2 resource limit in R: on this 640-character sentence grepl(perl = TRUE) stops with 'match limit exceeded' (a warning) and returns FALSE; the regex engine has no such limit and finds the match. Only reached by pathologically repetitive text (no metacheck fixture sentence reaches the limit with any funding pattern)."

