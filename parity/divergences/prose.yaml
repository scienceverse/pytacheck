# Cases in generated case files whose only difference from R is text that
# pytacheck corrects in module prose: typos (U83), plurals (U82) and a missing
# full stop (U125). Format (see parity/cases.py and docs/PARITY.md): "<area>/<id>":
# {kind, ref, reason, r_text}. The r_text substitutions turn R's text into
# pytacheck's before the comparison, so these cases pass when everything else
# matches R. Cases in hand-written case files carry the same r_text inline; a
# case that also differs for another reason stays in its lane's file.

