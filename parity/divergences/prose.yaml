# Cases in generated case files whose only difference from R is text that
# pytacheck corrects in module prose: typos (U83), plurals (U82) and a missing
# full stop (U125). Format (see parity/cases.py and docs/PARITY.md): "<area>/<id>":
# {kind, ref, reason, r_text}. The r_text substitutions turn R's text into
# pytacheck's before the comparison, so these cases pass when everything else
# matches R. Cases in hand-written case files carry the same r_text inline; a
# case that also differs for another reason stays in its lane's file.

# U83: typos -------------------------------------------------------------------
"bibr12/module.open_practices.PMC4383902": &u83_recognized
  kind: r_bug_fixed
  ref: U83
  reason: "the no-code report says 'not recognized' (metacheck: 'not reconized')"
  r_text: [["reconized", "recognized"]]
  # the summary table also has D83's no_data column
  xfail: true
"grobid12/module.open_practices.0956797615569889": *u83_recognized
"bibr12/module.ref_accuracy.preprint": &u83_such_an_incoherence
  kind: r_bug_fixed
  ref: U83
  reason: "the guidance says 'Such an incoherence ... or an AI generated reference' (metacheck: 'Such an incoherent ... ar an AI generated reference')"
  r_text: [["Such an incoherent", "Such an incoherence"], [" ar an AI generated", " or an AI generated"]]
"bibr12/module.ref_accuracy.list": *u83_such_an_incoherence
"bibr12/module.ref_accuracy.mixed": *u83_such_an_incoherence
"mod_ref_accuracy_review/ref_accuracy.module_help":
  kind: r_bug_fixed
  ref: U83
  reason: "the help text says 'or mistakes in citations. You will need to check the original source.' (metacheck: 'of mistakes ... You will need check ...')"
  r_text: [["AI generated references, of mistakes in citations. You will need check the original source.", "AI generated references, or mistakes in citations. You will need to check the original source."]]

