# Marks of the reproducibility check's cases (areas repro_core, repro_core_review,
# mod_repro, mod_repro_review): R/reproducibility_check*.R and its module.
# Moved here from code.yaml; a case is marked in exactly one file.

"mod_repro/reproducibility_check.exec_docker": &u132
  kind: r_bug_fixed
  ref: U132
  reason: R's "there is no package called ‘pkg’" (typographic quotes in UTF-8) is recognised, so a script failing on an unavailable dependency is dependency_unavailable, not errored
"mod_repro_review/tables.exec_docker_exec": *u132
"mod_repro/reproducibility_check.spv_notebook_py":
  kind: r_bug_fixed
  ref: U148
  reason: the SPSS Notes table's template cell renders as 3, so it adds 2 statistics (38, R 36); test_ids carry the source prefix once (U138)
# Python code (metacheck d3b8594, after the pin) is assessed, and run under pytacheck's
# sandbox; the scenarios' .py files were "other code" at the pin.
"mod_repro/reproducibility_check.nonr_only": &dx_repro_1_python
  kind: deliberate
  ref: D119
  reason: the paper's Python files are assessed (metacheck d3b8594, after the pin), in a "### Python code" section with its own rows, counts and traffic light, instead of being reported as code with no reproducible output
"mod_repro/module.nonr_only": *dx_repro_1_python
"mod_repro_review/review.rv_jasp_nonr": *dx_repro_1_python
"mod_repro_review/review.rv_no_file_name_col":
  kind: deliberate
  ref: D119
  reason: Python rows of a code table without a file_name column name no file to assess, as R rows do, so there is no code to assess (at the pin they were reported as other code; metacheck d3b8594 takes them for Python files with no names)
"mod_repro_review/tables.rv_no_file_name_col":
  kind: r_bug_fixed
  ref: U242
  reason: a code table without a file_name column has no files to assess, so there is no code to assess; metacheck 0.3.3.2 stops the module ("argument is of length zero") in the report's table chunks (the review.rv_no_file_name_col case, D119, reaches the same result without the error)
