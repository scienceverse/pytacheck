# Marks of the reproducibility check's cases (areas repro_core, repro_core_review,
# mod_repro, mod_repro_review): R/reproducibility_check*.R and its module.
# Moved here from code.yaml; a case is marked in exactly one file.

"mod_repro/reproducibility_check.spv_notebook_py":
  kind: r_bug_fixed
  ref: U148
  reason: the SPSS Notes table's template cell renders as 3, so it adds 2 statistics (38, R 36)
"mod_repro/reproducibility_check.py_software": &d122
  kind: deliberate
  ref: D122
  reason: the R reference image has no `python`, so metacheck adds a "#### Parsing" paragraph saying the Python files were not checked; pytacheck parses with the interpreter it runs in and has nothing to say there
"mod_repro/reproducibility_check.nonr_only": *d122
"mod_repro/module.nonr_only": *d122
"mod_repro_review/review.rv_jasp_nonr": *d122
"mod_repro_review/review.rv_no_file_name_col": &u242
  kind: r_bug_fixed
  ref: U242
  reason: a code table without a file_name column has no files to assess, so there is no code to assess; metacheck 0.4.3.7 stops the module ("replacement has 0 rows, data has 1")
"mod_repro_review/tables.rv_no_file_name_col": *u242
