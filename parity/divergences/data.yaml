# The delimited-file reader is pandas' C parser behind a small layer (datacheck/_files_delim.py),
# not a port of data.table::fread() (the maintainer decided on 2026-10-04). Where the two differ:

# U216: fread keeps a doubled quote inside a quoted field
"datacheck_files/data_read_head.quoted.csv":
  kind: r_bug_fixed
  ref: U216
  reason: a doubled quote inside a quoted field is one quote (he said "hi"); fread keeps both (he said ""hi"")

"datacheck_files_review/review.read_head_typed.rt_quotes.csv":
  kind: r_bug_fixed
  ref: U216
  reason: a doubled quote inside a quoted field of a one-column file is one quote ("x""y" is x"y); fread keeps both

# U217: a UTF-16 file is read as bytes
"datacheck_files/txt_classify_content.utf16_table.txt":
  kind: r_bug_fixed
  ref: U217
  reason: the decoded first lines of a UTF-16 file are what the separator sniffer reads, so its tab-separated header makes it a data file; R's readLines() cuts each line at the first NUL byte, finds no separator and keeps the name-based class
"mod_data_check_review/review_tables.text":
  kind: r_bug_fixed
  ref: U217
  reason: the repository's UTF-16 table (utf16_table.txt) is read as 3 columns (Subject, Trial, RT), which adds 2 rows to the column table; R reads one empty column from the bytes

# D69: quotes that do not fit CSV quoting are read where they stand
"datacheck_files_review/review.read_head_typed.rt_blank_na.csv": &d70
  kind: deliberate
  ref: D69
  reason: the improper quote ("x"y) stays as text and a one-column file keeps its blank lines as rows (5 here), so data_check rates it as it rates the same file without the quote; R's fread fails on it and read.delim drops the blank lines and reads xy
"datacheck_files_review/review.read_head_typed.rt_cr_cr.csv": *d70
"datacheck_files_review/review.read_head_typed.rt_fallback_latin1.csv":
  kind: deliberate
  ref: D69
  reason: the improper quote ("a"b) stays as text where R's read.delim reads ab
"datacheck_files_review/review.read_head_typed.rt_nul_quote_header.csv":
  kind: deliberate
  ref: D69
  reason: the improper quote on line 1 does not change how line 2 is read, so the quoted "a,b" is one field as in R's read.delim; only the column name differs, which ends at the NUL byte and keeps its quotes ("a") where R drops the NUL and the quotes

# D70: files without a regular table
"datacheck_files/data_read_head.whitespace.csv": &d71
  kind: deliberate
  ref: D70
  reason: a file of blanks is an empty frame (0 rows, 0 columns); R returns a data frame of 1 row and no columns
"datacheck_checks/fixture_profile.files.whitespace.csv": *d71
"datacheck_files_review/review.read_head_typed.fread_cr_ws_first.tsv": *d71

# D72: a .tsv file with no tab outside quotes is read by its sniffed separator
"datacheck_files_review/review.read_head_typed.tab_in_quotes.tsv": &d73
  kind: deliberate
  ref: D72
  reason: the file is comma-separated text with a .tsv name, and its only tab sits inside a quoted field; R reads it with a tab (one field per line, and the one line with the quoted tab split at it, so 0 data rows), here its 31 lines are read with the comma as 2 columns
"datacheck_files_review/review.read_head_typed.tab_in_quotes.tsv.n5": *d73

# D77: column kinds from pandas dtypes instead of a model of R's vector types
"datacheck_checks_review/data_check_constant.review.nan_string":
  kind: deliberate
  ref: D77
  reason: the text "NaN" is counted like any other value (a, a, NaN is not constant); R's table() drops it from a character vector and reports "a" as the only value
"datacheck_checks_review/data_check_constant.review.all_nan_strings":
  kind: deliberate
  ref: D77
  reason: a column whose every value is the text "NaN" is constant ("NaN"); R's table() drops them all and fails with "subscript out of bounds"
"datacheck_checks_review/data_check_constant.review.battery":
  kind: deliberate
  ref: D77
  reason: three of the generated columns hold the text "NaN" among other values, which is now counted (not constant); R's table() drops it and reports the remaining value as constant

