# Cases in the archives lane's generated case files that differ from R on purpose
# (docs/UPSTREAM_ISSUES.md); format: see parity/cases.py load_divergences().
# Hand-written case files (archives_osf*.yaml) mark their cases in place.
# U36
"archives_d2/reshare_file_download.mock.one":
  kind: r_bug_fixed
  ref: U36
  reason: "files omitted by the size caps stay in the table with downloaded = FALSE, as documented; a zero-byte file is downloaded instead of aborting the download; a file without `hash` has no checksum (R reads its `hash_type`: D81)"
"archives_d2/reshare_file_download.mock.total_cap":
  kind: r_bug_fixed
  ref: U36
  reason: "files omitted by the size caps stay in the table with downloaded = FALSE, as documented; a zero-byte file is downloaded instead of aborting the download; a file without `hash` has no checksum (R reads its `hash_type`: D81)"
"archives_d2/reshare_file_download.mock.multi":
  kind: r_bug_fixed
  ref: U36
  reason: "files omitted by the size caps stay in the table with downloaded = FALSE, as documented; a zero-byte file is downloaded instead of aborting the download; a file without `hash` has no checksum (R reads its `hash_type`: D81)"
# U44
"archives_d2/.fsd_study_id.vector_one":
  kind: r_bug_fixed
  ref: U44
  reason: ".fsd_study_id() is vectorised: one result per element (metacheck drops non-matches and errors on two ids)"
"archives_d2/.fsd_study_id.vector_error":
  kind: r_bug_fixed
  ref: U44
  reason: ".fsd_study_id() is vectorised: one result per element (metacheck drops non-matches and errors on two ids)"
# D65 (zip members are read by zipfile: bzip2 and lzma members work)
"repo_download_review/fetch.bzip2":
  kind: deliberate
  ref: D65
  reason: "a bzip2 member of a remote zip is fetched (metacheck reads stored and deflated members only: 'unsupported compression method (12)')"
# U249 (R's unzip/untar are stopped by the first member with an odd name)
"repo_download_review/expand.paths.zip": &u249_rest
  kind: r_bug_fixed
  ref: U249
  reason: "the members after a name with a ../ component are extracted too (metacheck stops unpacking at that name, on its warning, and returns only the members before it)"
"repo_download_review/expand.climb.zip": *u249_rest
"repo_download_review/expand.hostile.tar.gz":
  kind: r_bug_fixed
  ref: U249
  reason: "a tar member whose name holds a backslash is extracted (metacheck's untar leaves sub\\win.csv out)"
# D66 (local archives are extracted by zipfile)
"repo_download_review/expand.lzma.zip":
  kind: deliberate
  ref: D66
  reason: "an lzma member is extracted like any other (R's unzip stops at it, 'zip file is corrupt', and drops the rest of the archive)"
"repo_download_review/expand.crc.zip":
  kind: deliberate
  ref: D66
  reason: "the members of an archive whose records disagree (CRC, sizes) are still extracted, CRCs unchecked as in R (R's unzip stops at the first member whose local header disagrees with the central directory and drops the rest)"
# D67 (a zip that came whole with its listing needs no request per member)
"repo_download/zip_fetch_members.all": &d67_in_hand
  kind: deliberate
  ref: D67
  reason: "members of an archive that fit the listing's first request are read from it (metacheck asks again for each member, two requests apiece, and a host that ignores range requests fails every one)"
"repo_download/zip_fetch_members.subset": *d67_in_hand
"repo_download/zip_fetch_members.zip64": *d67_in_hand
"repo_download/zip_fetch_members.deflated": *d67_in_hand
"repo_download/download_repo_files.archive_members": *d67_in_hand
"repo_download_review/fetch.range_ignored": *d67_in_hand
# D68 (a file is not requested from a host known to be rate-limited, when asked to skip)
"repo_download_review/download.rate_limit_skip":
  kind: deliberate
  ref: D68
  reason: "the second file, asked for after the host's limit is known, is not requested: its error says 'known rate-limited host, skip_on_api_limit' (R sends it and reports 'HTTP 429 Too Many Requests.')"
# U76
"repo_download_review/expand.cp437.zip":
  kind: r_bug_fixed
  ref: U76
  reason: "zip member names that are not UTF-8 are read as CP437, and names with undecodable bytes are classified and checked (metacheck errors or classifies them as nothing)"
"repo_download_review/invalid.is_readable_archive":
  kind: r_bug_fixed
  ref: U76
  reason: "a name with an undecodable byte is still read as an archive (metacheck 0.4.3.7 answers FALSE with a warning for \"a<82>.zip\" and \"c<82>.tar.gz\")"
