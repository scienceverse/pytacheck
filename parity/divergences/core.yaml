# Cases in generated case files of the core lane (llm, llm_review) that differ
# from R on purpose. Format (see parity/cases.py): "<area>/<id>": {kind, ref,
# reason}; kind is one of parity.cases.DIVERGENCE_KINDS, ref the
# docs/UPSTREAM_ISSUES.md entry.
"llm_review/llm.input.na_only":
  kind: r_bug_fixed
  ref: U298
  reason: "when every text is NA there is nothing to ask and every answer is missing (R stops with \"object 'structured' not found\", because its early return for this case uses `structured` before it is defined)"
"llm_review/llm.input.text_col_answer":
  kind: r_bug_fixed
  ref: U19
  reason: with text_col = "answer" the texts and the answers are both kept (answer.x, answer.y); R overwrites the answers with the texts
"llm/llm.groq.malformed": &json_text
  kind: deliberate
  ref: D73
  reason: "the error text of a reply that is not valid JSON is Python's json module's (R: jsonlite's lexical or parse error); the reply is still asked for again, five attempts in all"
"llm_review/structured.probe_truncated": *json_text

# Cases of other lanes' areas that differ from R because of core-lane fixes
# (text_search(), module_run(), module_report(), llm(), pubpeer_comments()).
# The module code is unchanged; the core function it calls no longer has the bug.
"bibr12/module.coi_check_oi.preprint": &u80_coi
  kind: r_bug_fixed
  ref: U80
  reason: the table's header column holds the section's header (R's text_search(return = "section") groups without it and returns NA)
"bibr12/module.coi_check_oi.PMC4383902": *u80_coi
"bibr12/module.coi_check_oi.mixed": *u80_coi
"grobid12/module.coi_check_oi.demo": *u80_coi
"grobid12/module.coi_check_oi.0956797615569889": *u80_coi
"mod_urls_open_review/all_urls.review.chain_after_open_practices": &u77_chain
  kind: r_bug_fixed
  ref: U77
  reason: all_urls' na_replace = 0 fills only its own columns (R recycles it over the chained summary table, so open_practices' NA cells became 0 and its logical columns numeric)
"mod_urls_open_review/all_urls.review.chain_after_open_practices_none": *u77_chain
"mod_urls_open_review/all_urls.review.chain_after_open_practices_twice": *u77_chain
"mod_urls_open_review/all_urls.review.chain_single_after_open_practices": *u77_chain
"mod_ref_pubpeer_summary_review/ref_pubpeer.nourl_only":
  kind: r_bug_fixed
  ref: U14
  reason: pubpeer_comments() always returns the url and users columns, so feedback without a url is reported (R's table lacks the column and the module fails)
# U158
"mod_urls_open/all_urls.psychsci":
  kind: r_bug_fixed
  ref: U158
  reason: "\"et al.Premotor\" (et al. glued to the next word) is not a URL"
# D76: json_expand() reads JSON with metacheck._json.loads and flattens it (no jsonlite value model)
"text_extract/json_expand.complex":
  kind: deliberate
  ref: D76
  reason: '"1+2i" stays text (R type.convert() makes a complex column)'
"text_extract/json_expand.nested":
  kind: deliberate
  ref: D76
  reason: nested arrays and objects are their leaves joined by ";" in order (R deparses them, 1:2, c("a", "b"), a matrix by column)
"text_extract/json_expand.parser":
  kind: deliberate
  ref: D76
  reason: comments are parsing errors (yajl allows them); a NUL or lone surrogate in a string is kept or U+FFFD (R truncates or writes "?")
"text_extract/json_expand.error.unnamed":
  kind: deliberate
  ref: D76
  reason: an array of scalars and arrays is "not a list" (R's bind_rows() fails)
"text_extract/json_expand.error.duplicate":
  kind: deliberate
  ref: D76
  reason: a repeated key keeps its last value (R's bind_rows() fails on the duplicated name)
"text_extract/json_expand.error.empty_name":
  kind: deliberate
  ref: D76
  reason: an empty key is a column named "" (R's bind_rows() fails)
"text_extract_review/json_expand.review.type_convert":
  kind: deliberate
  ref: D76
  reason: null stays missing in text columns (R pastes it to ""); "NAN"/"nan" read as numbers and hexadecimal by R's own grammar, not type.convert()'s passes
"text_extract_review/json_expand.review.dates":
  kind: deliberate
  ref: D76
  reason: '{"$date": ...} is an ordinary object, a column of its own in an array of objects and its value elsewhere (jsonlite makes it a POSIXct)'
