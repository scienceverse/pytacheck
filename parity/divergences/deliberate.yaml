# Cases in generated case files that differ from R on purpose. Format (see
# parity/cases.py): "<area>/<id>": {kind, ref, reason}; kind is one of
# parity.cases.DIVERGENCE_KINDS, ref the docs/UPSTREAM_ISSUES.md entry.
"mod_codebook_review/codebook_check.rv_dupscale": &d14
  kind: deliberate
  ref: D14
  reason: the OSD translations$en list repeats bfi_2 in R; pytacheck keeps one entry per name (a dict)
"mod_codebook_review/codebook_check.llm.rv_dupscale": *d14
"mod_codebook_review/codebook_check.llm_odd.rv_dupscale": *d14
"mod_codebook_review/codebook_check.llm_odd_na.rv_dupscale": *d14
# a sentence repeated word for word in a paper (V7; D60). stat_p_exact and stat_p_nonsig are
# validated checks: this change awaits the maintainer's OK on the pull request (D60 in docs/UPSTREAM_ISSUES.md).
"mod_p_values/all_p_values.duplicate_paragraph": &d60
  kind: deliberate
  ref: D60
  reason: a paragraph repeated word for word counts once, so its p-values are listed once; metacheck lists them again for each copy (4 rows here, 2 in pytacheck)
"mod_p_values/stat_p_exact.duplicate_paragraph": *d60
"mod_p_values/stat_p_nonsig.duplicate_paragraph": *d60
# tables in a .qmd are raw HTML blocks, not R chunks (D75): report_qmd() of these
# causal_claims reports (parity_support.report_qmd) writes each table as pytacheck's .qmd does
"mod_causal_review/causal_claims.review.fake.report.yellow": &d74
  kind: deliberate
  ref: D75
  reason: the report's tables are raw HTML blocks of their cells (R writes R chunks that rebuild the tables as code); the cells and the rest of the report are the same
"mod_causal_review/causal_claims.review.fake.report.title_only": *d74
"mod_causal_review/causal_claims.review.fake.report.demo": *d74
"mod_causal_review/causal_claims.review.fake.report.psychsci_list": *d74
# the statcheck port on plain Python values and scipy (D78): the rule for infinite degrees of
# freedom, flags that must be TRUE/FALSE, and stats() settings as keyword arguments
"stats_review/statcheck.review.chisq_inf_df.small_stat": &d78_inf
  kind: deliberate
  ref: D78
  reason: infinite degrees of freedom follow scipy (t is normal, chi-square and Q get their limit p = 1, F is not checkable and is dropped); R stops on if (NA) for a small chi-square or Q statistic and uses the chi-square limit for F
"stats_review/statcheck.review.Q_inf_df": *d78_inf
"stats_review/statcheck.review.F_inf_df1": *d78_inf
"stats_review/statcheck.review.F_inf_df2": *d78_inf
"stats_review/stats.review.inf_df": *d78_inf
"stats_review/compute_p.review.chisq_inf_df": *d78_inf
"stats_review/statcheck.review.OneTailedTests_2": &d78_flag
  kind: deliberate
  ref: D78
  reason: a statcheck flag must be TRUE or FALSE (or 1/0) and 2 raises ValueError; R compares flags with == TRUE, so 2 means FALSE (decision_error_test() returns NULL)
"stats_review/statcheck.review.OneTailedTxt_2": *d78_flag
"stats_review/statcheck.review.OneTailedTxt.OneTailedTests_2": *d78_flag
"stats_review/statcheck.review.pZeroError_2": *d78_flag
"stats_review/statcheck.review.AllPValues_2": *d78_flag
"stats_review/stats.review.AllPValues_2": *d78_flag
"stats_review/decision_error_test.review.pEqualAlphaSig_2": *d78_flag
"stats_review/stats.review.partial.alp": &d78_args
  kind: deliberate
  ref: D78
  reason: stats() takes statcheck's settings as Python keyword or positional arguments, so an abbreviated name or texts = raises TypeError; R matches unique prefixes and lets texts = replace the text
"stats_review/stats.review.partial.AllP": *d78_args
"stats_review/stats.review.partial.OneTailedTe": *d78_args
"stats_review/stats.review.partial.st": *d78_args
"stats_review/stats.review.partial.s": *d78_args
"stats_review/stats.review.texts_rebound": *d78_args
"stats_review/stats.review.texts_rebound.none": *d78_args
# fields and columns are read by their exact name, and a scalar has no fields (D81): R's `$`
# also takes a unique prefix of a name, and stops on a scalar
"archives_d2/reshare_file_download.mock.no_caps":
  kind: deliberate
  ref: D81
  reason: a file without `hash` has no checksum; R's `x$hash` reads its `hash_type` ("SHA1") as the checksum
"datacheck_columns/parse_qsf.survey.qsf": &d81_qsf
  kind: deliberate
  ref: D81
  reason: a choice without `Display` has no label and a question without `QuestionText` no text; R's `$` reads them from `DisplayLogic` and `QuestionText_Unsafe`
"datacheck_columns/parse_codebook.survey.qsf": *d81_qsf
"datacheck_columns/parse_codebook.group_qsf": *d81_qsf
"datacheck_columns/.qsf_option_display.partial": *d81_qsf
"datacheck_columns_review/.qsf_option_display.displaylogic": *d81_qsf
"datacheck_columns_review/parse_qsf.edge.qsf": *d81_qsf
"datacheck_columns_review/parse_codebook.edge.qsf": *d81_qsf
"db_review/doi_lookup.mock.partialpage": &d81_prefix
  kind: deliberate
  ref: D81
  reason: names are matched exactly; R's `$` reads a field whose name only starts with the one asked for (a unique prefix)
"db_review/doi_resolves.mock.codes": *d81_prefix
"llm_review/apply_reasoning.partial_think": *d81_prefix
"codecheck_review/code_extract_py.review.nul_in_key": *d81_prefix
"statout_core_review/stat_output_validate.partial_names": *d81_prefix
"statout_core_review/r_merge_captures.partial_line": *d81_prefix
"statout_readers/jasp_analyses_summary.flat": *d81_prefix
"statout_readers_review/import_omv.labels.review": *d81_prefix
"repo_download/file_category.partial_match":
  kind: deliberate
  ref: D81
  reason: a table without a `name` column fails as R fails on one; R's `contents$name` reads its `names` column
"bibr12_review/malformed.read.source_scalar": &d81_scalar
  kind: deliberate
  ref: D81
  reason: a scalar where a JSON object is expected has no fields, so the file is read; R stops ($ operator is invalid for atomic vectors)
"bibr12_review/malformed.write.source_scalar": *d81_scalar
"bibr12_review/malformed.read.extraction_scalar": *d81_scalar
"bibr12_review/malformed.write.extraction_scalar": *d81_scalar
"bibr12_review/malformed.read.producer_scalar": *d81_scalar
"bibr12_review/malformed.write.producer_scalar": *d81_scalar
"codecheck/code_extract_py.text.scalar": *d81_scalar
"datacheck_columns/parse_qsf.scalar_json": *d81_scalar
