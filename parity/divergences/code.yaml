"codecheck_review/code_extract_r.review.eval_is_latex_output.doc1": *d80_expr
"codecheck_review/code_extract_r.review.rnw_is_latex_output.doc0": *d80_expr
"codecheck_review/code_extract_r.review.rnw_is_latex_output.doc1": *d80_expr
"codecheck_review/code_extract_r.review.engine_NA.doc0": &d80_engine
  kind: deliberate
  ref: D80
  reason: a literal NA or NULL engine is an engine that is not R, so the chunk is commented out; knitr stops on params$engine != 'R'
"codecheck_review/code_extract_r.review.engine_NA.doc1": *d80_engine
"codecheck_review/code_extract_r.review.engine_NULL.doc0": *d80_engine
"codecheck_review/code_extract_r.review.engine_NULL.doc1": *d80_engine
"codecheck_review/code_extract_r.review.duplicate_error.doc0": &d80_dup
  kind: deliberate
  ref: D80
  reason: a later duplicate chunk option wins for every option; knitr's purl reads the first error option
"codecheck_review/code_extract_r.review.duplicate_error.doc1": *d80_dup
"codecheck_review/code_extract_r.review.na_first_code_line.doc0": &d80_na
  kind: deliberate
  ref: D80
  reason: an NA line is the text NA wherever it is; knitr stops when it is the first code line of a chunk (xfun::divide_chunk() tests if (!NA))
"codecheck_review/code_extract_r.review.na_first_code_line.doc1": *d80_na
"codecheck_review/code_extract_r.review.na_rnw_chunk.doc0": *d80_na
"codecheck_review/code_extract_r.review.na_rnw_chunk.doc1": *d80_na
"codecheck_review/code_extract_r.review.na_indented_chunk.doc0": *d80_na
