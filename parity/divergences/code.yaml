# --- repo_check module (inst/modules/repo_check.R) --------------------------
"mod_repo_check/repo_check.osf.registration2":
  kind: r_bug_fixed
  ref: U122
  reason: when following a registration to its source project fails, the registration is reported with its files and the error; R reports "no repositories found"
"mod_repo_check/repo_check.dspace.unfound": &u43_one
  kind: r_bug_fixed
  ref: U43
  reason: a DSpace item its host does not know is flagged "invalid or inaccessible DSpace item" (gated_repos, and the Error column of the report's repository table); metacheck keeps it as an empty repository ("We found 1 empty repository", no flag)
"mod_repo_check/repo_check.dspace7.unfound": *u43_one
"mod_repo_check/repo_check.dspace.unfound_two": *u43_one
"mod_repo_check/repo_check.dspace.found_and_unfound":
  kind: r_bug_fixed
  ref: U43
  reason: an unknown DSpace item beside a found one is kept, flagged "invalid or inaccessible DSpace item" (an empty repository, so yellow); metacheck drops it with the repositories without files and counts one repository. The found item's licence is its dc.rights.license, not the access status in dc.rights (U227)

# --- statout readers (R/spv.R, R/jasp.R, R/omv.R, R/stata.R, R/mplus.R) ------
"statout_readers/import_spv.modern": &u148_tpl
  kind: r_bug_fixed
  ref: U148
  reason: a template value is rendered ('3', 'a of 2.5, b'); R puts the raw template ('^1 of ^2') in the cell
"statout_readers/export_spv_html.modern": *u148_tpl
"statout_readers/spv_decode_light_table.0000000004": *u148_tpl
"statout_readers/spv_decode_light_table.0000000005": *u148_tpl
"statout_readers_review/import_spv.spv_strings": *u148_tpl
"statout_readers_review/export_spv_html.spv_strings": *u148_tpl
"statout_readers_review/spv_decode_light_table.t2": *u148_tpl
"statout_readers_review/export_spv_html.spv_charts": &u148_chart
  kind: r_bug_fixed
  ref: U148
  reason: a chart whose fitted line cannot be drawn (scalar, function, formula) is drawn without that line; since 0.4.3.7 R replaces the whole chart by the note '(This chart could not be drawn.)' (as does this port for a box plot without data) instead of failing the export
"statout_readers_review/import_spv.attrs.spv_charts": &d63_fits
  kind: deliberate
  ref: D63
  reason: only a fitted-curve text that is arithmetic in x is listed and drawn; R keeps any expression its parser accepts (TRUE, a * x, if/function/assignment, x %% 2) as a legend entry
"statout_readers_review/import_spv.attrs.spv_charts_ok": *d63_fits
"statout_readers_review/url_decode.vector": &u148_img
  kind: r_bug_fixed
  ref: U148
  reason: a malformed %-escape is kept (R's URLdecode() makes a NUL and fails)
"statout_readers/import_spv.charts": &u144
  kind: r_bug_fixed
  ref: U144
  reason: a case of the case-data box plot with a missing category is dropped, like one with a missing value; R (which decodes the plot since 0.4.3.7) lists it with the category 'NaN'
"statout_readers_review/smcl_command_chunks.vector":
  kind: r_bug_fixed
  ref: U140
  reason: a Stata command is its '. ' line and the echo lines right after it; R counts echo-looking lines anywhere in the chunk (as .r_echo_chunks(), U140)
"statout_readers_review/import_stata_smcl.latin1": &d25_latin1
  kind: better_logic
  ref: D25
  reason: 'latin1 bytes: R''s regex functions reject the invalid UTF-8 strings readLines() returns ("input string N is invalid UTF-8"), so metacheck cannot read a latin1 log at all; pytacheck decodes it with replacement characters instead of failing'
"statout_readers_review/import_mplus_output.latin1": *d25_latin1

