"codecheck_review/code_extract_r.review.engine_call.doc0": *d80_expr
"codecheck_review/code_extract_r.review.engine_call.doc1": *d80_expr
"codecheck_review/code_extract_r.review.comment_symbol.doc0": *d80_expr
"codecheck_review/code_extract_r.review.comment_symbol.doc1": *d80_expr
"codecheck_review/code_extract_r.review.comment_call.doc0": *d80_expr
"codecheck_review/code_extract_r.review.comment_call.doc1": *d80_expr
"codecheck_review/code_extract_r.review.eval_is_html_output_excludes.doc0": *d80_expr
