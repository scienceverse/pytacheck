"codecheck/code_extract_r.text.bad_options.doc0": &d80_bad
  kind: deliberate
  ref: D80
  reason: chunk options that are not valid R are read as far as they go and the chunk is extracted; knitr stops ("Invalid syntax for chunk options")
"codecheck/code_extract_r.text.bad_options.doc1": *d80_bad
"codecheck/code_extract_r.text.bad_options.doc2": *d80_bad
"codecheck/code_extract_r.text.unbalanced.doc0": &d80_fence
  kind: deliberate
  ref: D80
  reason: a chunk on the first line closes at its own fence (a fence of another length is code when the matching one follows); knitr sets no fence for a first-line chunk, so any fence ends it
"codecheck/code_extract_r.text.unbalanced.doc1": *d80_fence
"codecheck/code_extract_r.text.unbalanced.doc2": *d80_fence
"codecheck/code_extract_r.text.params.doc0": &d80_params
  kind: deliberate
  ref: D80
  reason: YAML params are written as one list(...) line with c() for vectors; knitr writes dput()'s wrapped lines (1:2 for consecutive integers)
"codecheck/code_extract_r.text.params.doc1": *d80_params
"codecheck/code_extract_r.text.params.doc2": *d80_params
