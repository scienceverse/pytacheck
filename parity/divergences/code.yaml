# Cases in the code lane's generated case files (codecheck, mod_code, repo_check,
# reg_check, reproducibility_check, repro_core, statout) where pytacheck fixes a
# metacheck bug on purpose. Format (see parity/cases.py): "<area>/<id>": {kind,
# ref, reason}; kind is one of parity.cases.DIVERGENCE_KINDS, ref the
# docs/UPSTREAM_ISSUES.md entry.

# --- codecheck (R/code_check.R) ---------------------------------------------
# Notebooks and lock files are read as standard JSON (metacheck._json.loads); jsonlite's
# yajl parser also accepts what no JSON writer produces. The maintainer decided
# (2026-10-04) not to reproduce that.
"codecheck_review/code_extract_py.review.comments": &yajl_comments
  kind: c_quirk
  reason: "yajl accepts /* */ and // comments in JSON text; the text is not valid JSON, so no cells are read"
"codecheck_review/code_extract_py.review.comment_first": *yajl_comments
"codecheck_review/code_extract_py.review.unterminated_block_comment": *yajl_comments
"codecheck_review/code_lang.review.nb_comments": *yajl_comments
"codecheck_review/code_extract_py.review.file_nb_comments": *yajl_comments
"codecheck_review/code_extract_py.review.vertical_tab_whitespace": &yajl_whitespace
  kind: c_quirk
  reason: "yajl counts a vertical tab and a form feed as JSON white space; the text is not valid JSON, so no cells are read"
"codecheck_review/code_extract_py.review.file_nb_vtab": *yajl_whitespace
"codecheck_review/code_extract_py.review.nul_escape": &yajl_escapes
  kind: c_quirk
  reason: "yajl ends a string at a \\u0000 escape and decodes a lone high surrogate to '?' (or combines it with any following \\u escape); the JSON reader keeps the NUL and turns a lone surrogate into U+FFFD"
"codecheck_review/code_extract_py.review.lone_high_surrogate": *yajl_escapes
"codecheck_review/code_extract_py.review.high_then_other_escape": *yajl_escapes
"codecheck_review/code_extract_py.review.file_nb_nul": *yajl_escapes
"codecheck_review/code_extract_py.review.duplicate_keys":
  kind: c_quirk
  reason: "jsonlite keeps both copies of a repeated key and `$` reads the first; the JSON reader keeps the last"
"codecheck_review/code_version_pin_check.review.jsonlite_quirks":
  kind: c_quirk
  reason: "the renv.lock with comments (yajl accepts them) is not valid JSON, so it is skipped; the lock file with a byte-order mark and a numeric R version is still read"

