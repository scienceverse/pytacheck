# Report cases (areas report and report_review) that differ from R at the pin (4a61888,
# metacheck 0.4.3.7). Format (see parity/cases.py): "<area>/<id>": {kind, ref, reason[, r_text]},
# the refs are D- and U-entries of docs/UPSTREAM_ISSUES.md.
#
# The report layout, the report types (checklist included) and the 0.4 fixes of U3, U7, U128 and
# U129 are not differences any more: no case carries a mark for them. A module's own difference
# (marginal's wording, code_check, data_check, repo_check, codebook_check) is not marked here: it
# shows in the report cases that run the module until that module's lane settles it.

# D131: a module that is not one of metacheck's own (the report tests' own modules) -------
# metacheck 0.3.3.1+ links every module to a chapter of the online manual, a made-up
# mod-tests/report/modules/<file>.R.html for a module file of one's own; pytacheck links only
# metacheck's own modules (report._module_chapter_link).
"report/module_report.validation.hits": &dx_report_130
  kind: deliberate
  ref: D131
  reason: "a module that is not one of metacheck's own has no chapter in the online manual, so no \"Read more\" link (metacheck links it to a chapter that does not exist)"
  r_text: [["Read more in the \\[metacheck manual\\]\\(https://www\\.scienceverse\\.org/metacheck_book/chapters/mod-tests/[^)]*\\)\\.\\n\\n", "", "regex"]]
"report/module_report.validation.none": *dx_report_130
"report/module_report.list_summary": *dx_report_130
"report_review/module_report.summary_recycled_equal": *dx_report_130
"report_review/module_report.summary_vector_equal": *dx_report_130
"report_review/module_report.summary_vector_differs": *dx_report_130
"report_review/module_report.report_blank_vector": *dx_report_130
"report_review/module_report.header_values": *dx_report_130
"report_review/module_report.length_threshold": *dx_report_130
"report_review/module_report.two_validations_four_authors": *dx_report_130
"report/module_report.null_summary": *dx_report_130
"report/module_report.bad_traffic_light": *dx_report_130
"report/report_repository.stand_in": *dx_report_130
"report_review/report_qmd.zero_row_info": *dx_report_130
"report_review/report_qmd.demo.real_modules": *dx_report_130
"report_review/report_qmd.no_doi_column": *dx_report_130
"report_review/report_qmd.vector_summary": *dx_report_130
# a module without details has no "How It Works" callout at all here: R's holds the link alone
"report/module_report.no_details": &dx_report_131_alone
  kind: deliberate
  ref: D131
  reason: "a module that is not one of metacheck's own has no chapter in the online manual, so a module with no details has no How It Works callout (metacheck writes a callout holding only the link to a chapter that does not exist)"
  r_text: [["\\n\\n::: \\{\\.callout-note title=\"How It Works\" collapse=\"true\"\\}\\n\\nRead more in the \\[metacheck manual\\]\\(https://www\\.scienceverse\\.org/metacheck_book/chapters/mod-tests/[^)]*\\)\\.\\n\\n:::\\n", "", "regex"]]
# reports that hold both kinds of module
"report/report.qmd.demo": *dx_report_130
"report/report.qmd.args": *dx_report_130
"report/report_qmd.demo.all_sections": &dx_report_131_both
  kind: deliberate
  ref: D131
  reason: "a module that is not one of metacheck's own has no chapter in the online manual, so no \"Read more\" link and, for a module with no details, no How It Works callout (metacheck links them to chapters that do not exist)"
  r_text: [["\\n::: \\{\\.callout-note title=\"How It Works\" collapse=\"true\"\\}\\n\\nRead more in the \\[metacheck manual\\]\\(https://www\\.scienceverse\\.org/metacheck_book/chapters/mod-tests/[^)]*\\)\\.\\n\\n:::\\n", "", "regex"], ["Read more in the \\[metacheck manual\\]\\(https://www\\.scienceverse\\.org/metacheck_book/chapters/mod-tests/[^)]*\\)\\.\\n\\n", "", "regex"]]

"report_review/report_qmd.na_title_blank_doi": *dx_report_131_both

# U243, U244: metacheck bugs pytacheck fixes -------------------------------------------------
"report_review/report_qmd.title_doi_fail_summary":
  kind: r_bug_fixed
  ref: U244
  reason: "a title with %s keeps it (R fills the header's placeholders one after the other, so the title's %s gets the version and the DOI line is left as %s)"
  r_text: [["100% title\\ with 0.4.3.7\"", "100% title\\ with %s\""], ["\n%s <!-- doi, if exists -->", "\nDOI: [10.1234/abc](https://doi.org/10.1234/abc) <!-- doi, if exists -->"]]
"report_review/validate.duplicate_ids":
  kind: r_bug_fixed
  ref: U243
  reason: "validate() makes one paper per distinct paper_id, so ids 1, 1, 2 give 4 rows joined back to gt (R makes a paper per row, metacheck renames the second 1 to 1~2 (U208) and the module's rows for it join to nothing: 6 rows)"
