# Every difference between metacheck and pytacheck that the accuracy report
# (`python -m parity accuracy`, docs/PARITY.md) finds on the realistic corpus,
# and why. `--gate` fails on a difference no entry explains and on an entry that
# explains none.
#
# differences: `module`, `input` (the path or its short name, e.g.
# problems/203020.xml) and `field` (run, traffic_light, summary_text, report,
# summary_table, summary_table.<column>, table, table.<column>) are globs, or
# lists of globs, where `*` matches anything; `match` is the highest level of
# difference the entry explains: whitespace (equal once whitespace is removed),
# wording (other text, same numbers) or values. `kind`, `ref` and `reason` are
# those of a parity mark on a tier-1 case (docs/UPSTREAM_ISSUES.md).
#
# floors: a module whose traffic lights agree with metacheck's on fewer than 90%
# of its inputs is a warning (the upstream sync asks for human review), unless
# a floor here names the share expected and why.
#
# This file has code owners (.github/CODEOWNERS): a change needs their review.

differences:
  # Grobid TEI clean-up -------------------------------------------------------
  - module: "*"
    input: "*.xml"
    field: "table.*"
    match: whitespace
    kind: r_bug_fixed
    ref: U16
    reason: >-
      numbers before a TEI tag keep their space ('p = 0.152', 'Study 1', 'Henry, 2019',
      '24 July 2025') and DOIs split by a PDF line break are rejoined; metacheck's
      number-before-operator clean-up treats a closing tag's '<' as an operator and glues them
  - module: [all_p_values, stat_p_exact]
    input: problems/0956797617737129.xml
    field: [summary_text, summary_table.p_values, table]
    match: values
    kind: r_bug_fixed
    ref: U28
    reason: >-
      the link text 'both indices, r(68) = .58, p < .001 (see Fig' keeps its text in its own
      row; metacheck replaces the URL's link text in every row, which removes this p-value
      (37 p-values, metacheck finds 36)
  - module: [stat_check, stat_effect_size, stat_p_nonsig]
    input: problems/0956797617737129.xml
    field: [table.text, table.expanded]
    match: values
    kind: r_bug_fixed
    ref: U28
    reason: >-
      sentences keep 'see Fig. 3a' and 'see Fig. 4'; metacheck's link-text replacement over
      every row turns 'Fig' into the supplement's URL
  - module: all_urls
    input: problems/0956797617737129.xml
    field: [summary_table.urls, table]
    match: values
    kind: r_bug_fixed
    ref: U28
    reason: >-
      20 URLs, each at its own link text; metacheck's replacement of link text over every
      row multiplies the supplement URL (31)
  - module: open_practices
    input: problems/0956797617737129.xml
    field: [report, summary_table.*_statements, table]
    match: values
    kind: r_bug_fixed
    ref: U28
    reason: >-
      the data statement links osf.io/6b4ag (metacheck: file://localhost/opt/grobid/...
      from a link without a target) and the statements keep their text where metacheck
      replaced 'Supplemental Material' with the URL in every row
  # URLs ------------------------------------------------------------------------
  - module: all_urls
    input: psychsci/0956797613520608.json
    field: [traffic_light, summary_table.urls, table]
    match: values
    kind: r_bug_fixed
    ref: U158
    reason: "'et al.Premotor' is not a URL (metacheck lists the host name 'al.Premotor')"
  - module: all_urls
    input: bibr12/preprint.json
    field: [summary_table.urls, table]
    match: values
    kind: r_bug_fixed
    ref: U206
    reason: "e-mail addresses are not URLs (metacheck lists 'gmail.com' and the parts of the other addresses: 17 rows, 15 here)"
  # module text -----------------------------------------------------------------
  - module: [open_practices, ref_accuracy, ref_consistency]
    input: "*"
    field: report
    match: wording
    kind: r_bug_fixed
    ref: U83
    reason: >-
      typos in report text are corrected: 'recognized' (metacheck: 'reconized'),
      'Such an incoherence' ('incoherent'), 'likely' ('likley')
  # all_urls on bibr's links (D82) -------------------------------------------
  - module: all_urls
    input: "*"
    field: [traffic_light, summary_table, summary_table.urls, table, table.*]
    match: values
    kind: deliberate
    ref: D82
    reason: >-
      all_urls lists the paper's links (with their visible text) and the plain-text URLs that
      are not links, drops dotted names that are not URLs (pwr.t.test, Soc.Lond), and adds
      the link_text, url, domain and source columns
  # open_practices on bibr's data availability statement (D83) ------------------
  - module: open_practices
    input: "*"
    field: summary_table
    match: values
    kind: deliberate
    ref: D83
    reason: >-
      the summary table has the no_data column (the data availability statement says there
      are no data to share)
  - module: open_practices
    input: bibr12/full.json
    field: [traffic_light, summary_text, summary_table.*, table]
    match: values
    kind: deliberate
    ref: D83
    reason: >-
      the paper's data availability statement ('Data are available on OSF.') is only in
      bibr's info table, not in the text: pytacheck reads it and finds shared data
  # the COI, funding and ethics checks fall back to bibr's statements (D84) -------
  - module: [coi_check, coi_check_oi, funding_check, funding_check_oi, ethics_check]
    input: bibr12/full.json
    field: [traffic_light, summary_text, report, summary_table.*, table]
    match: values
    kind: deliberate
    ref: D84
    reason: >-
      the paper's COI, funding and ethics statements are only in bibr's info table, not in
      the text: the expressions find nothing, so pytacheck uses bibr's statements

floors: []  # every module agrees with metacheck on 90% of its inputs or more
