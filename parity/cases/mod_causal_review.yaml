        "r": "(function() { .fake <- function(sentence, ...) { out <- data.frame(sentence = character(0), causal = logical(0), cause = character(0), effect = character(0)); if (length(sentence) == 0 || all(trimws(sentence) == \"\")) return(out); for (s in sentence) { w <- strsplit(s, \" \", fixed = TRUE)[[1]]; if (grepl(\"caus\", tolower(s), fixed = TRUE) || grepl(\"effect\", tolower(s), fixed = TRUE)) { out <- rbind(out, data.frame(sentence = s, causal = TRUE, cause = w[1], effect = w[length(w)])); if (grepl(\" and \", s, fixed = TRUE)) out <- rbind(out, data.frame(sentence = s, causal = TRUE, cause = w[2], effect = w[length(w) - 1])) } else { out <- rbind(out, data.frame(sentence = s, causal = FALSE, cause = NA_character_, effect = NA_character_)) } }; out }; .fake_na <- function(sentence, ...) { out <- .fake(sentence); out$causal[grepl(\"maybe\", tolower(out$sentence), fixed = TRUE)] <- NA; out }; .mk <- function(abstract = character(0), body = character(0), title = \"\", id = NULL) { p <- test_paper(c(abstract, body)); p$text$section_id <- c(rep(1, length(abstract)), rep(2, length(body))); p$section <- dplyr::tibble(section_id = c(1, 2), header = c(\"Abstract\", \"Methods\"), parent_section_id = NA_integer_, section_type = c(\"abstract\", \"method\"), classification_score = 0); p$info$title <- title; if (!is.null(id)) p$paper_id <- id; p }; .untitled <- function(text, title = \"\", id = NULL) { p <- test_paper(text); p$info$title <- title; if (!is.null(id)) p$paper_id <- id; p }; p <- .mk(c(\"X causes Y.\", \"X causes Y.\", \"Nothing.\"), character(0), title = \"\", id = \"dup\"); testthat::with_mocked_bindings(module_run(p, \"causal_claims\"), causal_relations = .fake, .package = \"metacheck\") })()"
        "py": "lambda: (lambda p: pc.module_run(p, \"causal_claims\"))(__import__(\"tests.mod_causal.parity_support\", fromlist=[\"_\"]).mk(['X causes Y.', 'X causes Y.', 'Nothing.'], [], title='', id='dup'))"
