      "$expr":
        "r": "local({p <- tempfile(fileext = \".json\"); metacheck::manifest_merge(p, list(code = list(packages\
          \ = list(\"dplyr\", \"tidyr\")))); metacheck::manifest_merge(p, list(files = list(list(file_name\
          \ = \"a.csv\", size = 12.5, n = 3L, ok = TRUE, miss = NA, nested = list(a = NULL, b = list())))));\
          \ metacheck::manifest_merge(p, list(extra = 0.000012345, big = 5e8, tiny = 1e-7)); readLines(p)})"
        "py": "None"
  "py_drop":
  - "x"
  "py_args":
    "steps":
    - "code":
        "packages":
        - "dplyr"
        - "tidyr"
    - "files":
      - "file_name": "a.csv"
        "size": 12.5
        "n": 3
        "ok": true
        "miss": null
        "nested":
          "a":
            "$rnull": true
          "b": []
    - "extra": 1.2345e-05
      "big": 500000000.0
      "tiny": 1.0e-07
