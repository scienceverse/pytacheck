          ), file_size = c(100, 5e8, 1e6, 100, 100, 100), data_type = c(\"data\", \"data\", \"materials\"\
          , \"data\", \"data\", \"documentation\"), data_format = \"tabular\", file_location = c(rpath(\"\
          tests/datacheck_files/data/rwrite.csv\"), NA, NA, NA, NA, NA), stringsAsFactors = FALSE); metacheck:::.data_check_write_manifest(p,\
          \ files, c(TRUE, TRUE, FALSE, TRUE, TRUE, FALSE), gated = NULL, paper_id = \"p1\", download\
          \ = \"data\", max_file_size = 100, max_download_size = 500, skip_types = \"materials\", oversize\
