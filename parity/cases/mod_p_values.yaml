- "id": "all_p_values.duplicate_ids"
  "module": "all_p_values"
  "args":
    "paper":
      "$expr":
        "r": "local({p1 <- test_paper(c('No difference was found (p = .20).', 'The other test was imprecise (p < .05).')); p2 <- test_paper(c('A second paper found p = .30 here.', 'And p < .10 there.')); p2$paper_id <- p1$paper_id; p2$text$paper_id <- p1$paper_id; paperlist(p1, p2)})"
        "py": "(lambda p1, p2: (p2.__setitem__('paper_id', p1.paper_id), p2.__setitem__('text', p2['text'].assign(paper_id=p1.paper_id)), pc.PaperList([p1, p2]))[-1])(pc.test_paper(['No difference was found (p = .20).', 'The other test was imprecise (p < .05).']), pc.test_paper(['A second paper found p = .30 here.', 'And p < .10 there.']))"
  "compare": {"ignore": ["paper_id", "table.paper_id", "summary_table.paper_id"]}
- "id": "stat_p_exact.duplicate_ids"
  "module": "stat_p_exact"
  "args":
