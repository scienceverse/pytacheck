# ---------------------------------------------------------------- repeated rows and paper ids (V7, F6)
- "id": "all_p_values.duplicate_paragraph"
  "module": "all_p_values"
  "args":
    "paper":
      "$expr":
        "r": "local({p <- test_paper(c('No difference was found (p = .20).', 'The other test was imprecise (p < .05).')); p$text <- rbind(p$text, p$text); p})"
        "py": "(lambda p: (p.__setitem__('text', pd.concat([p['text'], p['text']], ignore_index=True)), p)[1])(pc.test_paper(['No difference was found (p = .20).', 'The other test was imprecise (p < .05).']))"
  "compare": {"ignore": ["paper_id", "table.paper_id", "summary_table.paper_id"]}
