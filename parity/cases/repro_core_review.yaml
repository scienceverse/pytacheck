- "id": "capture_module_tables.plain_lists"
  "r": "identity"
  "py": "tests.repro_core.parity_support.run"
  "args":
    "x":
      "$expr":
        "r": "{ source(\"tests/repro_core/parity_helpers.R\", local = TRUE); (function() { d <- tempfile(); p <- metacheck:::capture_module_tables(list(list(module = 'm1', table = data.frame(a = 1:2), summary_table = data.frame(paper_id = 'P1', k = 1L)), list(module = 'm1', table = data.frame(b = 'x'), summary_table = data.frame(paper_id = 'P1', k = 1L, j = 2)), list(table = data.frame(c = TRUE), title = 'T', previews = list(1), extra = 'kept')), d); x <- metacheck:::.load_module_tables(d, 'P1', NULL); list(file = sub('[.]rds$', '', basename(p)), prev = names(x$prev_outputs), m1 = metacheck:::collect_module_tables(d, 'm1'), m2 = metacheck:::collect_module_tables(d, 'module_2'), m3 = metacheck:::collect_module_tables(d, 'module_3'), sum = x$summary_table, m3_title = x$prev_outputs$module_3$title, m3_extra = x$prev_outputs$module_3$extra, m3_previews = x$prev_outputs$module_3$previews) })() }"
        "py": "lambda m: m.tmp(lambda d: (lambda p: (lambda x: {'file': __import__('os').path.basename(p)[:-5], 'prev': list(x.prev_outputs), 'm1': m.tables.collect_module_tables(d, 'm1'), 'm2': m.tables.collect_module_tables(d, 'module_2'), 'm3': m.tables.collect_module_tables(d, 'module_3'), 'sum': x.summary_table, 'm3_title': x.prev_outputs['module_3'].title, 'm3_extra': x.prev_outputs['module_3'].get('extra'), 'm3_previews': x.prev_outputs['module_3'].get('previews')})(m.tables._load_module_tables(d, 'P1', None)))(m.tables.capture_module_tables([{'module': 'm1', 'table': m.pd.DataFrame({'a': m.pd.Series([1, 2], dtype='Int64')}), 'summary_table': m.pd.DataFrame({'paper_id': ['P1'], 'k': m.pd.Series([1], dtype='Int64')})}, {'module': 'm1', 'table': m.pd.DataFrame({'b': ['x']}), 'summary_table': m.pd.DataFrame({'paper_id': ['P1'], 'k': m.pd.Series([1], dtype='Int64'), 'j': [2.0]})}, {'table': m.pd.DataFrame({'c': [True]}), 'title': 'T', 'previews': [1], 'extra': 'kept'}], d)))"
