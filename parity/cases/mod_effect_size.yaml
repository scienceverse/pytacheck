# ---------------------------------------------------------------- paper lists
- "id": "stat_effect_size.paperlist"
  "module": "stat_effect_size"
  "args":
    "paper":
      "$expr":
        "r": "paperlist(test_paper(\"A was bigger than B, t(124) = 1.23, p 0.013, d = 0.34.\"), test_paper(\"We also ran an ANOVA, F(1, 13) = 2.34, p = .23.\"), test_paper(\"No stats here.\"))"
        "py": "pc.PaperList([pc.test_paper(\"A was bigger than B, t(124) = 1.23, p 0.013, d = 0.34.\"), pc.test_paper(\"We also ran an ANOVA, F(1, 13) = 2.34, p = .23.\"), pc.test_paper(\"No stats here.\")])"
  "compare": {"ignore": ["paper_id", "table.paper_id", "summary_table.paper_id"]}
- "id": "stat_effect_size.paperlist_none"
  "module": "stat_effect_size"
  "args":
    "paper":
      "$expr":
        "r": "paperlist(test_paper(\"No stats here.\"), test_paper(\"The effect was d = 0.5.\"))"
        "py": "pc.PaperList([pc.test_paper(\"No stats here.\"), pc.test_paper(\"The effect was d = 0.5.\")])"
  "compare": {"ignore": ["paper_id", "table.paper_id", "summary_table.paper_id"]}
# ---------------------------------------------------------------- d coherence branches
- "id": "stat_effect_size.d_branches"
  "module": "stat_effect_size"
  "args":
    "paper":
      "$test_paper":
        "text":
        - "A was bigger than B, t(124) = 1.23, p = .013, d = 0.34."
        - "A was bigger than B, t(20) = 1.00, p = .32, d = 3.00."
        - "Paired, t(23) = 2.73, d = 0.56."
        - "Equal n, t(48) = 2.00, d = 0.57."
        - "Unequal n, t(38) = 2.10, d = 0.68."
        - "Odd df, t(47) = 2.00, d = 0.57."
        - "Welch, t(97.7) = 2.9, d = 0.59."
        - "No df, t = 2.10, d = 0.40."
        - "Inequality, t(30) < 1, d = 0.1."
        - "No d, t(30) = 2.5, η2 = .17."
        - "Negative, t(30) = -2.5, d = -0.9."
        - "Tiny df, t(1) = 3.0, d = 5.0."
        - "Four, t(2) = 5.0, d = 5.0."
        - "Zero df, t(0) = 1.5, d = 1.0."
        - "Large df, t(1000) = 2.00, d = 0.20."
        - "Cohen's d = 0.45, t(40) = 2.9."
        - "Curly, t(40) = 2.9, Cohen’s d = 0.45."
        - "Dz, t(40) = 2.9, dz = 0.45."
        - "Underscore, t(40) = 2.9, d_z = 0.45."
        - "Upper, t(40) = 2.9, D = 0.45."
        - "Hedges, t(40) = 2.9, g = 0.45."
        - "Hedges long, t(40) = 2.9, Hedges' g = 0.45."
        - "Drm, t(40) = 2.9, drm = 0.45."
        - "Two d, t(40) = 2.9, d = 0.95; d = 0.45."
        - "Two tests one d, t(40) = 2.9, t(40) = 3.1, d = 0.45."
        - "A was bigger than B, t(23) = 2.73; t(23) = 2.98; t(23) = 4.74, d = 0.56; d = 0.61; d = 0.97."
        - "Leading dot, t(40) = 2.9, p < .01, d = .453."
        - "Exponent, t(12) = 5e-1, d = 0.14."
        - "Comma, t(10) = 1,234, d = 0.3."
        - "Sample size df, t(n = 24) = 2.1, d = 0.4."
        - "Two dfs, t(1, 20) = 2.1, d = 0.4."
        - "Border, t(99) = 1.00, d = 0.11."
        - "Border2, t(99) = 1.00, d = 0.2."
        - "Mixed, t(20) = 2.1, F(1, 20) = 4.41, d = 0.94, ηp² = .18."
        - "Mixed unpaired, t(20) = 2.1, F(1, 20) = 4.41, ηp² = .18."
        - "Precise, t(15) = 3.162, d = 0.7906."
        - "r family, t(40) = 2.9, r = .41."
  "compare": {"ignore": ["paper_id", "table.paper_id", "summary_table.paper_id"]}
# ---------------------------------------------------------------- F / eta coherence branches
- "id": "stat_effect_size.f_branches"
  "module": "stat_effect_size"
  "args":
    "paper":
      "$test_paper":
        "text":
        - "The model was significant, F(1, 13) = 2.34, p = .23, ηp² = 0.15."
        - "No match, F(1, 13) = 2.34, ηp² = 0.35."
        - "The model was significant, F(5, 120) = 91.32; F(5, 120) = 74.45; F(5, 120) = 388.16, η² = .79; η² = .67; η² = .94."
        - "The model was significant, F(1, 48) = 5.23, p = .026, f = 0.37."
        - "The model was significant, F(1, 13) = 2.34, p = .23, ηp² = 0.15, f = 0.42."
        - "The model was significant, F(2, 151) = 1.00, p = .37, ωp² = 0.00."
        - "Xi, F(2, 151) = 1.00, ξ = 0.20."
        - "Both, F(2, 30) = 4.50, η² = .23, ηp² = .23."
        - "No es, F(2, 30) = 4.50."
        - "Inequality, F(2, 30) < 1, ηp² = .02."
        - "Partial word, F(1, 20) = 0.50, partial η2 = .02."
        - "Suffix p, F(1, 20) = 4.10, η2p = .17."
        - "Latin eta, F(1, 20) = 4.10, eta2 = .17."
        - "Latin partial eta, F(1, 20) = 4.10, etap2 = .17."
        - "Words, F(1, 20) = 4.10, partial eta squared = .17."
        - "d with F, F(1, 20) = 4.10, d = 0.9."
        - "Bayes, F(1, 20) = 4.10, BF10 = 3.2."
        - "Omega and eta, F(1, 20) = 0.50, ω² = 0.00, ηp² = .02."
        - "Omega latin, F(1, 20) = 4.10, omega2 = .12."
        - "Cohen f, F(1, 20) = 4.10, Cohen's f = 0.45."
        - "f squared, F(1, 20) = 4.10, f2 = 0.2."
        - "Spaced df, F( 3 , 60 ) = 2.80, ηp² = .12."
        - "Large F, F(2, 57) = 1200.5, ηp² = .98."
        - "Negative F, F(1, 20) = -4.10, ηp² = .17."
        - "Beta, F(1, 20) = 4.10, β = .41."
