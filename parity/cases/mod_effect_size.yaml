- "id": "stat_effect_size.na.no_stats"
  "module": "stat_effect_size"
  "args":
    "paper": {"$test_paper": {"text": ["There are no stats."]}}
  "compare": {"ignore": ["paper_id", "summary_table.paper_id"]}
