# LLM client parity cases (R/llm.R, R/llm-cache.R, R/cap-prompt.R).
# Cases that touch LLM options or API keys run inside withr::with_options()/
# with_envvar() in R and tests/llm/parity_helpers.scoped() in Python, so no
# state leaks into other areas. Network cases replay tests/llm/mocks.
"area": "llm"
"cases":
- "id": "sanitise.controls"
  "r": "metacheck:::.llm_sanitise_text"
  "py": "metacheck.llm.core._llm_sanitise_text"
  "args":
    "x":
      "$chr":
      - "plain"
      - "tab\there"
      - "ctrl\x01\ax\x1F"
      - "cr\r\nlf"
      - "café 中"
      - ""
      - "del\x7Fkeep"
- "id": "sanitise.numbers"
  "r": "metacheck:::.llm_sanitise_text"
  "py": "metacheck.llm.core._llm_sanitise_text"
  "args":
    "x":
      "$dbl":
      - !!int "1"
      - !!float "2.5"
      - !!int "100000"
      - !!float "0.1"
      - !!float "123456.7"
- "id": "sanitise.na"
  "r": "base::identity"
  "py": "tests.llm.parity_helpers.identity"
  "args":
    "x":
      "$expr":
        "r": "metacheck:::.llm_sanitise_text(c('a', NA, 'b\\x02'))"
        "py": "__import__('tests.llm.parity_helpers', fromlist=['_']).K._llm_sanitise_text(['a', None, 'b\\x02'])"
- "id": "sanitise.null"
  "r": "metacheck:::.llm_sanitise_text"
  "py": "metacheck.llm.core._llm_sanitise_text"
  "args":
    "x":
      "$null": !!bool "true"
