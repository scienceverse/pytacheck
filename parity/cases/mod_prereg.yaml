# Parity cases for the prereg_check module (inst/modules/prereg_check.R).
# Generated; each case runs module_run(<paper>, "prereg_check") on recorded API
# responses: metacheck's (upstream .../testthat/apis, with its page[size] redactor)
# or synthetic ones (tests/mod_prereg/mocks). Python side:
# tests/mod_prereg/parity_support.py::run_prereg.
"area": "mod_prereg"
"cases":
- "id": "prereg_check.module.no_links"
  "note": "module_run() directly: a paper list without links"
  "module": "prereg_check"
  "args":
    "paper":
      "$read":
      - "upstream/metacheck/tests/testthat/fixtures/psychsci/0956797613520608.json"
      - "upstream/metacheck/tests/testthat/fixtures/psychsci/0956797614522816.json"
      - "upstream/metacheck/tests/testthat/fixtures/psychsci/0956797614527830.json"
- "id": "prereg_check.module.no_links_test_paper"
  "note": "module_run() directly: a test paper without links"
  "module": "prereg_check"
  "args":
    "paper":
      "$expr":
        "r": "(function() { p <- test_paper(c(\"Nothing to see.\", \"No OSF here.\")); p$paper_id <- \"p_plain\"; p })()"
        "py": "__import__(\"tests.mod_prereg.parity_support\", fromlist=[\"_\"]).tp([], \"p_plain\", [\"Nothing to see.\", \"No OSF here.\"])"
- "id": "prereg_check.demo"
  "note": "OSF Preregistration and AsPredicted links in the demo paper"
  "r": "identity"
  "py": "tests.mod_prereg.parity_support.run_prereg"
  "args":
    "x":
      "$expr":
        "r": "(function() { .r <- httptest2::get_current_redactor(); httptest2::set_redactor(function(req) { req$url <- gsub(\"[?&]page(%5[Bb]size%5[Dd]|\\\\[size\\\\])=100\", \"\", req$url); req }); Sys.setenv(TESTTHAT = \"true\"); on.exit({ httptest2::set_redactor(.r); Sys.unsetenv(\"TESTTHAT\") }); tp <- function(url, id, text = LETTERS) { p <- test_paper(text, url); p$paper_id <- id; p }; httptest2::with_mock_dir(\"upstream/metacheck/tests/testthat/apis\", module_run(demopaper(), \"prereg_check\")) })()"
        "py": "None"
  "py_drop":
  - "x"
  "py_args":
    "demo": true
