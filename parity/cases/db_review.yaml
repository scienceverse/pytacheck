- "id": "get_orcid.given_initials"
  "r": "identity"
  "py": "copy.copy"
  "args":
    "x":
      "$expr":
        "r": "local({b <- as.list(body(metacheck::get_orcid)); e <- Find(function(e) is.call(e) && identical(e[[1]], as.name('<-')) && identical(e[[2]], as.name('given2')), b); vapply(c(\"L\", \"L.\", \"Lisa\", \"L M\", \"L. M.\", \"Lisa M\", \"Lisa M.\", \"L Marie\", \"Anne-Marie\", \" J R R \", \"J. R. R. Tolkien\", \"Ünal\", \"É.\", \"*\", \"Lisa Marie\", \"A.B.\", \"M.-L.\", \"Jean Paul Sartre\"), function(given) eval(e[[3]], list(given = given)), character(1), USE.NAMES = FALSE)})"
        "py": "(lambda o, u: [u.url_encode(o._initials(g)) for g in ['L', 'L.', 'Lisa', 'L M', 'L. M.', 'Lisa M', 'Lisa M.', 'L Marie', 'Anne-Marie', ' J R R ', 'J. R. R. Tolkien', 'Ünal', 'É.', '*', 'Lisa Marie', 'A.B.', 'M.-L.', 'Jean Paul Sartre']])(__import__('pytacheck.db.orcid', fromlist=['x']), __import__('pytacheck.db._utils', fromlist=['x']))"
- "id": "get_orcid.family_encoding"
  "r": "identity"
  "py": "copy.copy"
  "args":
    "x":
      "$expr":
        "r": "local({b <- as.list(body(metacheck::get_orcid)); e <- Find(function(e) is.call(e) && identical(e[[1]], as.name('<-')) && identical(e[[2]], as.name('family2')), b); vapply(c(\"DeBruine\", \" van der Berg \", \"O%27Brien\", \"Müller\", \"Smith&Co\"), function(family) eval(e[[3]], list(family = family)), character(1), USE.NAMES = FALSE)})"
        "py": "(lambda u, t: [u.url_encode(t(f)) for f in ['DeBruine', ' van der Berg ', 'O%27Brien', 'Müller', 'Smith&Co']])(__import__('pytacheck.db._utils', fromlist=['x']), __import__('pytacheck._r.base', fromlist=['x']).trimws)"
