"area": "mod_p_values_review"
# Adversarial review cases for the p-value modules (all_p_values, stat_p_exact,
# stat_p_nonsig): real Grobid papers, Unicode whitespace (TRE vs PCRE \s),
# exotic comparators, underflow / scientific zeros, the 0.05 boundary, NA and
# empty sentences, and paper lists whose IDs are C-locale sensitive.
"cases":
# ------------------------------------------------------------------ real papers
- "id": "all_p_values.real_papers"
  "known_divergence": {"kind": "r_bug_fixed", "ref": "U16", "reason": "The sentences read from the TEI differ (io fix: 'p = .27', metacheck 'p =.27'; 'see Fig. 3a' is not replaced by the supplement URL), which also lets one more 'p < .001' be found."}
  "module": "all_p_values"
  "args":
    "paper": {"$read": ["upstream/metacheck/tests/testthat/fixtures/debruine/debruine-child.xml", "upstream/metacheck/tests/testthat/fixtures/debruine/debruine-sex.xml", "upstream/metacheck/tests/testthat/fixtures/formats/preprint.pdf.tei.xml", "upstream/metacheck/tests/testthat/fixtures/formats/published.pdf.tei.xml", "upstream/metacheck/tests/testthat/fixtures/problems/0956797615569889.xml", "upstream/metacheck/tests/testthat/fixtures/problems/0956797617737129.xml"]}
