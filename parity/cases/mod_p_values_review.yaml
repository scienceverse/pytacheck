- "id": "stat_p_exact.na_text_id"
  "module": "stat_p_exact"
  "args":
    "paper":
      "$expr":
        "r": "local({p <- test_paper(c('A p < .05.', 'B p = .000.', 'C p = .2.', 'D p > .1.')); p$text$text_id[c(1, 2)] <- NA; p$text$paragraph_id[4] <- NA; p})"
        "py": "(lambda p: (p.__setitem__('text', p.text.assign(text_id=pd.array([None, None, 3, 4], dtype='Int64'), paragraph_id=[0.0, 0.0, 0.0, float('nan')])), p)[1])(pc.test_paper(['A p < .05.', 'B p = .000.', 'C p = .2.', 'D p > .1.']))"
  "compare": {"ignore": ["paper_id", "table.paper_id", "summary_table.paper_id"]}
