# ------------------------------------------------- paper lists: ids and dups
- "id": "all_p_values.paperlist_ids"
  "module": "all_p_values"
  "args":
    "paper":
      "$expr":
        "r": "paperlist(local({p <- test_paper(c('Same p < .05 sentence.')); p$paper_id <- 'b'; p}), local({p <- test_paper(c('Same p < .05 sentence.', 'p = .2')); p$paper_id <- 'a_b'; p}), local({p <- test_paper(c('p = .000')); p$paper_id <- 'Z'; p}), local({p <- test_paper(c('none')); p$paper_id <- '_x'; p}), local({p <- test_paper(c('p > .1')); p$paper_id <- 'a-b'; p}), local({p <- test_paper(c('p = .04')); p$paper_id <- '1'; p}), local({p <- test_paper(c('p = .04', 'p < .01')); p$paper_id <- 'a.b'; p}))"
        "py": "pc.PaperList([(lambda p, i: (p.__setitem__('paper_id', i), p)[1])(pc.test_paper(t), i) for t, i in [(['Same p < .05 sentence.'], 'b'), (['Same p < .05 sentence.', 'p = .2'], 'a_b'), (['p = .000'], 'Z'), (['none'], '_x'), (['p > .1'], 'a-b'), (['p = .04'], '1'), (['p = .04', 'p < .01'], 'a.b')]])"
