        "py": "pc.PaperList([(lambda p, i: (p.__setitem__('paper_id', i), p)[1])(pc.test_paper(t), i) for t, i in [(['Same p < .05 sentence.'], 'b'), (['Same p < .05 sentence.', 'p = .2'], 'a_b'), (['p = .000'], 'Z'), (['none'], '_x'), (['p > .1'], 'a-b'), (['p = .04'], '1'), (['p = .00', 'p < .01'], 'a.b')]])"
