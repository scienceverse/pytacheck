# ------------------------------------------------------------ unicode whitespace
- "id": "all_p_values.unicode_ws"
  "module": "all_p_values"
  "args":
    "paper":
      "$test_paper":
        "text":
          - "Thin p = .03 here."
          - "NBSP p < .05 here."
          - "Mixed p = .04 and p\t=\t.02 and P　=　.5."
          - "Sci p = 5.0 x 10^-2 and p = 1.2 e -3."
          - "Separator p =\x1c.01 and p\x1c= .02."
          - "Line p =\n.03 and p\n< .04."
  "compare": {"ignore": ["paper_id", "table.paper_id", "summary_table.paper_id"]}
- "id": "stat_p_exact.unicode_star"
  "module": "stat_p_exact"
  "args":
    "paper":
      "$test_paper":
        "text":
          - "Thin p < .05 (* p < .05)."
          - "NBSP p < .05 (* p < .05)."
          - "Figure space p < .05 (* p < .05)."
          - "Narrow NBSP p < .05 (* p < .05)."
          - "Ideographic p < .05 (*　p < .05)."
          - "Separator p < .05 (*\x1cp < .05)."
          - "Unit separator p < .05 (*\x1fp<\x1f.01)."
          - "Newline p < .05 (*\np < .05)."
          - "Tab p < .05 (*\tp\t<\t.01)."
          - "VT p < .05 (*\vp < .01)."
          - "NEL p < .05 (*\x85p < .01)."
          - "Line sep p < .05 (* p < .01)."
          - "Zero width p < .05 (*​p < .01)."
  "compare": {"ignore": ["paper_id", "table.paper_id", "summary_table.paper_id"]}
- "id": "stat_p_nonsig.unicode_ws"
  "module": "stat_p_nonsig"
  "args":
    "paper":
      "$test_paper":
        "text":
          - "Thin p = .30 here."
          - "NBSP p > .05 here."
          - "Separator p =\x1c.20 and p\x1f= .01."
          - "Sci p = 5.1 x 10^-2 and p = 5.0 x 10^-2."
  "compare": {"ignore": ["paper_id", "table.paper_id", "summary_table.paper_id"]}
# ------------------------------------------------------------------ comparators
- "id": "stat_p_exact.comparators"
  "module": "stat_p_exact"
  "args":
    "paper":
      "$test_paper":
        "text":
          - "Double equals p == .03 here."
          - "Double equals zero p == .000 here."
          - "Reversed p =< .03 here."
          - "Much less p ≪ .001 here."
          - "Much greater p ≫ .5 here."
          - "Tilde zero p ~ .000 here."
          - "Not equal zero p ≠ .000 here."
          - "Less than zero p < 0.0 here."
          - "Underflow p = 1.0e-400 here."
          - "Sci zero p = 0.0 x 10^-3 and p = 0.0e-2."
          - "Big p = 1.5 here."
          - "Boundary p < .001 and p < .0011 here."
          - "Upper P > .999 here."
          - "Weird p < n.s. and p = ns here."
          - "Tiny p < 1.0 x 10^-400 here."
  "compare": {"ignore": ["paper_id", "table.paper_id", "summary_table.paper_id"]}
- "id": "stat_p_nonsig.comparators"
  "module": "stat_p_nonsig"
  "args":
    "paper":
      "$test_paper":
        "text":
          - "Double equals p == .03 here."
          - "Reversed p =< .05 and p <= .05 and p ≤ .05."
          - "Much less p ≪ .01 here."
          - "Just above p < .0500001 here."
          - "Exact p = 0.05, p = .050 and p = 0.0500."
          - "Sci p = 5.00 x 10^-2, p = 5.0*10^-2 and p = .05e-0."
          - "Underflow p < 1.0e-400 here."
          - "Others p ~ .01, p ≈ .01, p ≠ .01, p ≥ .01 and p > .01."
          - "Upper P = .05 and p-value = .07 and pvalue < .05."
          - "Zero p = .000 and p < .000."
          - "Weird p < n.s. here."
  "compare": {"ignore": ["paper_id", "table.paper_id", "summary_table.paper_id"]}
# ----------------------------------------------------------------- star notes
- "id": "stat_p_exact.star_variants"
  "module": "stat_p_exact"
  "args":
    "paper":
      "$test_paper":
        "text":
          - "A p < .05 with *p<.01 note."
          - "B p < .05 with * P < 0.001 note."
          - "C p < .05 with *p < .0005 note."
          - "D p < .05 with *p < .025 note."
          - "E p < .05 with **p<.05 note."
          - "F p < .05 with *p < 00.05 note."
          - "G p < .05 with *p ≤ .05 note."
          - "H p < .05 with *p <.1 note."
          - "I p = .000 with *p < .05 note is still zero."
          - "J p > .05 with * p < .15 note."
          - "K p < .05 with *p = .05 note."
          - "L p < .05 with a trailing star*"
  "compare": {"ignore": ["paper_id", "table.paper_id", "summary_table.paper_id"]}
