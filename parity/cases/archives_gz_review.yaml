- "id": ".zenodo_flat_names.review.three_way"
  "r": ".zenodo_flat_names"
  "py": "pytacheck.archives.zenodo_upload._zenodo_flat_names"
  "args":
    "files":
      "$chr":
      - "p/f.txt"
      - "p/x/f.txt"
      - "p/y/x/f.txt"
    "folder": "p"
- "id": ".zenodo_flat_names.review.dup_input"
  "r": ".zenodo_flat_names"
  "py": "pytacheck.archives.zenodo_upload._zenodo_flat_names"
  "args":
    "files":
      "$chr":
      - "p/a/f.txt"
      - "p/a/f.txt"
      - "p/.hidden"
      - "p/b/.hidden"
      - "p/c/noext"
      - "p/d/noext"
      - "p/d/noext"
    "folder": "p"
- "id": ".zenodo_flat_names.review.trailing_slash"
  "r": ".zenodo_flat_names"
  "py": "pytacheck.archives.zenodo_upload._zenodo_flat_names"
  "args":
    "files":
      "$chr":
      - "p//a.txt"
      - "p/b/a.txt"
      - "p/c.d/e.txt"
    "folder": "p/"
- "id": ".zenodo_flat_names.review.numbered_clash"
  "r": ".zenodo_flat_names"
  "py": "pytacheck.archives.zenodo_upload._zenodo_flat_names"
  "args":
    "files":
      "$chr":
      - "p/a/f.txt"
      - "p/a__f.txt"
      - "p/b/a/f.txt"
    "folder": "p"
