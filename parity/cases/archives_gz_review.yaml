- "id": "zenodo_info.review.mixed"
  "r": "identity"
  "py": "tests.archives_gz.parity_support.run"
  "args":
    "x":
      "$expr":
        "r": "testthat::with_mocked_bindings(metacheck::zenodo_info(c(\"5559001\", \"5559004\", \"5559005\"\
          , \"5559003\", \"https://zenodo.org/records/5559001\", NA)), online = function(...) TRUE, .package\
          \ = \"metacheck\")"
        "py": "lambda: __import__(\"pytacheck.archives.zenodo\", fromlist=[\"_\"]).zenodo_info([\"5559001\"\
          , \"5559004\", \"5559005\", \"5559003\", \"https://zenodo.org/records/5559001\", None])"
  "mock_dir": "tests/archives_gz/mocks_review"
- "id": "zenodo_info.review.table"
