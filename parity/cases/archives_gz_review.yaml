  "py": "tests.archives_gz.parity_support.run"
  "args":
    "x":
      "$expr":
        "r": "testthat::with_mocked_bindings(metacheck::zenodo_info(data.frame(link = c(\"https://zenodo.org/records/5559007\"\
          , \"5559007\", \"zenodo.5559004\", \"none\", \"5559007\"), title = letters[1:5], zenodo_id =\
          \ \"old\"), id_col = \"link\"), online = function(...) TRUE, .package = \"metacheck\")"
        "py": "lambda: __import__(\"pytacheck.archives.zenodo\", fromlist=[\"_\"]).zenodo_info(pd.DataFrame({\"\
          link\": [\"https://zenodo.org/records/5559007\", \"5559007\", \"zenodo.5559004\", \"none\",\
          \ \"5559007\"], \"title\": list(\"abcde\"), \"zenodo_id\": \"old\"}), id_col=\"link\")"
