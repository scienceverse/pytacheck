    "paper": {"$expr": {"r": 'paperlist(test_paper(c("See https://osf.io/abcde/.", "And https://github.com/x/y.")), test_paper("No links."), test_paper("Visit www.example.com today."))', "py": 'pc.PaperList([pc.test_paper(["See https://osf.io/abcde/.", "And https://github.com/x/y."]), pc.test_paper(["No links."]), pc.test_paper(["Visit www.example.com today."])])'}}
  "compare": {"ignore": ["table.paper_id", "summary_table.paper_id"]}
