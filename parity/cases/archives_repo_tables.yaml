- "id": ".invenio_files.formats"
  "r": "identity"
  "py": "tests.archives_d2.parity_support.run"
  "args":
    "x":
      "$expr":
        "r": "metacheck:::.invenio_files(c(list(list(id = \"a\", key = \"x.csv\", size = 10, checksum = \"md5:1\", links = list(self = \"https://zenodo.org/api/records/1/files/x.csv/content\"))), list(list(id = \"b\", key = \"y.R\", size = 20, checksum = \"md5:2\", links = list(self = \"https://h/api/records/2/files/y.R\", content = \"https://h/api/records/2/files/y.R/content\"))), list(list(file_id = \"c\", filename = \"z.txt\", filesize = 30, checksum = \"3\", links = list(download = \"https://h/record/3/files/z.txt\", self = \"https://h/api/files/c\")))))"
        "py": "lambda m: m.zenodo._invenio_files([{\"id\": \"a\", \"key\": \"x.csv\", \"size\": 10, \"checksum\": \"md5:1\", \"links\": {\"self\": \"https://zenodo.org/api/records/1/files/x.csv/content\"}}, {\"id\": \"b\", \"key\": \"y.R\", \"size\": 20, \"checksum\": \"md5:2\", \"links\": {\"self\": \"https://h/api/records/2/files/y.R\", \"content\": \"https://h/api/records/2/files/y.R/content\"}}, {\"file_id\": \"c\", \"filename\": \"z.txt\", \"filesize\": 30, \"checksum\": \"3\", \"links\": {\"download\": \"https://h/record/3/files/z.txt\", \"self\": \"https://h/api/files/c\"}}])"
