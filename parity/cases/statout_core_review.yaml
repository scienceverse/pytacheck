"area": "statout_core_review"
# Adversarial review cases for statout_core (R/r-output.R, R/r-capture.R,
# R/stat-tables.R, R/stat-output.R): branches the first-pass cases missed.
"cases":
# ---------------------------------------------------------------------------
# read_r_output() on a broad corpus of real R printouts
# ---------------------------------------------------------------------------
- "id": "read_r_output.adversarial.code_lines"
  "known_divergence": {"kind": "r_bug_fixed", "ref": "U140", "reason": "a combined df cell keeps its width, so the table's columns split correctly; untitled one-line results take the source label (U139)"}
  "r": "read_r_output"
  "py": "pytacheck.statout.r_output.read_r_output"
  "args":
    "text": &adv_out
      "$call":
        "r": "readLines"
        "py": "tests.statout_core._helpers.read_lines"
        "args": {"con": {"$file": "tests/statout_core/data/review_adversarial.Rout"}}
    "source_label": "review_adversarial.R"
    "code_lines": &adv_code
      "$call":
        "r": "readLines"
        "py": "tests.statout_core._helpers.read_lines"
        "args": {"con": {"$file": "tests/statout_core/data/review_adversarial.R"}}
- "id": "read_r_output.adversarial.no_code_lines"
  "known_divergence": {"kind": "r_bug_fixed", "ref": "U140", "reason": "a combined df cell keeps its width, so the table's columns split correctly (R: one 'df     F  ges' column)"}
  "r": "read_r_output"
  "py": "pytacheck.statout.r_output.read_r_output"
  "args":
    "text": *adv_out
- "id": "read_r_output.adversarial.single_string"
  "known_divergence": {"kind": "r_bug_fixed", "ref": "U140", "reason": "a combined df cell keeps its width, so the table's columns split correctly (R: one 'df     F  ges' column)"}
  "r": "read_r_output"
  "py": "pytacheck.statout.r_output.read_r_output"
  "args":
    "text":
      "$expr":
        "r": "paste(readLines('tests/statout_core/data/review_adversarial.Rout'), collapse = '\\n')"
        "py": "__import__('tests.statout_core._helpers', fromlist=['x']).read_text(__import__('tests.statout_core._helpers', fromlist=['x']).DATA / 'review_adversarial.Rout')"
    "code_lines": *adv_code
