- "id": "stat_table_parse.review_tables"
  "r": "base::identity"
  "py": "tests.statout_core.review_helpers.parse_html_tables"
  "args":
    "x":
      "$expr":
        "r": "lapply(xml2::xml_find_all(xml2::read_html('tests/statout_core/data/review_tables.html'), '//table'), metacheck:::.stat_table_parse)"
        "py": "'tests/statout_core/data/review_tables.html'"
  "py_args": {"path": {"$file": "tests/statout_core/data/review_tables.html"}}
  "py_drop": ["x"]
- "id": "pb_str.nul_bytes"
  "r": "base::identity"
  "py": "copy.copy"
  "args":
    "x":
      "$expr":
        "r": "vapply(list(as.raw(c(97, 0)), as.raw(c(0, 0)), as.raw(c(97, 0, 98)), as.raw(c(97, 98)), raw(0), as.raw(c(0, 97)), as.raw(c(97, 0, 0))), metacheck:::.pb_str, character(1))"
        "py": "[__import__('pytacheck.statout.stat_tables', fromlist=['_'])._pb_str(b) for b in [b'a\\x00', b'\\x00\\x00', b'a\\x00b', b'ab', b'', b'\\x00a', b'a\\x00\\x00']]"
