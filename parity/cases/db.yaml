- "id": "FLoRA_update.data_step"
  "r": "identity"
  "py": "copy.copy"
  "args":
    "x":
      "$expr":
        "r": "local({FLoRA <- suppressMessages(readr::read_csv(file.path(root, \"tests/db/data/flora.csv\"), show_col_types = FALSE)); has_doi_o <- !is.na(FLoRA$doi_o) & FLoRA$doi_o != \"\"; has_doi_r <- !is.na(FLoRA$doi_r) & FLoRA$doi_r != \"\"; has_url_r <- !is.na(FLoRA$url_r) & FLoRA$url_r != \"\"; rows <- has_doi_o & (has_doi_r | has_url_r); cols <- c(\"doi_o\", \"apa_ref_o\", \"doi_r\", \"apa_ref_r\", \"url_r\", \"outcome\", \"outcome_quote\", \"type\"); as.data.frame(dplyr::distinct(FLoRA[rows, cols]))})"
        "py": "__import__('metacheck.db.replications', fromlist=['x']).summarise_flora('tests/db/data/flora.csv')"
