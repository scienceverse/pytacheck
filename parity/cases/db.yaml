    "result":
      "$expr":
        "r": "jsonlite::parse_json(\"{\\\"items\\\": [{\\\"dimension\\\": \\\"Sample size\\\", \\\"deviation_judgement\\\": \\\"yes\\\", \\\"paper_content_summary\\\": \\\"The paper reports 120 participants [PAPER_0001].\\\", \\\"registration_content_summary\\\": \\\"The registration plans 100 participants [REG_0001].\\\", \\\"deviation_information\\\": \\\"The paper sample (120) exceeds the preregistered sample (100).\\\", \\\"paper_content_quotes\\\": \\\"[PAPER_0001] We recruited 120 participants.\\\", \\\"registration_content_quotes\\\": \\\"[REG_0001] We will collect 100 participants.\\\"}, {\\\"dimension\\\": \\\"Hypotheses\\\", \\\"deviation_judgement\\\": \\\"no\\\", \\\"paper_content_summary\\\": \\\"H1: condition A > B.\\\", \\\"registration_content_summary\\\": \\\"H1: condition A > B.\\\", \\\"deviation_information\\\": \\\"The hypotheses are consistent.\\\", \\\"paper_content_quotes\\\": \\\"[PAPER_0002] We predicted A > B.\\\", \\\"registration_content_quotes\\\": \\\"[REG_0002] We predict A > B.\\\"}, {\\\"dimension\\\": \\\"Exclusion criteria\\\", \\\"deviation_judgement\\\": \\\"missing\\\", \\\"paper_content_summary\\\": \\\"Not described.\\\", \\\"registration_content_summary\\\": \\\"Exclude RTs under 200 ms.\\\", \\\"deviation_information\\\": \\\"The paper does not report exclusions, so this cannot be assessed.\\\", \\\"paper_content_quotes\\\": \\\"\\\", \\\"registration_content_quotes\\\": \\\"[REG_0003] We will exclude RTs under 200 ms.\\\"}]}\")"
        "py": "__import__('json').loads('{\"items\": [{\"dimension\": \"Sample size\", \"deviation_judgement\": \"yes\", \"paper_content_summary\": \"The paper reports 120 participants [PAPER_0001].\", \"registration_content_summary\": \"The registration plans 100 participants [REG_0001].\", \"deviation_information\": \"The paper sample (120) exceeds the preregistered sample (100).\", \"paper_content_quotes\": \"[PAPER_0001] We recruited 120 participants.\", \"registration_content_quotes\": \"[REG_0001] We will collect 100 participants.\"}, {\"dimension\": \"Hypotheses\", \"deviation_judgement\": \"no\", \"paper_content_summary\": \"H1: condition A > B.\", \"registration_content_summary\": \"H1: condition A > B.\", \"deviation_information\": \"The hypotheses are consistent.\", \"paper_content_quotes\": \"[PAPER_0002] We predicted A > B.\", \"registration_content_quotes\": \"[REG_0002] We predict A > B.\"}, {\"dimension\": \"Exclusion criteria\", \"deviation_judgement\": \"missing\", \"paper_content_summary\": \"Not described.\", \"registration_content_summary\": \"Exclude RTs under 200 ms.\", \"deviation_information\": \"The paper does not report exclusions, so this cannot be assessed.\", \"paper_content_quotes\": \"\", \"registration_content_quotes\": \"[REG_0003] We will exclude RTs under 200 ms.\"}]}')"
