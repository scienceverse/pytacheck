- "id": "rw_update.data_step"
  "known_divergence": {"kind": "r_bug_fixed", "ref": "U15", "reason": "the RetractionWatch row with a blank DOI is left out (in R it matches every reference without a DOI: 105 false matches for psychsci)"}
