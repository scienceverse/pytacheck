        "py": "(lambda x: {'nrow': len(x), 'names': list(x.columns), 'nchar': [int(x[c].str.len().sum()) for c in x.columns], 'na': [int(x[c].isna().sum()) for c in x.columns], 'head': x.head(25), 'middle': x.iloc[1::997], 'tail': x.tail(25)})(__import__('metacheck.db.replications', fromlist=['x']).FLoRA())"
