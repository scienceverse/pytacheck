- "id": "rbox_file_download.review.hidden_files"
  "r": "identity"
  "py": "tests.archives_d2.parity_support.run"
  "args":
    "x":
      "$expr":
        "r": "(function(f) { d <- tempfile(); dir.create(d); on.exit(unlink(d, recursive = TRUE)); f(d) })(function(d) { p <- file.path(d, \"researchbox.org_801/unzipped/x.csv\"); dir.create(dirname(p), recursive = TRUE, showWarnings = FALSE); writeLines(\"a,b\", p); p <- file.path(d, \"researchbox.org_801/unzipped/.DS_Store\"); dir.create(dirname(p), recursive = TRUE, showWarnings = FALSE); writeLines(\"junk\", p); p <- file.path(d, \"researchbox.org_801/unzipped/__MACOSX/._x.csv\"); dir.create(dirname(p), recursive = TRUE, showWarnings = FALSE); writeLines(\"junk\", p); p <- file.path(d, \"researchbox.org_801/unzipped/.hidden/y.txt\"); dir.create(dirname(p), recursive = TRUE, showWarnings = FALSE); writeLines(\"hidden dir\", p); p <- file.path(d, \"researchbox.org_801/unzipped/sub/.z\"); dir.create(dirname(p), recursive = TRUE, showWarnings = FALSE); writeLines(\"hidden file\", p); p <- file.path(d, \"researchbox.org_801/unzipped/sub/z.txt\"); dir.create(dirname(p), recursive = TRUE, showWarnings = FALSE); writeLines(\"z\", p); old <- options(metacheck.repo_cache.dir = d); on.exit(options(old), add = TRUE); res <- rbox_file_download(\"https://researchbox.org/801\"); res$file_location <- sub(\".*/unzipped/\", \"\", res$file_location); res })"
        "py": "lambda m: m.repo_cache({\"researchbox.org_801/unzipped/x.csv\": \"a,b\", \"researchbox.org_801/unzipped/.DS_Store\": \"junk\", \"researchbox.org_801/unzipped/__MACOSX/._x.csv\": \"junk\", \"researchbox.org_801/unzipped/.hidden/y.txt\": \"hidden dir\", \"researchbox.org_801/unzipped/sub/.z\": \"hidden file\", \"researchbox.org_801/unzipped/sub/z.txt\": \"z\"}, lambda d: (lambda res: res.assign(file_location=[str(v).split(\"/unzipped/\", 1)[-1] for v in res[\"file_location\"]]))(m.researchbox.rbox_file_download(\"https://researchbox.org/801\")))"
  "mock_dir": "tests/archives_d2/mocks_review"
