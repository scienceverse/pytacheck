# schema versions: a later 12.x reads (unknown keys ignored); 11.x, 13.x and non-12 versions stop
- "id": "read.later_12x"
  "r": "read"
  "py": "pytacheck.read"
  "args":
    "file_path": {"$expr": {"r": "local({json <- jsonlite::read_json('upstream/metacheck/tests/testthat/fixtures/bibr12/probe_html.json'); json$schema_version <- '12.1'; json$new_table <- list(list(new_id = 1L)); json$metadata$new_field <- 'new'; json$text[[1]]$new_field <- 'new'; json$extraction$new_block <- list(new_field = 'new'); path <- file.path(tempfile('pc_bibr12_'), 'probe_html.json'); dir.create(dirname(path)); jsonlite::write_json(json, path, auto_unbox = TRUE, null = 'null', digits = NA); path})", "py": "__import__('tests.bibr12._parity_helpers', fromlist=['x']).later_12x('upstream/metacheck/tests/testthat/fixtures/bibr12/probe_html.json')"}}
