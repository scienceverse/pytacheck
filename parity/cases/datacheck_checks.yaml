- "id": "data_check_is_qualtrics.long"
  "r": "data_check_is_qualtrics"
  "py": "pytacheck.datacheck.checks.data_check_is_qualtrics"
  "args":
    "df":
      "$expr":
        "r": "local({\n  meta <- c(\"StartDate\", \"EndDate\", \"Progress\", \"Duration (in seconds)\"\
          ,\n            \"Finished\", \"RecordedDate\", \"ResponseId\")\n  items <- paste0(\"q_\", 1:60)\n\
          \  nm <- c(meta, items)\n  question_row <- c(\"Start Date\", \"End Date\", \"Progress\", \"\
          Duration (in seconds)\",\n                    \"Finished\", \"Recorded Date\", \"Response ID\"\
          ,\n                    paste(\"Question text for item\", 1:60))\n  import_row <- sprintf('{\"\
          ImportId\":\"%s\"}', nm)\n  data_rows <- lapply(seq_along(nm), function(i)\n    if (i <= length(meta))\
          \ rep(\"x\", 3) else as.character((i + 0:2) %% 7 + 1))\n  q <- as.data.frame(rbind(question_row,\
          \ import_row, do.call(cbind, data_rows)),\n                     stringsAsFactors = FALSE)\n\
          \  names(q) <- nm\n  rownames(q) <- NULL\n  q\n})"
        "py": "(lambda meta, items: pd.DataFrame([['Start Date', 'End Date', 'Progress', 'Duration (in\
          \ seconds)', 'Finished', 'Recorded Date', 'Response ID'] + ['Question text for item %d' % i\
          \ for i in range(1, 61)], ['{\"ImportId\":\"%s\"}' % n for n in meta + items]] + [['x'] * 7\
          \ + [str((i + k) % 7 + 1) for i in range(8, 68)] for k in range(3)], columns=meta + items))(['StartDate',\
          \ 'EndDate', 'Progress', 'Duration (in seconds)', 'Finished', 'RecordedDate', 'ResponseId'],\
          \ ['q_%d' % i for i in range(1, 61)])"
