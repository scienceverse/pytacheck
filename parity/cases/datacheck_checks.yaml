          \ * 4,\n      'stroop_rt': [400 + (i * 37) % 500 for i in range(1, 41)], 'stroop_correct': [0.0,\
          \ 1.0, 1.0, 1.0] * 10,\n      'condition': ['congruent', 'incongruent'] * 20, 'block': [1] *\
          \ 20 + [2] * 20,\n      'accuracy_prop': [i / 41 for i in range(1, 41)], 'RT_mean': [*range(1,\
          \ 6)] * 8})"
