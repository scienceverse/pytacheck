- "id": ".detect_accuracy_blocks.raven"
  "r": ".detect_accuracy_blocks"
  "py": "tests.datacheck_checks.parity_helpers.detect_accuracy_blocks"
  "args":
    "df":
      "$expr":
        "r": "local({\n      d <- data.frame(id = 1:12)\n      for (i in 1:10) d[[paste0(\"raven_\", i)]]\
          \ <- as.numeric(((1:12) + i) %% 3 > 0)\n      d$score <- (1:12) * 2.5\n      for (i in 1:3)\
          \ d[[paste0(\"iat_\", i)]] <- as.numeric(((1:12) * i) %% 2)\n      d\n    })"
        "py": "(lambda: pd.DataFrame({'id': list(range(1, 13)),\n      **{f'raven_{i}': [float((r + i)\
          \ % 3 > 0) for r in range(1, 13)] for i in range(1, 11)},\n      'score': [r * 2.5 for r in\
          \ range(1, 13)],\n      **{f'iat_{i}': [float((r * i) % 2) for r in range(1, 13)] for i in range(1,\
          \ 4)}}))()"
