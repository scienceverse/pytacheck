# Parity cases for the ref_accuracy and ref_consistency modules.
# Edited demo papers come from tests/mod_ref_accuracy/edits.R (R) and
# tests/mod_ref_accuracy/edits.py (Python); report_tables cases compare the
# data behind each report table (the prose comparison skips table widgets).
"area": "mod_ref_accuracy"
"cases":
- "id": "ref_accuracy.demo"
  "module": "ref_accuracy"
  "args":
    "paper":
      "$paper": "demo"
- "id": "ref_accuracy.psychsci"
  "module": "ref_accuracy"
  "args":
    "paper":
      "$read":
      - "upstream/metacheck/tests/testthat/fixtures/psychsci/0956797613520608.json"
      - "upstream/metacheck/tests/testthat/fixtures/psychsci/0956797614522816.json"
      - "upstream/metacheck/tests/testthat/fixtures/psychsci/0956797614527830.json"
      - "upstream/metacheck/inst/demos/to_err_is_human.json"
- "id": "ref_accuracy.no_refs.test_paper"
  "module": "ref_accuracy"
  "args":
    "paper":
      "$expr":
        "r": "source(file.path(root, \"tests/mod_ref_accuracy/edits.R\")); ra_test_paper(\"No references here.\")"
        "py": "__import__(\"tests.mod_ref_accuracy.edits\", fromlist=[\"x\"]).ra_test_paper(\"No references here.\")"
