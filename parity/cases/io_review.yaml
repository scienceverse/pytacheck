# as.character() of nodes with inherited / own / redeclared prefixes
- "id": "as_character.ns_nodes"
  "r": "as.character"
  "py": "pytacheck.io.xml.as_character"
  "args":
    "x": {"$expr": {"r": "xml2::xml_find_all(xml2::read_xml('<r xmlns:xlink=\"urn:x\" xmlns:a=\"urn:a\"><p xmlns:b=\"urn:b\">x <ptr xlink:href=\"h\"/> <b:q>y</b:q> <a:z a:k=\"1\">w</a:z></p><p xmlns:c=\"urn:c\">none</p><p>plain <m xmlns=\"urn:m\"><i>q</i></m></p><p><a:z xmlns:a=\"urn:other\">shadow</a:z></p></r>'), '//p')", "py": "__import__('pytacheck.io.xml', fromlist=['x']).xml_find_all(__import__('pytacheck.io.xml', fromlist=['x']).read_xml('<r xmlns:xlink=\"urn:x\" xmlns:a=\"urn:a\"><p xmlns:b=\"urn:b\">x <ptr xlink:href=\"h\"/> <b:q>y</b:q> <a:z a:k=\"1\">w</a:z></p><p xmlns:c=\"urn:c\">none</p><p>plain <m xmlns=\"urn:m\"><i>q</i></m></p><p><a:z xmlns:a=\"urn:other\">shadow</a:z></p></r>'), '//p')"}}
