          "save_path": {"$expr": {"r": "file.path(tempdir(), 'pc_io_review_convert')", "py": "__import__('os').path.join(__import__('tempfile').mkdtemp(), 'pc_io_review_convert')"}}
          "method": "gro"
          "api_url": "https://grobid.hti.ieis.tue.nl"
# the JSON is named after R's random tempfile() name: normalised to TMP.json
- "id": "convert.grobid.no_keep_xml"
  "r": "sub"
  "py": "pytacheck._r.regex.sub"
  "mock_dir": "apis"
  "args":
    "pattern": "^file[0-9a-f]+\\.json$"
    "replacement": "TMP.json"
    "x":
      "$call":
        "r": "basename"
        "py": "tests.io._parity_helpers.basename"
        "args":
          "path":
            "$call":
              "r": "convert"
              "py": "pytacheck.io.convert.convert"
              "args":
                "file_path": {"$file": "upstream/metacheck/inst/demos/to_err_is_human.pdf"}
                "save_path": {"$expr": {"r": "file.path(tempdir(), 'pc_io_review_convert2')", "py": "__import__('os').path.join(__import__('tempfile').mkdtemp(), 'pc_io_review_convert2')"}}
                "method": "grobid"
                "keep_xml": false
                "api_url": "https://grobid.hti.ieis.tue.nl"
