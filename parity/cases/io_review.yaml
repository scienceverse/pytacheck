# .grobid_to_bibr(): branches found by the differential review --------------------
# `contents[[i]] <- NULL` drops element i; a length-1 list is recycled by the tibble
- "id": ".grobid_to_bibr.tables_empty_second"
  "known_divergence": {"kind": "r_bug_fixed", "ref": "U17", "reason": "the second table has no contents (R's contents[[2]] <- NULL recycles the first table's contents into both)"}
  "r": ".grobid_to_bibr"
  "py": "pytacheck.io.grobid._grobid_to_bibr"
  "args":
    "xml_path": {"$file": "tests/io/fixtures/tables_empty_second.tei.xml"}
- "id": ".grobid_to_bibr.tables_empty_first"
  "known_divergence": {"kind": "r_bug_fixed", "ref": "U16", "reason": "the number before the tag ending a reference keeps its space ('Ref one. 2020.', R: 'Ref one.2020.'); the table without rows has no contents in both"}
  "r": ".grobid_to_bibr"
  "py": "pytacheck.io.grobid._grobid_to_bibr"
  "args":
    "xml_path": {"$file": "tests/io/fixtures/tables_empty_first.tei.xml"}
- "id": ".grobid_to_bibr.tables_three_one_empty"
  "known_divergence": {"kind": "r_bug_fixed", "ref": "U17", "reason": "a table without rows has no contents (R fails the paper: 'Can't recycle input of size 2 to size 3')"}
  "r": ".grobid_to_bibr"
  "py": "pytacheck.io.grobid._grobid_to_bibr"
  "args":
    "xml_path": {"$file": "tests/io/fixtures/tables_three_one_empty.tei.xml"}
# no text rows + references: sapply() over zero headers gives list(), bind_rows() fails
- "id": ".grobid_to_bibr.refs_no_text"
