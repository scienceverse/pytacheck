# XML utilities: xml2 registers the document's namespaces for XPath ---------------
- "id": ".xml_find_text.ns_prefix"
  "r": ".xml_find_text"
  "py": "pytacheck.io.xml._xml_find_text"
  "args":
    "xml": {"$expr": {"r": "xml2::read_xml('<r xmlns=\"urn:d\" xmlns:a=\"urn:a\"><a:p>one</a:p><q xmlns:a=\"urn:a2\"><a:p>two</a:p></q><s xmlns=\"urn:e\"> three  four </s></r>')", "py": "__import__('pytacheck.io.xml', fromlist=['x']).read_xml('<r xmlns=\"urn:d\" xmlns:a=\"urn:a\"><a:p>one</a:p><q xmlns:a=\"urn:a2\"><a:p>two</a:p></q><s xmlns=\"urn:e\"> three  four </s></r>')"}}
    "xpath": "//a:p"
- "id": ".xml_find_text.ns_duplicate_prefix"
  "r": ".xml_find_text"
  "py": "pytacheck.io.xml._xml_find_text"
  "args":
    "xml": {"$expr": {"r": "xml2::read_xml('<r xmlns=\"urn:d\" xmlns:a=\"urn:a\"><a:p>one</a:p><q xmlns:a=\"urn:a2\"><a:p>two</a:p></q><s xmlns=\"urn:e\"> three  four </s></r>')", "py": "__import__('pytacheck.io.xml', fromlist=['x']).read_xml('<r xmlns=\"urn:d\" xmlns:a=\"urn:a\"><a:p>one</a:p><q xmlns:a=\"urn:a2\"><a:p>two</a:p></q><s xmlns=\"urn:e\"> three  four </s></r>')"}}
    "xpath": "//a1:p"
- "id": ".xml_find_text.ns_default_d2"
  "r": ".xml_find_text"
  "py": "pytacheck.io.xml._xml_find_text"
  "args":
    "xml": {"$expr": {"r": "xml2::read_xml('<r xmlns=\"urn:d\" xmlns:a=\"urn:a\"><a:p>one</a:p><q xmlns:a=\"urn:a2\"><a:p>two</a:p></q><s xmlns=\"urn:e\"> three  four </s></r>')", "py": "__import__('pytacheck.io.xml', fromlist=['x']).read_xml('<r xmlns=\"urn:d\" xmlns:a=\"urn:a\"><a:p>one</a:p><q xmlns:a=\"urn:a2\"><a:p>two</a:p></q><s xmlns=\"urn:e\"> three  four </s></r>')"}}
    "xpath": "//d1:q | //d2:s"
    "join": "; "
- "id": ".xml_find_text.undefined_prefix"
  "r": ".xml_find_text"
  "py": "pytacheck.io.xml._xml_find_text"
  "args":
    "xml": {"$expr": {"r": "xml2::read_xml('<r xmlns:a=\"urn:a\"><a:p>one</a:p></r>')", "py": "__import__('pytacheck.io.xml', fromlist=['x']).read_xml('<r xmlns:a=\"urn:a\"><a:p>one</a:p></r>')"}}
    "xpath": "//zz:p"
- "id": ".xml_find_text.invalid_xpath"
  "r": ".xml_find_text"
  "py": "pytacheck.io.xml._xml_find_text"
  "args":
    "xml": {"$expr": {"r": "xml2::read_xml('<r><p>one</p></r>')", "py": "__import__('pytacheck.io.xml', fromlist=['x']).read_xml('<r><p>one</p></r>')"}}
    "xpath": "//p["
- "id": ".xml_find_text.string_literal_colon"
  "r": ".xml_find_text"
  "py": "pytacheck.io.xml._xml_find_text"
  "args":
    "xml": {"$expr": {"r": "xml2::read_xml('<r xmlns:a=\"urn:a\"><p t=\"a:b\">one</p><p t=\"x\">two</p></r>')", "py": "__import__('pytacheck.io.xml', fromlist=['x']).read_xml('<r xmlns:a=\"urn:a\"><p t=\"a:b\">one</p><p t=\"x\">two</p></r>')"}}
    "xpath": "//p[@t='a:b']"
