  "args":
    "xml": {"$expr": {"r": "xml2::read_xml('<r xmlns=\"urn:d\" xmlns:a=\"urn:a\"><a:p>one</a:p><q xmlns:a=\"urn:a2\"><a:p>two</a:p></q><s xmlns=\"urn:e\"> three  four </s></r>')", "py": "__import__('pytacheck.io.xml', fromlist=['x']).read_xml('<r xmlns=\"urn:d\" xmlns:a=\"urn:a\"><a:p>one</a:p><q xmlns:a=\"urn:a2\"><a:p>two</a:p></q><s xmlns=\"urn:e\"> three  four </s></r>')"}}
