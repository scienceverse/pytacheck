  "args":
    "paper":
      "$df":
        "text": ["t = 2.1"]
- "id": "extract_eq.df.no_paper_id_error"
  "known_divergence": {"kind": "r_bug_fixed", "ref": "U10", "reason": "a table without paper_id works (R fails on NA comparisons once there are two equations)"}
  "r": "extract_eq"
  "py": "metacheck.text.extract.extract_eq"
  "args":
    "paper":
      "$df":
        "text": ["t = 2.1, p = .04"]
- "id": "extract_eq.bad_arg"
  "r": "extract_eq"
  "py": "metacheck.text.extract.extract_eq"
  "args":
    "paper": 1
- "id": "extract_eq.chr"
  "known_divergence": {"kind": "r_bug_fixed", "ref": "U150", "reason": "extract_eq() of strings returns their equations (R: a bind_rows() error)"}
  "r": "extract_eq"
  "py": "metacheck.text.extract.extract_eq"
  "args":
    "paper": {"$chr": ["t = 2, p = .05"]}
