- "id": "json_expand.error.zero_rows"
  "known_divergence": {"kind": "r_bug_fixed", "ref": "U151", "reason": "a table without rows is returned unchanged (R: 'Join columns in `y` must be present in the data')"}
  "r": "json_expand"
  "py": "metacheck.text.json_expand.json_expand"
  "args":
    "table":
      "$expr":
        "r": "data.frame(id = integer(0), answer = character(0))"
        "py": "pd.DataFrame({'id': pd.Series([], dtype='Int64'), 'answer': pd.Series([], dtype='string')})"
- "id": "json_expand.temp_id_key"
  "known_divergence": {"kind": "r_bug_fixed", "ref": "U151", "reason": "a \".temp_id.\" key is kept as a column (R overwrites it with its internal join key)"}
  "r": "json_expand"
  "py": "metacheck.text.json_expand.json_expand"
  "args":
    "table":
      "$df":
        "id": [1, 2]
        "answer": ['{".temp_id.": 99, "a": 1}', '[{".temp_id.": 5, "a": 2}, {"a": 3}]']
