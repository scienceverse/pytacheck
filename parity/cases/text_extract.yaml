- "id": "extract_eq.test_paper.tricky"
  "known_divergence": {"kind": "r_bug_fixed", "ref": "U205", "reason": "'r(98) = −.32' (Unicode minus) is a statistic, its rhs '-.32'; metacheck matches only the ASCII hyphen"}
  "r": "extract_eq"
  "py": "metacheck.text.extract.extract_eq"
  "args":
    "paper":
      "$test_paper":
        "text":
        - "p < .05 was the threshold."
        - "t(28) = 2.4, p = .02, d = 0.45"
        - "Then p < .01, t = 3 and F(2, 57) = 4.21, p = .019, ηp² = .13."
        - "χ2(1, N = 200) = 5.3, p = .021 and chi2 (2, n=50) = 1.1"
        - "significant (β = 0.74, t(260) = 11.32)"
        - "r(98) = −.32 and r(98) = -.32"
        - "95% CI [0.1, 0.5] versus 95% CI = [0.12, 0.54] and OR = 1.5, 95% CI [1.2, 1.9]"
        - "Cronbach's α = .85, Hedges' g = 0.3 and Cohen’s d = 0.8"
        - "N = 120 participants (age = 21.3 years), range = 18-29"
        - "BF10 = 3.2 x 10^4, p = 2.3e-5 and p < 5 x 10^-8"
        - "x^2 = 3, a_{ij} = 4, 3 = 3 and \\beta = 2"
        - "M = 3.4, SD = 1.2; M = 4.5, SD = 1.1, p = n.s."
        - "a = b and x ≈ y"
        - "p=.05<.1 and z ≤ 1.96 and w ≥ 0.5 and q ≪ 0.1"
        - "t(1,2,3) = 5 and F(1, 2) (3) = 4"
  "compare": {"ignore": ["paper_id"]}
- "id": "extract_eq.psychsci"
  "known_divergence": {"kind": "r_bug_fixed", "ref": "U10", "reason": "each sentence of a paper in a list keeps its own grp_id, the one it has when the paper is searched alone (R restarts at 1 whenever its search order moves to another paper, so different sentences of a paper share grp_id 1 or 2)"}
  "r": "extract_eq"
  "py": "metacheck.text.extract.extract_eq"
  "args":
    "paper": *psychsci
- "id": "extract_eq.df.one_row_no_paper_id"
