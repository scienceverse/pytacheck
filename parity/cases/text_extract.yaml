        - '{"lgl": "F", "int": " 2", "dbl": "2.5", "chr": "x", "blank": "", "mix": "1", "na": null, "ws": "3"}'
        - '{"lgl": null, "int": "", "dbl": "1e5", "chr": "", "blank": null, "mix": "", "na": "NA", "ws": ""}'
- "id": "json_expand.na_input"
  "r": "json_expand"
  "py": "metacheck.text.json_expand.json_expand"
  "args":
    "table":
      "$expr":
        "r": "data.frame(id = 1:3, answer = c(NA, '{\"a\":1}', '{\"a\":\"NA\"}'))"
        "py": "pd.DataFrame({'id': pd.Series([1, 2, 3], dtype='Int64'), 'answer': pd.Series([None, '{\"a\":1}', '{\"a\":\"NA\"}'], dtype='string')})"
