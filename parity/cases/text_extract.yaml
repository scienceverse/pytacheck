- "id": "extract_tests.test_paper.splits"
  "r": "extract_tests"
  "py": "metacheck.text.extract_tests.extract_tests"
  "args":
    "paper":
      "$test_paper":
        "text":
        - "Both effects held, t(23) = 3.77, p = .001, d = 0.77, t(23) = 2.69, p = .013, d = 0.55."
        - "The interaction was significant, F(2, 560) = 41.86, p < .001, ηp² = .13, 95% CI = [.08, .18]."
        - "The scale (M = 3.28, 95% CI = [3.18, 3.38], Cronbach's α = .86) was reliable."
        - "Figures were 4 inches (height = 4, width = 3) and ages ranged (range = 18-29)."
        - "Group A (M = 1.93, SD = 0.76, W = 183.5, p = .791) did not differ."
        - "Mantel-Cox χ2(1, N = 60) = 6.99, p = .008."
        - "A correlation, r(58) = .32, p = .01, and a regression, β = 0.74, t(260) = 11.32, p < .001."
        - "Other tests: z = 2.1, p = .04; U = 12, p = .03; BF10 = 3.2."
        - "Only descriptives: SD = 1.2, n = 40."
        - "Cohen's d = 0.29 on its own, and Hedges' g = .31 as well."
        - "No statistics in this sentence."
        - "d = .5, d = .6 and F(1, 20) = 5, F(1, 20) = 6, p = .03, p = .04"
  "compare": {"ignore": ["paper_id"]}
