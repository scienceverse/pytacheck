# ----------------------------------------------------------------- json_expand
- "id": "json_expand.basic"
  "r": "json_expand"
  "py": "metacheck.text.json_expand.json_expand"
  "args":
    "table":
      "$df":
        "paper_id": [1, 2, 3, 4, 5]
        "answer":
        - '{"number": 1, "letter": "A", "bool": true}'
        - '{"number": 2, "letter": "B", "bool": "FALSE"}'
        - '{"number": 3, "letter": "", "bool": null}'
        - "oh no, the LLM misunderstood"
        - '{"number": 5, "letter": ["E", "F"], "bool": false}'
# a complex column (encoded as R's as.character() of each value)
- "id": "json_expand.complex"
  "r": "json_expand"
  "py": "metacheck.text.json_expand.json_expand"
  "args":
    "table":
      "$df":
        "id": [1, 2, 3, 4, 5]
        "answer":
        - '{"z": "1+2i", "r": "00"}'
        - '{"z": "-0.5-3i", "r": "ff"}'
        - '{"z": "NA", "r": "1e"}'
        - '{"z": "1e-3+0.1i", "r": "0a"}'
        - '{"z": "0.33333333333333331+1e20i", "r": "7f"}'
- "id": "json_expand.vector"
  "r": "json_expand"
  "py": "metacheck.text.json_expand.json_expand"
  "args":
    "table":
      "$chr":
      - '{"number": 1, "letter": "A", "bool": true}'
      - '{"number": 2, "letter": "B", "bool": "FALSE"}'
      - "oh no"
- "id": "json_expand.nulls"
  "r": "json_expand"
  "py": "metacheck.text.json_expand.json_expand"
  "args":
    "table":
      "$df":
        "id": [1, 2, 3, 4, 5, 6, 7, 8, 9]
        "answer":
        - '{"number": 1, "letter": "A", "bool": true}'
        - "{null}"
        - "[]"
        - "[{}]"
        - "{}"
        - "null"
        - '""'
        - '"Hi"'
        - ""
- "id": "json_expand.conflict"
  "r": "json_expand"
  "py": "metacheck.text.json_expand.json_expand"
  "args":
    "table":
      "$df":
        "id": [1, 2, 3, 4, 5]
        "number": [1, 2, 3, 4, 5]
        "answer":
        - '{"number": 1, "letter": "A", "bool": true}'
        - '{"number": 2, "letter": "B", "bool": "FALSE"}'
        - '{"number": 3, "letter": "", "bool": null}'
        - "oh no, the LLM misunderstood"
        - '{"number": 5, "letter": ["E", "F"], "bool": false}'
- "id": "json_expand.conflict.suffix"
  "r": "json_expand"
  "py": "metacheck.text.json_expand.json_expand"
  "args":
    "table":
      "$df":
        "id": [1, 2]
        "number": [1, 2]
        "number.json": [3, 4]
        "answer":
        - '{"number": 1, "id": "x", "number.json": 7}'
        - '{"number": 2}'
    "suffix": {"$chr": ["_orig", "_x"]}
- "id": "json_expand.conflict.suffix_default_chain"
  "r": "json_expand"
  "py": "metacheck.text.json_expand.json_expand"
  "args":
    "table":
      "$df":
        "id": [1, 2]
        "number": [1, 2]
        "number.json": [3, 4]
        "answer":
        - '{"number": 1, "id": "x", "error": "llm error"}'
        - '{"number": 2}'
- "id": "json_expand.multiline"
  "r": "json_expand"
  "py": "metacheck.text.json_expand.json_expand"
  "args":
    "table":
      "$df":
        "id": [1, 2, 3]
        "answer":
        - "[\n        {\"number\": 1, \"letter\": \"A\", \"bool\": true},\n        {\"number\": 2, \"letter\": \"B\", \"bool\": null}\n      ]"
        - '[{"number": 3, "letter": "C", "bool": false}]'
        - "[]"
- "id": "json_expand.fenced"
  "r": "json_expand"
  "py": "metacheck.text.json_expand.json_expand"
  "args":
    "table":
      "$df":
        "id": [1, 2, 3, 4]
        "answer":
        - "```json\n      [\n        {\"number\": 1, \"letter\": \"A\", \"bool\": true},\n        {\"number\": 2, \"letter\": \"B\", \"bool\": null}\n      ]\n      ```"
        - "Some gibber\n      ```json\n      [{\"number\": 3, \"letter\": \"C\", \"bool\": false}]\n      ```\n      more gibber"
        - "```json\n      ```"
        - "```json\n{\"number\": \"null\", \"letter\": \"D\"}\n```\n```json\n{\"number\": 9}\n```"
