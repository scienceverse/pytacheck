  "r": "identity"
  "py": "copy.copy"
  "args":
    "x":
      "$expr":
        "r": "{x <- c(\"\", \"   Observed   Variable   Estimate\", \"   Y   0.5  0.1\", \"\", \"Within Level\", \"   X   1.5  0.2\", \"   Observed\", \"  Expected    Observed  Percentile\", \"  0.1   0.2   0.3\", \"  Estimate   S.E.\", \"  Two-Tailed P-Value\", \"Group G1\", \"  a  1  2\", \"\", \"\", \"  b  3  4\", NA); list(stat = vapply(x, metacheck:::.mplus_is_stat_header_line, TRUE, USE.NAMES = FALSE), looks = vapply(x, metacheck:::.mplus_looks_header, TRUE, USE.NAMES = FALSE), level = vapply(x, metacheck:::.mplus_is_level_label, TRUE, USE.NAMES = FALSE), group = vapply(x, metacheck:::.mplus_is_group_label, TRUE, USE.NAMES = FALSE), stats = vapply(x, metacheck:::.mplus_is_stats_header_line, TRUE, USE.NAMES = FALSE), section = vapply(x, metacheck:::.mplus_is_section_header, TRUE, USE.NAMES = FALSE), numlike = metacheck:::.mplus_is_numlike(x))}"
        "py": "(lambda x: {\"stat\": [pc.statout.mplus._mplus_is_stat_header_line(v) for v in x], \"looks\": [pc.statout.mplus._mplus_looks_header(v) for v in x], \"level\": [pc.statout.mplus._mplus_is_level_label(v) for v in x], \"group\": [pc.statout.mplus._mplus_is_group_label(v) for v in x], \"stats\": [pc.statout.mplus._mplus_is_stats_header_line(v) for v in x], \"section\": [pc.statout.mplus._mplus_is_section_header(v) for v in x], \"numlike\": pc.statout.mplus._mplus_is_numlike(x)})([\"\", \"   Observed   Variable   Estimate\", \"   Y   0.5  0.1\", \"\", \"Within Level\", \"   X   1.5  0.2\", \"   Observed\", \"  Expected    Observed  Percentile\", \"  0.1   0.2   0.3\", \"  Estimate   S.E.\", \"  Two-Tailed P-Value\", \"Group G1\", \"  a  1  2\", \"\", \"\", \"  b  3  4\", None])"
