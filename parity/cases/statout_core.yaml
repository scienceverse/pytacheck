- "id": "read_r_output.analysis.code_lines"
  "r": "read_r_output"
  "py": "pytacheck.statout.r_output.read_r_output"
  "args":
    "text": &analysis_out
      "$call":
        "r": "readLines"
        "py": "tests.statout_core._helpers.read_lines"
        "args": {"con": {"$file": "tests/statout_core/data/analysis.Rout"}}
    "source_label": "analysis.R"
    "code_lines": &analysis_code
      "$call":
        "r": "readLines"
        "py": "tests.statout_core._helpers.read_lines"
        "args": {"con": {"$file": "tests/statout_core/data/analysis.R"}}
- "id": "read_r_output.analysis.no_code_lines"
  "r": "read_r_output"
  "py": "pytacheck.statout.r_output.read_r_output"
  "args":
    "text": *analysis_out
- "id": "read_r_output.analysis.single_string"
  "r": "read_r_output"
  "py": "pytacheck.statout.r_output.read_r_output"
  "args":
    "text":
      "$expr":
        "r": "paste(readLines('tests/statout_core/data/analysis.Rout'), collapse = '\\n')"
        "py": "__import__('tests.statout_core._helpers', fromlist=['x']).read_text(__import__('tests.statout_core._helpers', fromlist=['x']).DATA / 'analysis.Rout')"
    "code_lines": *analysis_code
