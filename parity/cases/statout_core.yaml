- "id": "read_r_output.oneline.title_groups"
  "r": "read_r_output"
  "py": "pytacheck.statout.r_output.read_r_output"
  "args":
    "text":
      "$chr":
      - "z = 1.96, p = 0.05"
      - "\tShapiro-Wilk normality test"
      - "W = 0.94756, p-value = 0.1229"
      - "\tKruskal-Wallis rank sum test"
      - "Kruskal-Wallis chi-squared = 25.746, df = 2, p-value = 2.566e-06"
      - "F(2, 27) = 4.50, p < .05, t = 2, t = 3"
      - "  Pearson's Chi-squared test with Yates' continuity correction"
      - "X-squared (1) = 1.3, p-value < 2.2e-16"
      - "total = 5, hello = 3, rho = 0.5, tau ~ 0.2"
- "id": "read_r_output.no_match"
  "r": "read_r_output"
  "py": "pytacheck.statout.r_output.read_r_output"
