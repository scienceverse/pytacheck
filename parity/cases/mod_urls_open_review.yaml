- "id": "all_urls.review.empty_list"
  "module": "all_urls"
  "args":
    "paper":
      "$expr":
        "r": "paperlist(list())"
        "py": "pc.PaperList([])"
  "known_divergence": "R bug: on an empty paper list text_search() adds the missing paper_id column as logical NA, so count() gives a logical paper_id and module_run()'s left_join() with the character paper_id of summary_table fails (Can't join x$paper_id with y$paper_id due to incompatible types). pytacheck returns the empty result instead of crashing."
