        - "Values 1.2.3.4 and 999.999.999.999 and 10.1234/abc."
        - "Visit www.site.co.uk/path?x=1&y=2#frag today."
        - "Links (https://osf.io/x), <https://a.bc/d> and [doi:10.5555/xyz.abc]."
        - "The file data.csv and script analysis.R and fig.png were used."
        - "Caf\xE9.com and na\xEFve.org/x and \xFCber.de are sites."
        - "Mail me at someone@example.com or ftp://files.example.net/pub."
        - "Trailing dots https://osf.io/abc... and commas https://osf.io/d,e,f."
        - "A URL with spaces https://osf. io/abc and a tab https://github.com/\tx."
        - "No links, only numbers like 3.14 and 2.5e10."
  "compare":
    "ignore":
    - "table.paper_id"
    - "summary_table.paper_id"
