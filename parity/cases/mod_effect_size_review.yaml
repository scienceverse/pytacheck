  "module": "stat_effect_size"
  "args":
    "paper":
      "$expr":
        "r": "paperlist(test_paper(\"No digits here, t = n.s.\"), test_paper(\"A was bigger, t(20) = 2.1, d = 0.94.\"), test_paper(c(\"Nothing.\", \"B was smaller, t(30) = 2.5, p = .02.\")))"
        "py": "pc.PaperList([pc.test_paper(\"No digits here, t = n.s.\"), pc.test_paper(\"A was bigger, t(20) = 2.1, d = 0.94.\"), pc.test_paper([\"Nothing.\", \"B was smaller, t(30) = 2.5, p = .02.\"])])"
