"area": "mod_effect_size_review"
# Adversarial review cases for inst/modules/stat_effect_size.R (see mod_effect_size.yaml
# for the main cases). test_paper() ids are random, so paper_id is ignored.
"cases":
# ---------------------------------------------------------------- huge df
# as.integer(round(df + 2)) is NA beyond .Machine$integer.max: `2:(NA - 2)` errors
- "id": "stat_effect_size.review.df_int_max"
  "module": "stat_effect_size"
  "args":
    "paper": {"$test_paper": {"text": ["Huge, t(2147483646) = 2.0, d = 0.5."]}}
- "id": "stat_effect_size.review.df_huge"
  "known_divergence": {"kind": "r_bug_fixed", "ref": "U125", "reason": "The missing-effect-size summary ends with a full stop (metacheck: '... consider adding effect sizes' without one).", "r_text": [["consider adding effect sizes$", "consider adding effect sizes.", "regex"]]}
  "module": "stat_effect_size"
  "args":
    "paper": {"$test_paper": {"text": ["Huge, t(9999999999) = 2.0, p = .04."]}}
  "compare": {"ignore": ["paper_id", "table.paper_id", "summary_table.paper_id"]}
# the largest df whose unequal-n grid R still builds without error (just below the limit
# is too big to allocate on either side, so stay at a few million)
- "id": "stat_effect_size.review.large_df_format"
  "module": "stat_effect_size"
  "args":
    "paper":
      "$test_paper":
        "text":
        - "Equal n, format(N) = 1e+05, t(99998) = 10, d = 0.063."
        - "Equal n, format(n) = 5e+05, t(999998) = 20, d = 0.04."
        - "Equal n, half n, t(1999999) = 20, d = 0.0283."
        - "Paired, as.character(df) = 1e+05, t(100000) = 2, d = 0.0063."
        - "Unequal, t(3999998) = 20, d = 0.03."
        - "No match, t(123456) = 2, d = 0.5."
  "compare": {"ignore": ["paper_id", "table.paper_id", "summary_table.paper_id"]}
# ---------------------------------------------------------------- infinite values
- "id": "stat_effect_size.review.inf_values"
  "known_divergence": {"kind": "r_bug_fixed", "ref": "U125", "reason": "The missing-effect-size summary ends with a full stop (metacheck: '... consider adding effect sizes' without one).", "r_text": [["consider adding effect sizes$", "consider adding effect sizes.", "regex"]]}
  "module": "stat_effect_size"
  "args":
    "paper":
      "$test_paper":
        "text":
        - "Inf t, t(40) = , d = 0.5."
        - "Inf d, t(40) = 2.9, d = ."
        - "Inf F, F(1, 20) = , p < .001."
  "compare": {"ignore": ["paper_id", "table.paper_id", "summary_table.paper_id"]}
# |Inf - Inf| is NaN: any(NA) inside if() errors
- "id": "stat_effect_size.review.inf_t_and_d"
  "known_divergence": {"kind": "r_bug_fixed", "ref": "U126", "reason": "An infinite t and d (Inf - Inf) give no match instead of stopping the module on if (NA)."}
  "module": "stat_effect_size"
  "args":
    "paper":
      "$test_paper":
        "text":
        - "Both, t(40) = , d = ."
- "id": "stat_effect_size.review.inf_df"
  "module": "stat_effect_size"
  "args":
    "paper":
      "$test_paper":
        "text":
        - "Inf df, t() = 2.0, d = 0.5."
# ---------------------------------------------------------------- sentences without digits
# text_search("[0-9]") misses the sentence: text/section_id/paragraph_id are NA
- "id": "stat_effect_size.review.no_digits"
  "known_divergence": {"kind": "r_bug_fixed", "ref": "U125", "reason": "The missing-effect-size summary ends with a full stop (metacheck: '... consider adding effect sizes' without one).", "r_text": [["consider adding effect sizes$", "consider adding effect sizes.", "regex"]]}
  "module": "stat_effect_size"
  "args":
    "paper": {"$test_paper": {"text": ["The effect was not significant, t = n.s.", "Other sentence without numbers.", "Bracket, t = [low, high], d = [a, b]."]}}
  "compare": {"ignore": ["paper_id", "table.paper_id", "summary_table.paper_id"]}
# a paper whose only test is in a digit-less sentence is not in the paper order: last
- "id": "stat_effect_size.review.no_digits_paperlist"
