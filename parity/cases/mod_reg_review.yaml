  "args":
    "x":
      "$expr":
        "r": "(function() { .r <- httptest2::get_current_redactor(); httptest2::set_redactor(function(req) { req$url <- gsub(\"[?&]page(%5[Bb]size%5[Dd]|\\\\[size\\\\])=100\", \"\", req$url); req }); on.exit(httptest2::set_redactor(.r)); withr::local_envvar(c(TESTTHAT = \"true\", REGCHECK_API_TOKEN = \"\", REGCHECK_BASE_URL = \"\")); tp <- function(url, id, text = LETTERS) { p <- test_paper(text, url); p$paper_id <- id; p }; .calls <- 0; .tbl <- data.frame(dimension = c(\"Sample size\", \"Hypotheses\", \"Exclusion criteria\"), deviation_judgement = c(\"yes\", \"no\", \"missing\"), paper_summary = c(\"120 participants\", \"H1: A > B\", \"not described\"), prereg_summary = c(\"100 participants\", \"H1: A > B\", \"exclude RT < 200 ms\"), deviation_information = c(\"Paper sample (120) exceeds preregistered sample (100).\", \"Consistent.\", \"Cannot be assessed from the paper.\"), paper_quotes = c(\"[PAPER_0001] quote\", \"[PAPER_0001] quote\", \"[PAPER_0001] quote\"), prereg_quotes = c(\"[REG_0001] quote\", \"[REG_0001] quote\", \"[REG_0001] quote\")); .odd <- data.frame(dimension = c(\"Sample size\", \"Hypotheses\", \"Exclusion criteria\", \"Other\"), deviation_judgement = c(\" YES \", NA_character_, \"Partially\", \"missing\"), paper_summary = c(\"120 [PAPER_0001]\", NA_character_, \"x [PAPER_0001, REG_0002]\", \"y\\nz\"), prereg_summary = c(\"p\", \"p\", \"p\", \"p\"), deviation_information = c(\"a [REG_1]\", \"b\", \"c [lower]\", NA_character_), paper_quotes = c(NA_character_, NA_character_, NA_character_, NA_character_), prereg_quotes = c(\"[REG_0001] quote\", \"[REG_0001] quote\", \"[REG_0001] quote\", \"[REG_0001] quote\")); .fake_table <- function(...) { .calls <<- .calls + 1; .tbl }; .fake_odd <- function(...) { .calls <<- .calls + 1; .odd }; .fake_empty <- function(...) { .calls <<- .calls + 1; regcheck_tidy(list(items = list())) }; .fake_error <- function(...) { .calls <<- .calls + 1; stop(\"RegCheck server unreachable\") }; .fake_partial <- function(...) { .calls <<- .calls + 1; if (.calls == 1) .tbl else stop(\"second prereg failed\") }; .cap <- new.env(); .cap$n <- 0; .submit <- function(url, api_token, paper_text, prereg_text = NULL, registration_id = NULL, client = \"ollama\", dimensions = NULL, reasoning_effort = \"medium\") { .cap$n <- .cap$n + 1; .cap$paper_text <- paper_text; .cap$prereg_text <- prereg_text; .cap$client <- client; .cap$dims <- if (is.null(dimensions)) \"default\" else paste(dimensions$dimension, collapse = \"|\"); list(task_id = paste0(\"task-\", .cap$n)) }; .poll <- function(url, api_token, task_id, poll_interval = 5, timeout = 3600) { list(items = list(list(dimension = \"Paper text\", deviation_judgement = \" Yes \", paper_content_summary = substr(.cap$paper_text, 1, 300), registration_content_summary = as.character(nchar(.cap$paper_text)), deviation_information = paste(\"client:\", .cap$client, \"url:\", url, \"task:\", task_id, \"token:\", api_token, \"dims:\", .cap$dims, \"[PAPER_0001, REG_0002]\"), paper_content_quotes = \"[PAPER_0001] first; [PAPER_0002] second\", registration_content_quotes = \"[REG_0001] q\"), list(dimension = \"Preregistration text\", deviation_judgement = \"Partially\", paper_content_summary = \"p [PAPER_0003]\", registration_content_summary = .cap$prereg_text, deviation_information = \"Details [REG_0001; REG_0002] and [not a ref].\"), list(dimension = \"Exclusions\", deviation_judgement = \"MISSING\", paper_content_summary = \"none\", registration_content_summary = \"none\"))) }; .fake_nodim <- function(...) { .calls <<- .calls + 1; .tbl[, names(.tbl) != \"dimension\", drop = FALSE] }; .fake_noinfo <- function(...) { .calls <<- .calls + 1; .tbl[, names(.tbl) != \"deviation_information\", drop = FALSE] }; .fake_noquotes <- function(...) { .calls <<- .calls + 1; .tbl[, names(.tbl) != \"paper_quotes\", drop = FALSE] }; .poll_full <- function(url, api_token, task_id, poll_interval = 5, timeout = 3600) { list(items = list(list(dimension = \"Full text\", deviation_judgement = \"no\", paper_content_summary = .cap$paper_text, registration_content_summary = .cap$prereg_text))) }; .http <- function(spec) { n <- new.env(); function(req) { u <- req$url; kind <- if (grepl(\"/api/v1/comparisons/text$\", u)) \"text\" else if (grepl(\"/api/v1/comparisons$\", u)) \"multipart\" else \"poll\"; n[[kind]] <- (if (is.null(n[[kind]])) 0 else n[[kind]]) + 1; rs <- spec[[kind]]; if (is.null(rs)) rs <- list(list(404L, NULL)); r <- rs[[min(n[[kind]], length(rs))]]; if (is.null(r[[2]])) httr2::response(r[[1]]) else httr2::response(r[[1]], headers = list(`Content-Type` = \"application/json\"), body = charToRaw(r[[2]])) } }; x <- tp(c(\"https://osf.io/5xysn\", \"https://osf.io/48ncu\"), \"p_two\", c(\"Two preregistrations.\")); x <- httptest2::with_mock_dir(\"upstream/metacheck/tests/testthat/apis\", module_run(x, \"prereg_check\")); x$table$id[c(1)] <- NA_character_; mo <- httptest2::with_mock_dir(\"upstream/metacheck/tests/testthat/apis\", testthat::with_mocked_bindings(module_run(x, \"reg_check\"), regcheck_compare = .fake_table, .package = \"metacheck\")); mo })()"
