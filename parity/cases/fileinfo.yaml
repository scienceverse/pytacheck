- "id": "file_naming_check_length.paths"
  "r": ".file_naming_check_length"
  "py": "pytacheck.fileinfo.naming._file_naming_check_length"
  "args":
    "file_path":
      "$expr":
        "r": "c('a\\\\b\\\\c.R', paste0(strrep('x', 120), '\\\\y.R'), '/abc/de', './x', paste0('./', strrep('y', 51)), 'a//b', paste0(strrep('z', 101), '/'), paste0('/', strrep('w', 60)))"
        "py": "['a\\\\b\\\\c.R', 'x' * 120 + '\\\\y.R', '/abc/de', './x', './' + 'y' * 51, 'a//b', 'z' * 101 + '/', '/' + 'w' * 60]"
- "id": "file_naming_check_length.clean"
  "r": ".file_naming_check_length"
  "py": "pytacheck.fileinfo.naming._file_naming_check_length"
  "args":
    "file_path": ["a.R", "dir/b.R"]
- "id": "file_naming_check_length.na_error"
  "r": ".file_naming_check_length"
  "py": "pytacheck.fileinfo.naming._file_naming_check_length"
  "args":
    "file_path": {"$chr": ["a.R", null]}
- "id": "file_naming_check_length.na_rows"
  "r": ".file_naming_check_length"
  "py": "pytacheck.fileinfo.naming._file_naming_check_length"
  "args":
    "file_path":
      "$expr":
        "r": "c(paste0(strrep('d', 101), '/', strrep('f', 160)), NA)"
        "py": "['d' * 101 + '/' + 'f' * 160, None]"
