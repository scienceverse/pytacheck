# Parity cases for R/file-naming.R and R/file_category.R (pytacheck.fileinfo).
"area": "fileinfo"
"cases":
# -- metacheck::file_types (data/file_types.rda) ---------------------------------
- "id": "file_types.table"
  "r": "identity"
  "py": "pytacheck.fileinfo.types.file_types"
  "args":
    "x":
      "$expr":
        "r": "metacheck::file_types"
        "py": "None"
  "py_drop": ["x"]

# -- filetype() ---------------------------------------------------------------
- "id": "filetype.examples"
  "r": "filetype"
  "py": "pytacheck.fileinfo.category.filetype"
  "args":
    "filename": ["script.R", "b.json", "c.xyz", "noext", "d.JSON", "e.tar.gz", "f.fasta.gz",
                 "x.", "a.R.", "a..", "...", ".", ".R", "x.C++", "sub/dir/x.Rmd", "x.sav.gz",
                 "résumé.CSV", "file.İ", "datarelease.pdf", "my_r_code.pdf", "data.sas",
                 "codebook.sas", "codebook.pdf", "x.JASP", "x.por", "x.html", "a b.docx"]
- "id": "filetype.single"
  "r": "filetype"
  "py": "pytacheck.fileinfo.category.filetype"
  "args":
    "filename": "script.R"
- "id": "filetype.duplicates"
  "r": "filetype"
  "py": "pytacheck.fileinfo.category.filetype"
  "args":
    "filename": ["a.R", "a.R", "b.csv"]
- "id": "filetype.na"
  "r": "filetype"
  "py": "pytacheck.fileinfo.category.filetype"
  "args":
    "filename": {"$chr": ["a.R", null]}
- "id": "filetype.empty"
  "r": "filetype"
  "py": "pytacheck.fileinfo.category.filetype"
  "args":
    "filename": {"$chr": []}
- "id": "filetype.empty_string_error"
  "r": "filetype"
  "py": "pytacheck.fileinfo.category.filetype"
  "args":
    "filename": {"$chr": [""]}
- "id": "filetype.every_extension"
  "r": "filetype"
  "py": "pytacheck.fileinfo.category.filetype"
  "args":
    "filename":
      "$expr":
        "r": "paste0('file.', metacheck::file_types$ext)"
        "py": "['file.' + e for e in __import__('pytacheck.fileinfo.types', fromlist=['x']).file_types()['ext']]"
- "id": "filetype.every_extension_upper"
  "r": "filetype"
  "py": "pytacheck.fileinfo.category.filetype"
  "args":
    "filename":
      "$expr":
        "r": "paste0('FILE.', toupper(metacheck::file_types$ext))"
        "py": "['FILE.' + e.upper() for e in __import__('pytacheck.fileinfo.types', fromlist=['x']).file_types()['ext']]"

# -- file_category() ------------------------------------------------------------
- "id": "file_category.vector"
  "r": "file_category"
  "py": "pytacheck.fileinfo.category.file_category"
  "args":
    "contents": ["a.csv", "b.R", "codebook.xlsx", "readme.txt", "ambiguous", "file.json"]
- "id": "file_category.single"
  "r": "file_category"
  "py": "pytacheck.fileinfo.category.file_category"
  "args":
    "contents": "analysis.R"
- "id": "file_category.data_frame"
  "r": "file_category"
  "py": "pytacheck.fileinfo.category.file_category"
  "args":
    "contents":
      "$df":
        "name": ["a.csv", "b.R", "codebook.xlsx", "readme.txt", "ambiguous", "file.json"]
        "category": ["code", "data", "data", "code", "code", null]
        "filetype": ["data", "code", "data", "text", "text", "code;data"]
- "id": "file_category.edge_cases"
  "r": "file_category"
  "py": "pytacheck.fileinfo.category.file_category"
  "args":
    "contents":
      "$df":
        "name": ["datarelease.pdf", "data.pdf", "my_r_code.pdf", "readme.xls", "data.sas",
                 "codebook.sas", "readme.sas", "codebook.pdf"]
        "category": [null, "data", null, "project", null, null, null, null]
        "filetype": ["text", "text", "text", "data", "stats", "stats", "stats", "text"]
- "id": "file_category.compound_types"
  "r": "file_category"
  "py": "pytacheck.fileinfo.category.file_category"
  "args":
    "contents": ["sample.fasta.gz", "sample.fa.gz", "sample.fq.gz", "sample.fastq.gz",
                 "x.jasp", "x.por", "c.tar.gz", "random.gz", "sample.dat.gz", "x.sav.gz",
                 "x.csv.sav", "script.html", "run.sh", "x.json", "x.rds", "x.ts", "x.1.ada",
                 "B.JaSp", "file.Fasta.GZ", "x.C++", "résumé.csv", ".R", "R", "a.r.", "a..",
                 "archive.zip", "slides.pptx", "fig.png", "paper.pdf", "notes.txt"]
- "id": "file_category.codebook_names"
  "r": "file_category"
  "py": "pytacheck.fileinfo.category.file_category"
  "args":
    "contents": ["code book.pdf", "code_book.xlsx", "Race_IAT.public.2025.codebook.csv",
                 "CODE-BOOK.txt", "data_dictionary.csv", "DataDict.xlsx", "data.dict",
                 "all40_variable key.xlsx", "Variable_Key.pdf", "var_list.txt",
                 "variable-descriptions.docx", "varkey.csv", "WITH.variable.labels.dat",
                 "repetition_texting_tm_data-legend.csv", "coding_manual.pdf",
                 "coding scheme.docx", "CodingSheet.xlsx", "meta_data.csv", "encoding.csv",
                 "codes.csv", "key.csv", "readme.sas", "READ-ME.txt", "Read Me.md",
                 "read__me.md", "readme_codebook.csv", "my_readme", "codebook_readme.R"]
- "id": "file_category.na_and_empty_names"
  "r": "file_category"
  "py": "pytacheck.fileinfo.category.file_category"
  "args":
    "contents": {"$chr": ["a.R", null, "", "data.csv"]}
- "id": "file_category.every_extension"
  "r": "file_category"
  "py": "pytacheck.fileinfo.category.file_category"
  "args":
    "contents":
      "$expr":
        "r": "paste0('file.', metacheck::file_types$ext)"
        "py": "['file.' + e for e in __import__('pytacheck.fileinfo.types', fromlist=['x']).file_types()['ext']]"
- "id": "file_category.given_filetype"
  "r": "file_category"
  "py": "pytacheck.fileinfo.category.file_category"
  "args":
    "contents":
      "$df":
        "name": ["a.R", "b.csv", "c.txt", "d.x", "e.x", "f.x", "g.x", "h.x", "i.x", "j.x"]
        "filetype": [null, "data;stats", "NA", "stats;data", "archive;data", "code;data",
                     "data_x;stats", "data-x;stats", "", "Data"]
        "category": ["codebook", null, null, null, null, null, null, null, "codebook", null]
- "id": "file_category.osf_like"
  "r": "file_category"
  "py": "pytacheck.fileinfo.category.file_category"
  "args":
    "contents":
      "$df":
        "osf_id": ["abc12", "def34", "ghi56", "jkl78"]
        "name": ["analysis.R", "Data", "study1.sav", "codebook.pdf"]
        "kind": ["file", "folder", "file", "file"]
        "filetype": ["code", null, "data", "text"]
        "category": [null, "data", null, null]
- "id": "file_category.partial_match"
  "r": "file_category"
  "py": "pytacheck.fileinfo.category.file_category"
  "args":
    "contents":
      "$df":
        "names": ["a.R", "codebook.csv", "x.jasp"]
        "category_x": [null, "codebook", null]
- "id": "file_category.ambiguous_partial_match"
  "r": "file_category"
  "py": "pytacheck.fileinfo.category.file_category"
  "args":
    "contents":
      "$df":
        "name": ["a.R", "b.csv"]
        "filetypes": ["stats", "x"]
        "filetype_2": ["code", "code"]
- "id": "file_category.existing_file_category"
  "r": "file_category"
  "py": "pytacheck.fileinfo.category.file_category"
  "args":
    "contents":
      "$df":
        "file_category": ["old", "old"]
        "name": ["a.R", "README"]
- "id": "file_category.empty_data_frame"
  "r": "file_category"
  "py": "pytacheck.fileinfo.category.file_category"
  "args":
    "contents": {"$df": {}}
- "id": "file_category.empty_vector"
  "r": "file_category"
  "py": "pytacheck.fileinfo.category.file_category"
  "args":
    "contents": {"$chr": []}
- "id": "file_category.null"
  "r": "file_category"
  "py": "pytacheck.fileinfo.category.file_category"
  "args":
    "contents": {"$null": true}
- "id": "file_category.no_name_error"
  "r": "file_category"
  "py": "pytacheck.fileinfo.category.file_category"
  "args":
    "contents":
      "$df":
        "x": ["code", "data"]
- "id": "file_category.no_name_filetype_error"
  "r": "file_category"
  "py": "pytacheck.fileinfo.category.file_category"
  "args":
    "contents":
      "$df":
        "filetype": ["code"]

# -- check_file_naming() --------------------------------------------------------
- "id": "check_file_naming.mixed"
  "r": "check_file_naming"
  "py": "pytacheck.fileinfo.naming.check_file_naming"
  "args":
    "file_name": ["my file.csv", "data_2.csv", "data_11.csv", "résumé.txt", "x_20231301.csv",
                  "a b&c.R", "ok.R", "file 1.R", "file 12.R", "naïve data.csv", "日本.csv",
                  "a\tb.R", "a\nb.R", "file(1).R", "a+b.R", "a,b.R", "a#b.md", "a~b.txt",
                  "a'b.R", "UPPER_Case.R", "camelCaseName.R", "under_score-dash.R"]
- "id": "check_file_naming.clean"
  "r": "check_file_naming"
  "py": "pytacheck.fileinfo.naming.check_file_naming"
  "args":
    "file_name": ["analysis.R", "data.csv", "README.md", "01_clean.R", "02_model.R"]
- "id": "check_file_naming.single"
  "r": "check_file_naming"
  "py": "pytacheck.fileinfo.naming.check_file_naming"
  "args":
    "file_name": "my file.R"
- "id": "check_file_naming.empty"
  "r": "check_file_naming"
  "py": "pytacheck.fileinfo.naming.check_file_naming"
  "args":
    "file_name": {"$chr": []}
- "id": "check_file_naming.data_type"
  "r": "check_file_naming"
  "py": "pytacheck.fileinfo.naming.check_file_naming"
  "args":
    "file_name": ["a.R", "b.R", "c.xyz", "d"]
    "data_type": {"$chr": ["unknown", null, "data", "unknown"]}
- "id": "check_file_naming.data_type_recycled"
  "r": "check_file_naming"
  "py": "pytacheck.fileinfo.naming.check_file_naming"
  "args":
    "file_name": ["a.R", "b c.R", "d"]
    "data_type": "unknown"
- "id": "check_file_naming.data_type_short"
  "r": "check_file_naming"
  "py": "pytacheck.fileinfo.naming.check_file_naming"
  "args":
    "file_name": ["a.R", "b.R", "c.R"]
    "data_type": ["unknown", "code"]
- "id": "check_file_naming.dates"
  "r": "check_file_naming"
  "py": "pytacheck.fileinfo.naming.check_file_naming"
  "args":
    "file_name": ["x_20230229.csv", "x_20240229.csv", "00000101.csv", "00000229.csv",
                  "19000229.csv", "20000229.csv", "20231301.csv", "20230001.csv",
                  "20230100.csv", "20230132.csv", "20230431.csv", "99991231.csv",
                  "12345678.csv", "20230101.csv", "01000229.csv", "log_1234567890123456.txt",
                  "2023-01-01.csv", "2023010.csv", "data.20231301", "20231301.tar.gz",
                  "a20230230b20230231.R", "id_123456789.csv"]
- "id": "check_file_naming.padding"
  "r": "check_file_naming"
  "py": "pytacheck.fileinfo.naming.check_file_naming"
  "args":
    "file_name": ["pp1.csv", "pp2.csv", "pp10.csv", "pp100.csv", "study1_data.csv",
                  "study2_data.csv", "study12_data.csv", "s01.R", "s2.R", "s003.R",
                  "run-1-a.txt", "run-2-a.txt", "run-10-b.txt", "only9.R", "sub/fig1.png",
                  "fig22.png", "1", "22", "v1.2.3.R", "v1.2.10.R"]
- "id": "check_file_naming.paths"
  "r": "check_file_naming"
  "py": "pytacheck.fileinfo.naming.check_file_naming"
  "args":
    "file_name": ["a.R", "b.R", "c.R", "d.R", "e.R"]
    "file_path":
      "$expr":
        "r": "c(paste0(strrep('d', 101), '/a.R'), paste0('x\\\\', strrep('y', 120), '\\\\b.R'), paste0(strrep('p', 230), '.R'), paste0(strrep('q', 150), '/', strrep('r', 120), '.R'), 'e.R')"
        "py": "['d' * 101 + '/a.R', 'x\\\\' + 'y' * 120 + '\\\\b.R', 'p' * 230 + '.R', 'q' * 150 + '/' + 'r' * 120 + '.R', 'e.R']"
- "id": "check_file_naming.long_names"
  "r": "check_file_naming"
  "py": "pytacheck.fileinfo.naming.check_file_naming"
  "args":
    "file_name":
      "$expr":
        "r": "c(paste0(strrep('n', 50), '.R'), paste0(strrep('é', 49), '.R'), paste0(strrep('m', 48), '.R'), 'dir/sub/ok.R')"
        "py": "['n' * 50 + '.R', 'é' * 49 + '.R', 'm' * 48 + '.R', 'dir/sub/ok.R']"
- "id": "check_file_naming.na_error"
  "r": "check_file_naming"
  "py": "pytacheck.fileinfo.naming.check_file_naming"
  "args":
    "file_name": {"$chr": ["a.R", null]}
- "id": "check_file_naming.na_with_long_paths"
  "r": "check_file_naming"
  "py": "pytacheck.fileinfo.naming.check_file_naming"
  "args":
    "file_name": {"$chr": ["a.R", null, "b c.R"]}
    "file_path":
      "$expr":
        "r": "c(paste0(strrep('d', 101), '/', strrep('f', 160)), NA, 'b c.R')"
        "py": "['d' * 101 + '/' + 'f' * 160, None, 'b c.R']"

