          \ = c(Male = 1, Female = 2, Refused = -99), na_values = -99, label = 'Sex'); df$age <- structure(c(23,\
          \ 45, 31), label = '  Age in years '); df$q1 <- structure(c(1, 2, 3), labels = c('Strongly disagree'\
          \ = 1, 'Strongly agree' = 5)); df$note <- structure(c('a', 'b', 'c'), label = ''); df })"
        "py": "(lambda df: (df.attrs.update({'col_attrs': {'sex': {'label': 'Sex', 'labels': {'Male':\
          \ 1.0, 'Female': 2.0, 'Refused': -99.0}, 'na_values': [-99.0]}, 'age': {'label': '  Age in years\
          \ '}, 'q1': {'labels': {'Strongly disagree': 1.0, 'Strongly agree': 5.0}}, 'note': {'label':\
          \ ''}}}), df)[1])(pd.DataFrame({'id': [1, 2, 3], 'sex': [1.0, 2.0, -99.0], 'age': [23.0, 45.0,\
