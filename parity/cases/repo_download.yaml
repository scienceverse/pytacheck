# Parity cases for the repo_download work item: R/file_category.R, R/file-naming.R,
# data/file_types.rda (metacheck.fileinfo), R/zip-peek.R (metacheck.archives.zip_peek)
# and R/repo-download.R (metacheck.archives.download).
#
# The file-name / file-type cases below are written by hand; the cases after the
# "BEGIN GENERATED" marker come from tests/repo_download/gen_parity_cases.py.
# Fixtures: tests/repo_download/data and tests/repo_download/mocks (made by
# tests/repo_download/make_fixtures.py).
"area": "repo_download"
"cases":
# -- metacheck::file_types (data/file_types.rda) ---------------------------------
- "id": "file_types.table"
  "r": "identity"
  "py": "metacheck.fileinfo.types.file_types"
  "args":
    "x":
      "$expr":
        "r": "metacheck::file_types"
        "py": "None"
  "py_drop": ["x"]

# -- filetype() ---------------------------------------------------------------
- "id": "filetype.examples"
  "r": "filetype"
