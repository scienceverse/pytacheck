# Review cases for coi_check / coi_check_oi (inst/modules/coi_check*.R): module-level
# branches the first pass did not cover (section headers, references, errors in lists, Unicode).
"area": "mod_coi_review"
"cases":
- "id": "coi_check.fixture_sections"
  "module": "coi_check"
  "args":
    "paper":
      "$read":
      - "tests/mod_coi/fixtures/coi_headers.json"
      - "tests/mod_coi/fixtures/coi_refs_only.json"
      - "tests/mod_coi/fixtures/coi_heading_section.json"
- "id": "coi_check.fixture_refs_only"
  "module": "coi_check"
  "args":
    "paper":
      "$paper": "tests/mod_coi/fixtures/coi_refs_only.json"
- "id": "coi_check.fixture_header_only"
