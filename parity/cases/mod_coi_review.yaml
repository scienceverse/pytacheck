- "id": "coi_check.heading_blank_last"
  "module": "coi_check"
  "args":
    "paper":
      "$test_paper":
        "text":
        - "Methods were standard."
        - "Conflict of Interest"
        - ""
  "compare":
    "ignore":
    - "paper_id"
    - "table.paper_id"
    - "summary_table.paper_id"
- "id": "coi_check.heading_blank_blank"
