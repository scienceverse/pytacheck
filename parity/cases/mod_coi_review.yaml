- "id": "coi_check.paperlist_one_errors"
  "module": "coi_check"
  "args":
    "paper":
      "$expr":
        "r": "paperlist(test_paper(c(\"The authors declare no conflict of interest.\")), test_paper(c(\"\
          Methods.\", \"Conflict of interest\")))"
        "py": "pc.PaperList([pc.test_paper(['The authors declare no conflict of interest.']), pc.test_paper(['Methods.',\
          \ 'Conflict of interest'])])"
  "compare":
    "ignore":
    - "paper_id"
    - "table.paper_id"
    - "summary_table.paper_id"
