- "id": "coi_check.paperlist_empty_middle"
  "module": "coi_check"
  "args":
    "paper":
      "$expr":
        "r": "paperlist(test_paper(c(\"Competing interests: none.\")), test_paper(character(0)), test_paper(c(\"\
          No statement here.\")), test_paper(c(\"Conflict of interest: none declared.\")))"
        "py": "pc.PaperList([pc.test_paper(['Competing interests: none.']), pc.test_paper([]), pc.test_paper(['No\
          \ statement here.']), pc.test_paper(['Conflict of interest: none declared.'])])"
  "compare":
    "ignore":
    - "paper_id"
    - "table.paper_id"
    - "summary_table.paper_id"
