"area": "text_extract_review"
# Review cases for the text extractors (R/text-extractors.R, R/extract-tests.R,
# R/text-json_expand.R, R/causal_sentences.R): data-frame inputs, missing text,
# zero-row inputs, paper lists with ids in non-C order, Unicode spacing and
# case folding, and the type.convert()/jsonlite corners of json_expand().
"cases":
# ------------------------------------------------------------ extract_p_values
- "id": "extract_p_values.review.df_no_text_col"
  "r": "extract_p_values"
  "py": "pytacheck.text.extract.extract_p_values"
  "args":
    "paper":
      "$df":
        "sentence": ["p = .01 and t = 2", "none"]
- "id": "extract_p_values.review.df_na_text"
  "r": "extract_p_values"
  "py": "pytacheck.text.extract.extract_p_values"
  "args":
    "paper":
      "$expr":
        "r": "data.frame(text = c('p = .05', NA, 't = 2, p = .1'), text_id = 1:3, paper_id = 'a')"
        "py": "pd.DataFrame({'text': pd.Series(['p = .05', None, 't = 2, p = .1'], dtype='string'), 'text_id': pd.Series([1, 2, 3], dtype='Int64'), 'paper_id': pd.Series(['a'] * 3, dtype='string')})"
- "id": "extract_p_values.review.df_extra_first_col"
  "r": "extract_p_values"
  "py": "pytacheck.text.extract.extract_p_values"
  "args":
    "paper":
      "$df":
        "n": [1, 2]
        "text": ["p = .05", "x"]
- "id": "extract_p_values.review.zero_rows"
  "r": "extract_p_values"
  "py": "pytacheck.text.extract.extract_p_values"
  "args":
    "paper":
      "$expr":
        "r": "data.frame(text = character(0))"
        "py": "pd.DataFrame({'text': pd.Series([], dtype='string')})"
- "id": "extract_p_values.review.refs_excluded"
  "r": "extract_p_values"
  "py": "pytacheck.text.extract.extract_p_values"
  "args":
    "paper":
      "$df":
        "text": ["We found p = .03.", "Smith (2020) reported p < .001.", "p = .2"]
        "section_type": ["results", "references", "discussion"]
        "text_id": [1, 2, 3]
        "paper_id": ["x", "x", "x"]
- "id": "extract_p_values.review.unicode_space"
  "r": "extract_p_values"
  "py": "pytacheck.text.extract.extract_p_values"
  "args":
    "paper":
      "$test_paper":
        "text":
        - "p = .03 and p < .001 and p = .04"
        - "P = .5, p\t=\t.06, p\n<\n.07"
        - "p = .05 e-3 and p = .05e-3 and p = 1.5×10^-3"
  "compare": {"ignore": ["paper_id"]}
- "id": "extract_p_values.review.paperlist_ids"
  "r": "extract_p_values"
  "py": "pytacheck.text.extract.extract_p_values"
  "args":
    "paper":
      "$expr":
        "r": "paperlist(local({p <- test_paper(c('t(10) = 2.1, p = .05', 'p < .01')); p$paper_id <- 'b'; p}), local({p <- test_paper(c('p > .2')); p$paper_id <- 'B'; p}), local({p <- test_paper(c('none', 'p = n.s.')); p$paper_id <- 'a'; p}))"
        "py": "pc.PaperList([(lambda p, i: (p.__setitem__('paper_id', i), p)[1])(pc.test_paper(t), i) for t, i in [(['t(10) = 2.1, p = .05', 'p < .01'], 'b'), (['p > .2'], 'B'), (['none', 'p = n.s.'], 'a')]])"
