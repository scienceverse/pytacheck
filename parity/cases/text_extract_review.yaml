        "py": "pd.DataFrame({'text': pd.Series(['p = .05', None, 't = 2, p = .1'], dtype='string'), 'text_id': pd.Series([1, 2, 3], dtype='Int64'), 'paper_id': pd.Series(['a'] * 3, dtype='string')})"
