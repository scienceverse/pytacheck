        "r": "paperlist(local({p <- test_paper(c('https://osf.io/b', 'x')); p$paper_id <- 'b'; p}), local({p <- test_paper(c('none')); p$paper_id <- 'B'; p}), local({p <- test_paper(c('www.a.org and osf.io/a')); p$paper_id <- 'a'; p}))"
        "py": "pc.PaperList([(lambda p, i: (p.__setitem__('paper_id', i), p)[1])(pc.test_paper(t), i) for t, i in [(['https://osf.io/b', 'x'], 'b'), (['none'], 'B'), (['www.a.org and osf.io/a'], 'a')]])"
