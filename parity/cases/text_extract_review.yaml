- "id": "extract_urls.review.caseless_unicode"
  "r": "extract_urls"
  "py": "pytacheck.text.extract.extract_urls"
  "args":
    "paper":
      "$test_paper":
        "text":
        - "WWW.EXAMPLE.COM and Example.Org/Path and HTTP://X.IO"
        - "ex.ſſ and ex.KK and ex.été and café.org"
        - "https://example.org/été and https://example.org/a b and https://example.org/x y"
