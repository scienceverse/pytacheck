      "$test_paper":
        "text": ["1 = 2", "3 < 4 and 5 > 6"]
  "compare": {"ignore": ["paper_id"]}
- "id": "extract_eq.review.text_id_na_error"
  "known_divergence": {"kind": "r_bug_fixed", "ref": "U10", "reason": "rows without text_id are grouped by their source sentence (R fails on NA comparisons)"}
  "r": "extract_eq"
  "py": "pytacheck.text.extract.extract_eq"
  "args":
    "paper":
      "$df":
        "text": ["t = 2.1", "F = 3"]
        "paper_id": ["a", "a"]
- "id": "extract_eq.review.paperlist_ids"
  "r": "extract_eq"
  "py": "pytacheck.text.extract.extract_eq"
  "args":
    "paper":
      "$expr":
        "r": "paperlist(local({p <- test_paper(c('a < 2 and b = 3', 'c = 4', 'd > 5, e = 6', 'f ≤ 7')); p$paper_id <- 'b'; p}), local({p <- test_paper(c('g > 5', 'h = 1')); p$paper_id <- 'B'; p}), local({p <- test_paper(c('none', 'k ≈ 2 and m < 3')); p$paper_id <- 'a'; p}))"
        "py": "pc.PaperList([(lambda p, i: (p.__setitem__('paper_id', i), p)[1])(pc.test_paper(t), i) for t, i in [(['a < 2 and b = 3', 'c = 4', 'd > 5, e = 6', 'f ≤ 7'], 'b'), (['g > 5', 'h = 1'], 'B'), (['none', 'k ≈ 2 and m < 3'], 'a')]])"
- "id": "extract_eq.review.refs_excluded"
  "r": "extract_eq"
  "py": "pytacheck.text.extract.extract_eq"
  "args":
    "paper":
      "$df":
        "text": ["t(20) = 2.1, p = .03", "Smith (2020), F(1, 2) = 5.", "r = .3"]
        "section_type": ["results", "references", "discussion"]
        "text_id": [1, 2, 3]
        "paper_id": ["x", "x", "x"]
- "id": "extract_eq.review.unicode"
  "r": "extract_eq"
  "py": "pytacheck.text.extract.extract_eq"
  "args":
    "paper":
      "$test_paper":
        "text":
        - "t = 2.1, p = .03, F(1, 20) = 3.2"
        - "t(20) = 2.3 and χ²(2) = 4.1 and µ = 3.2 and Ω = 4"
        - "K = 5, ſd = 3, ΔR² = .05, Cohen s d(1) = .3"
        - "t( 28 ) = 2.4; F(2,\n57)\t=\t4.21; M = −0.5"
  "compare": {"ignore": ["paper_id"]}
