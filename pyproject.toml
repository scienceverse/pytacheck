[project]
name = "pytacheck"
version = "0.1.0"
description = "High-performance Python production engine for validated Metacheck research checks"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "AGPL-3.0-or-later"
authors = [
    { name = "Scienceverse" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "fastapi>=0.115.0",
    "prometheus-client>=0.21.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.31",
    "scipy>=1.14.0",
    "uvicorn[standard]>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["pytacheck", "README.md", "LICENSE.md", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["pytacheck"]

[dependency-groups]
dev = [
    "build>=1.2.2",
    "mypy>=1.15.0",
    "pytest>=9.0.1",
    "ruff>=0.8.0",
]

[tool.uv]
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.ruff]
target-version = "py312"
line-length = 100
force-exclude = true

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "ARG",
    "SIM",
    "S",
    "LOG",
]
ignore = [
    "E501",
    "S101",
    "B008",
    "SIM105",
    "SIM108",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S108", "S301", "S314", "S603", "ARG", "E402", "SIM117"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_untyped_defs = false
no_implicit_optional = true
strict_equality = true
extra_checks = true
