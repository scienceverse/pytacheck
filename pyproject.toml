[project]
name = "metacheck"
# Versioning: this port has its own version line, starting at 0.4.0 (0.4.0a1 is
# the first release). The version does not follow the R package's. The R commit
# each release is compared against is recorded in parity/UPSTREAM.toml and named
# in the release notes (CHANGELOG.md).
version = "0.4.0a2"
description = "Check research outputs for best practices: the Python version of metacheck, a fast, parity-tested port of the ScienceVerse R package."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE.md", "NOTICE"]
authors = [
    { name = "Scienceverse", email = "jakub@jakubwerner.com" },
]
maintainers = [
    { name = "Jakub Werner", email = "jakub@jakubwerner.com" },
]
keywords = ["metascience", "research-quality", "open-science", "statcheck", "metacheck", "bibr"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "pandas>=3.1.0",
    "numpy>=1.26",
    "scipy>=1.13",
    # `regex` (not `re`): POSIX leftmost-longest matching, POSIX bracket
    # classes and \m/\M word anchors are needed to reproduce R's TRE engine.
    "regex>=2026.9.29",
    "orjson>=3.13.0",
    # Native edit distance for reference matching (the Python fallback is quadratic).
    "rapidfuzz>=3.10,<4",
    "httpx[http2]>=0.28.1,<1",
    "packaging>=24",
    "h2>=4.4.1",
    "lxml>=5.3",
    "markdown-it-py>=3.0",
    "platformdirs>=4.13.6",
    "rich>=13.7",
    # codecheck reads YAML (Quarto/R Markdown headers, codecheck.yml)
    "pyyaml>=6.0.2",
    # the encoding of a code file that is not UTF-8 (0BSD since 7.0)
    "chardet>=7.7.0",
]

[project.optional-dependencies]
# Tight integration with bibr: `metacheck.read("paper.pdf")` and
# `pytacheck check paper.pdf` run the bibr extraction pipeline in-process.
bibr = ["bibr>=0.6.0"]
# data_check & co.: SPSS/Stata/SAS files (pyreadstat), legacy .xls (xlrd; .xlsx
# and .ods are read without extra packages), distribution plots (matplotlib),
# Porter stemming of codebook labels (snowballstemmer, as metacheck's SnowballC;
# without it R's crude trailing-"s" stripper is used) and PDF codebook text
# (pypdf, a fallback: poppler's `pdftotext`, what metacheck's pdftools wraps, is
# the parity engine and is used when found on PATH or via PYTACHECK_PDFTOTEXT) and
# the text of RTF codebooks (striprtf; without it an RTF codebook is read as raw lines).
data = [
    "pyreadstat>=1.3.7",
    "xlrd>=2.0.1",
    "matplotlib>=3.8",
    "snowballstemmer>=2.2",
    "pypdf>=6.20.0",
    "striprtf>=0.0.35",
]
# REST API server (port of metacheck's plumber API).
api = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "python-multipart>=0.0.31",
]
# The local demo app: `metacheck-app` opens a Gradio page in the browser.
app = ["gradio>=6.30.0,<7"]
# Kept so that `metacheck[charset]` still installs: chardet is a core dependency.
charset = []
# The R engine (metacheck.rengine): R metacheck's own checks, run with Rscript and shown
# with pytacheck's report. It needs no Python package; it needs R with the metacheck R
# package (see docs/R_ENGINE.md, and `pytacheck r-engine` to check).
r = []
# data_check's local column-concept classifier (an int8 ONNX model, ~540 MB,
# downloaded once from the Hugging Face Hub; see metacheck.datacheck.concepts).
concepts = ["onnxruntime>=1.31.1", "tokenizers>=0.21", "huggingface-hub>=2.3.0"]
# llm(): the official provider SDKs, imported only when a model is called. The
# caps are major versions; these SDKs release several times a week.
llm = ["openai>=3.3,<4", "anthropic>=2.3.0,<3", "google-genai>=2.33.0,<3"]
all = ["metacheck[bibr,data,api,charset,concepts,llm]"]

[project.urls]
Homepage = "https://github.com/scienceverse/pytacheck"
Documentation = "https://github.com/scienceverse/pytacheck#readme"
Source = "https://github.com/scienceverse/pytacheck"
Issues = "https://github.com/scienceverse/pytacheck/issues"
Changelog = "https://github.com/scienceverse/pytacheck/blob/main/CHANGELOG.md"
Upstream = "https://github.com/scienceverse/metacheck"

[project.scripts]
metacheck = "metacheck.cli:main"
pytacheck = "metacheck.cli:main"
metacheck-app = "metacheck.app:main"
metacheck-setup = "metacheck.app.setup:main"

[project.entry-points."pytacheck.modules"]
# Third-party packages can register modules under this entry-point group.

[project.entry-points."pytacheck.packs"]
# Packs installed with pip. metacheck registers its own data package checks this
# way: they have no metacheck (R) counterpart, so they stay out of the built-in
# metacheck:: modules that mirror it.
datapackage = "metacheck.datapackage.modules"

[build-system]
# setuptools only compiles the optional C reader of .rds files (hatch_build.py)
requires = ["hatchling>=1.32.4", "setuptools>=84.2.1"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["/src/metacheck", "/src/pytacheck", "/README.md", "/LICENSE.md", "/NOTICE", "/CITATION.cff", "/CHANGELOG.md", "/pyproject.toml", "/hatch_build.py"]
exclude = ["*.so", "*.pyd"]

[tool.hatch.build.targets.wheel]
packages = ["src/metacheck", "src/pytacheck"]
# the C reader is compiled by hatch_build.py and added there; a copy built in
# place by an editable install is not taken along
exclude = ["*.so", "*.pyd", "*.c"]

# The optional C reader of .rds/.RData files: built where a C compiler is
# available, else the wheel is pure Python (METACHECK_PURE_PYTHON=1 forces that).
[tool.hatch.build.targets.wheel.hooks.custom]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.6",
    "pytest-benchmark>=5.1",
    "hypothesis>=6.170.12",
    "respx>=0.22",
    "ruff>=0.17.3",
    "mypy>=2.4.0",
    "pandas-stubs>=2.2",
    "types-regex>=2026.9.29.20261017",
    "lxml-stubs>=0.5",
    "pre-commit>=4.7.0",
    "pip-audit>=2.7",
    # builds spreadsheet fixtures in tests (the runtime readers do not need it)
    "openpyxl>=3.1",
]

[tool.uv]
# rebuild the editable install (and its C reader) when the C source changes
cache-keys = [{ file = "pyproject.toml" }, { file = "hatch_build.py" }, { file = "src/metacheck/datacheck/_rdata_c.c" }]
constraint-dependencies = [
    "h2>=4.4.1",
    "idna>=3.15",
    "urllib3>=2.7.0",
]
# gradio (6.31 and earlier) caps pillow below 13, the first release with the fixes
# for pillow 12.3's advisories; lift the cap until gradio does. The installers pass
# install/constraints-app.txt as overrides too, so the app gets the same pillow.
override-dependencies = ["pillow>=13.0.0"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "parity"]
# notebooks and markdown are test fixtures or prose (ruff >= 0.16 formats both by default)
extend-exclude = ["upstream", "*.ipynb", "*.md"]
force-exclude = true

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG",  # flake8-unused-arguments
    "SIM",  # flake8-simplify
    "S",    # flake8-bandit (security)
    "LOG",  # flake8-logging
    "PERF", # perflint
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # line length is handled by the formatter
    "S101",   # asserts
    "SIM105", # try/except/pass reads better than contextlib.suppress here
    "SIM108", # ternaries hurt readability for multi-branch R ports
    "RUF001", # ambiguous unicode: regexes legitimately contain ≤ ≥ − etc.
    "RUF002",
    "RUF003",
    "PERF203", # try/except in loops mirrors R tryCatch-per-item semantics
]

[tool.ruff.lint.isort]
known-first-party = ["metacheck", "pytacheck", "parity", "tests"]

[tool.ruff.lint.per-file-ignores]
"src/metacheck/__init__.py" = ["F401"]  # TYPE_CHECKING re-exports; __all__ is built from _EXPORTS
"tests/**/*.py" = ["S", "ARG", "E402", "SIM117", "PERF"]
"tests/repro_core/fixtures/python/*.py" = ["F821"]  # copies of metacheck's scripts, errors included
"parity/**/*.py" = ["S", "ARG"]
"scripts/**/*.py" = ["S", "ARG", "E402"]
"benchmarks/**/*.py" = ["S", "ARG"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "slow: slow tests (deselect with '-m \"not slow\"')",
    "network: tests that need live network access (deselected by default in CI)",
    "parity: comparisons against the R reference goldens",
    "r: tests that need a working R + metacheck installation",
]

[tool.coverage.run]
branch = true
source = ["metacheck", "pytacheck"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["metacheck", "pytacheck"]
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["scipy.*", "pyreadstat.*", "odf.*", "xlrd.*", "bibr.*", "respx.*", "yaml.*", "snowballstemmer.*", "onnxruntime.*", "striprtf.*"]
ignore_missing_imports = true
