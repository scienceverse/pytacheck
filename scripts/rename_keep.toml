# Decisions for scripts/rename_to_metacheck.py (RENAME-1).
#
# Every occurrence of "pytacheck" that the script's generic rules do not
# classify must be covered here, or the script fails. An entry covers each
# occurrence inside a match of `match` (a Python regex, searched in each line)
# in the files matching `files` (fnmatch; `*` also matches `/`). Paths are the
# paths after the move (src/metacheck/...). The first matching entry wins, and
# entries come before the generic rules.
#
#   action       "keep": the occurrence stays "pytacheck";
#                "rewrite": it becomes "metacheck"
#   count        exact number of occurrences the entry must cover (omit it for
#                entries that also cover lines edited by hand after the run);
#                a rewrite entry covers nothing once it has been applied, and
#                that is not drift
#   why          the reason, and the package that renames it later, if any
#
# RENAME-2, RENAME-3 and RENAME-4 remove entries as they rename these names.

# --- entry-point groups: read as they are; no metacheck.* twin (decision 13 (a), STORE-2b)

[[rule]]
action = "keep"
files = "pyproject.toml"
match = '\[project\.entry-points\."pytacheck\.modules"\]'
count = 1
why = "entry-point group declared for legacy module plugins"

[[rule]]
action = "keep"
files = "src/metacheck/module.py"
match = 'group="pytacheck\.modules"|^``pytacheck\.modules``\), ``\./|legacy ``pytacheck\.modules`` entry points'
count = 3
why = "entry-point group pytacheck.modules"

[[rule]]
action = "keep"
files = "src/metacheck/packs/registry.py"
match = 'ENTRY_POINT_GROUP = "pytacheck\.packs"|registering the ``pytacheck\.packs``'
count = 2
why = "entry-point group pytacheck.packs"

# --- distribution names (the old distribution is still accepted)

[[rule]]
action = "keep"
files = "src/metacheck/_version.py"
match = '_OLD_DISTRIBUTION = "pytacheck"|; "pytacheck" is what installs'
