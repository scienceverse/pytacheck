    (?<!import_module\()(?<!find_spec\()(?<!importorskip\()(?<!__import__\()
    (?<!sys\.modules,\ )(?<!"-m",\ )"pytacheck"(?=\s*[:,)\]}]|$) (?# a store id as a value or key)
