# uv run pre-commit install
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --exit-non-zero-on-fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: goldens-not-hand-edited
        name: goldens come from R (python -m parity generate)
        entry: bash -c 'echo "parity/golden is generated by R; regenerate instead of editing" >&2; exit 1'
        language: system
        files: ^parity/golden/
        stages: [manual]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=2000]
      - id: end-of-file-fixer
        exclude: ^parity/golden/
      - id: trailing-whitespace
        exclude: ^parity/golden/
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
